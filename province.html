<style>

<body>
<header>
  <div class="hrow">
    <h1 id="provTitle">省级景区详情 <span id="provSub"></span></h1>
    <a id="backProv" class="back" style="display:none" href="province.html">← 全省</a>
    <a class="back" href="index.html">← 返回全国地图</a>
  </div>
  <div class="toolbar">
    <select id="provJump"><option value="">切换省份…</option></select>
    <select id="lvSel"><option value="">全部等级</option><option value="5A">5A</option><option value="4A">4A</option></select>
    <select id="sortSel"><option value="">默认排序</option><option value="rate">⭐ 评分优先</option></select>
    <select id="citySel"><option value="">全部城市</option></select>
    <input id="kw" type="search" placeholder="搜索景区名…">
  </div>
  <div class="type-bar">
    <span class="tbtn active" data-t="all">全部</span>
    <span class="tbtn" data-t="scenic">🏛 景区</span>
    <span class="tbtn" data-t="food">🍜 美食</span>
    <span class="tbtn" data-t="stay">🏨 住宿</span>
    <span class="tbtn" data-t="hot">📸 网红点</span>
  </div>
  <div class="chips" id="provChips" aria-label="省份快速跳转"></div>
</header>
<div class="chips" id="cityChips"></div>
<p id="seoIntro" style="max-width:960px;margin:10px auto 0;padding:0 16px;font-size:12px;color:#8b949e;line-height:1.8;">全国A级景区总表：收录全国1310家5A/4A级景区（数据来源文旅部公报名录），支持按省份、城市、等级筛选，附游客真实评价、门票价格与高德一键导航。热门：山西451家、运城55家、浙江48家。</p>
<main>
  <div class="stats" id="stats"></div>
  <div id="list"></div>
  <button class="tbtn" id="moreBtn" type="button" style="display:none;margin:16px auto;">加载更多</button>
  <div class="empty" id="empty" style="display:none">没有符合条件的景区</div>
</main>
<footer>数据：文旅部公报A级景区名录 · 评价来自携程/大众点评等公开平台 · <a href="index.html" style="color:#58a6ff">全国旅游攻略地图</a> · <a href="taste.html" style="color:#58a6ff">食宿网红专题</a> · <a href="shanxi.html" style="color:#58a6ff">山西451家A级总表（表格版）</a></footer>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
const $ = id => document.getElementById(id);
let spots = [], featured = [], curType = 'all', prov = '', cityParam = '', cityMap = {}, allData = [];
const TYPE_LABEL = { food: '🍜 美食', stay: '🏨 住宿', hot: '📸 网红点' };
function q(name) { return new URLSearchParams(location.search).get(name) || ''; }
function gaode(lat, lng, name) { return 'https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=' + encodeURIComponent(name); }
function init() {
  prov = q('p');
  cityParam = q('c');
  const t0 = q('t');
  if (t0 && document.querySelector('.tbtn[data-t="' + t0 + '"]')) {
    curType = t0;
    document.querySelectorAll('.type-bar .tbtn').forEach(b => b.classList.toggle('active', b.dataset.t === t0));
    $('lvSel').value = '';
  }
  document.title = (prov ? prov + (cityParam ? '·' + cityParam : '') : '全国') + '旅游总表 | 全国旅游攻略地图';
  $('provTitle').childNodes[0].textContent = (prov || '全国') + (cityParam ? ' · ' + cityParam : '') + '旅游总表 ';
  if (prov) { $('backProv').style.display = 'inline'; $('backProv').href = 'province.html?p=' + encodeURIComponent(prov); }
  fetch('data/city_map.json').then(r => r.json()).catch(() => ({})).then(cm => {
    cityMap = cm || {};
    return fetch('data/national.json').then(r => r.json());
  }).then(data => {
    allData = data;
    if (prov) {
      spots = data.filter(x => x.p === prov);
      if (!spots.length) spots = data.filter(x => x.p.startsWith(prov) || prov.startsWith(x.p.slice(0, 2)));
    } else { spots = data; }
    const cn = x => cityMap[x.p + '|' + x.c] || x.c || '';
    const cities = [...new Set(spots.map(cn).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
    cities.forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; $('citySel').appendChild(o); });
    if (cityParam) $('citySel').value = cityParam;
    buildProvJump();
    buildCityChips(cities);
    return fetch('data/featured.json').then(r => r.json()).catch(() => []);
  }).then(feat => {
    featured = prov ? feat.filter(x => x.prov === prov) : feat;
    buildProvChips();
    rebuild();
  }).catch(() => {
    $('seoIntro').textContent = '数据加载失败，请检查网络后刷新重试。';
    $('seoIntro').style.color = '#f85149';
  });
  $('lvSel').onchange = rebuild; $('citySel').onchange = rebuild; $('kw').oninput = rebuild; $('sortSel').onchange = rebuild;
  $('moreBtn').onclick = renderMore;
  document.querySelectorAll('.type-bar .tbtn').forEach(b => b.onclick = () => {
    document.querySelectorAll('.tbtn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); curType = b.dataset.t;
    if (curType !== 'all') { $('lvSel').value = ''; }
    rebuild();
  });
}
function buildProvChips() { // 全国模式：省份快速跳转 chips
  const box = $('provChips');
  if (prov) { box.classList.remove('show'); return; }
  const ps = [...new Set(allData.map(x => x.p))].sort((a, b) => a.localeCompare(b, 'zh'));
  ps.forEach(p => {
    const a = document.createElement('a');
    a.className = 'chip';
    a.textContent = p.replace(/(维吾尔|回族|壮族)?自治区$|省$/, '');
    a.href = 'province.html?p=' + encodeURIComponent(p);
    box.appendChild(a);
  });
  box.classList.add('show');
}
function buildProvJump() {
  const ps = [...new Set(allData.map(x => x.p))].sort((a, b) => a.localeCompare(b, 'zh'));
  const sel = $('provJump');
  ps.forEach(p => {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = p.replace(/(维吾尔|回族|壮族)?自治区$|省$/, '');
    if (p === prov) o.selected = true;
    sel.appendChild(o);
  });
  sel.onchange = () => { if (sel.value) location.href = 'province.html?p=' + encodeURIComponent(sel.value); };
}
function buildCityChips(cities) {
  const box = $('cityChips');
  if (!cities.length) return;
  box.classList.add('show');
  cities.forEach(c => {
    const a = document.createElement('a');
    a.className = 'chip' + (c === cityParam ? ' active' : '');
    a.textContent = c;
    a.href = 'province.html?p=' + encodeURIComponent(prov) + '&c=' + encodeURIComponent(c);
    box.appendChild(a);
  });
}
const PAGE_SIZE = 60;
let shown = 0, lastRows = [];
function render() { // 追加一页
  const rows = lastRows;
  const moreBtn = $('moreBtn');
  const frag = document.createDocumentFragment();
  rows.slice(shown, shown + PAGE_SIZE).forEach(({ kind, x }) => frag.appendChild(kind === 'spot' ? spotCard(x) : featCard(x)));
  shown = Math.min(shown + PAGE_SIZE, rows.length);
  $('list').appendChild(frag);
  moreBtn.style.display = rows.length > shown ? 'block' : 'none';
  moreBtn.textContent = '加载更多（已显示 ' + shown + '/' + rows.length + '）';
}
function rebuild() { // 筛选变化：重置分页从头渲染
  shown = 0; $('list').innerHTML = '';
  buildRows();
  render();
}
function renderMore() { render(); }
function buildRows() {
  const lv = $('lvSel').value, city = $('citySel').value, kw = $('kw').value.trim().toLowerCase();
  const cnCity = x => cityMap[x.p + '|' + x.c] || x.c || '';
  const cMatch = x => !city || cnCity(x) === city;
  const cityBase = (city || '').replace(/市$/, '');
  const featCity = x => !cityBase || (x.county || '').includes(cityBase) || (x.addr || '').includes(cityBase);
  const a5 = spots.filter(x => x.l === '5A').length, a4 = spots.filter(x => x.l === '4A').length;
  const free = spots.filter(x => (x.t || '').includes('免费')).length;
  $('provSub').textContent = a5 + '家5A · ' + a4 + '家4A';
  let rows;
  if (curType === 'all') {
    rows = spots.filter(x => (!lv || x.l === lv) && cMatch(x) && (!kw || x.n.toLowerCase().includes(kw)))
      .map(x => ({ kind: 'spot', x }));
    const fkw = x => !kw || x.name.toLowerCase().includes(kw);
    if (!lv) featured.filter(x => x.type !== 'scenic' && fkw(x) && featCity(x)).forEach(x => rows.push({ kind: 'feat', x }));
  } else if (curType === 'scenic') {
    rows = spots.filter(x => (!lv || x.l === lv) && cMatch(x) && (!kw || x.n.toLowerCase().includes(kw))).map(x => ({ kind: 'spot', x }));
  } else {
    rows = featured.filter(x => x.type === curType && (!kw || x.name.toLowerCase().includes(kw)) && featCity(x)).map(x => ({ kind: 'feat', x }));
  }
  if ($('sortSel').value === 'rate') rows = rows.slice().sort((a, b) => (b.kind === 'spot' ? rate(b.x) : 0) - (a.kind === 'spot' ? rate(a.x) : 0) || (a.kind === 'spot' ? -1 : 1));
  $('stats').innerHTML = '<div class="stat"><b>' + spots.length + '</b>A级景区</div>'
    + '<div class="stat"><b>' + a5 + '</b>5A景区</div>'
    + '<div class="stat"><b>' + a4 + '</b>4A景区</div>'
    + '<div class="stat"><b>' + free + '</b>免费景区</div>'
    + '<div class="stat"><b>' + featured.filter(x => x.type !== 'scenic').length + '</b>精选食宿网红</div>'
    + '<div class="stat"><b>' + rows.length + '</b>当前筛选</div>';
  $('empty').style.display = rows.length ? 'none' : 'block';
  lastRows = rows;
}
function rate(x) { const m = (x.q || '').match(/⭐(\d\.\d)/); return m ? parseFloat(m[1]) : 0; }
function haversineKm(a, b) {
  const R = 6371, r = Math.PI / 180;
  const dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r;
  const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function nearSpots(x, n) { // 同省 60km 内最近的 n 家（排除自身）
  return spots
    .filter(s => s !== x && s.p === x.p && s.lat && x.lat)
    .map(s => ({ s, km: haversineKm(x, s) }))
    .filter(o => o.km <= 60)
    .sort((a, b) => a.km - b.km)
    .slice(0, n);
}
function spotCard(x) {
  const is5 = x.l === '5A';
  const near = nearSpots(x, 3);
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="card-top"><span class="badge ' + (is5 ? 'b5' : 'b4') + '">' + (x.l || 'A') + '</span><h2></h2></div>'
    + '<p class="meta"><span>📍 ' + (cityMap[x.p + '|' + x.c] || x.p) + '</span><span>🎫 ' + (x.t || '票价待核实') + '</span>' + (rate(x) ? '<span>⭐ <b style="color:#f0c674">' + rate(x) + '</b></span>' : '') + '</p>'
    + '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="' + gaode(x.lat, x.lng, x.n) + '">🧭 高德导航</a>'
    + (x.q ? '<button class="btn rev">💬 游客评价</button>' : '') + '</div>'
    + (near.length ? '<p class="meta" style="margin-top:6px;"><span style="color:#8b949e;">🚶 顺路可玩：</span>'
      + near.map(o => '<a href="javascript:void 0" class="near-link" style="color:#58a6ff;">' + o.s.n.replace(/</g, '&lt;') + '</a>（' + Math.round(o.km) + 'km）').join(' · ') + '</p>' : '')
    + (x.q ? '<div class="rev-box">' + x.q + '</div>' : '');
  card.querySelector('h2').textContent = x.n;
  const rb = card.querySelector('.rev-box');
  if (rb) card.querySelector('.rev').onclick = () => rb.classList.toggle('open');
  card.querySelectorAll('.near-link').forEach((a, i) => {
    a.onclick = () => { $('kw').value = near[i].s.n; rebuild(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
  });
  return card;
}
function featCard(x) {
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="card-top"><span class="badge bf">' + (TYPE_LABEL[x.type] || '📍') + '</span><h2></h2></div>'
    + '<p class="meta"><span>📍 ' + (x.county || x.prov) + '</span>' + (x.price ? '<span>💰 ' + x.price + '</span>' : '') + (x.rating ? '<span>⭐ ' + x.rating + '</span>' : '') + '</p>'
    + '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="' + gaode(x.lat, x.lng, x.name) + '">🧭 高德导航</a>'
    + (x.review ? '<button class="btn rev">💬 评价详情</button>' : '') + '</div>'
    + (x.review ? '<div class="rev-box">' + x.review + '</div>' : '');
  card.querySelector('h2').textContent = x.name;
  const rb = card.querySelector('.rev-box');
  if (rb) card.querySelector('.rev').onclick = () => rb.classList.toggle('open');
  return card;
}
init();

// ===== 返回顶部 =====
(function() {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.setAttribute('aria-label', '返回顶部');
  btn.textContent = '↑';
  btn.style.cssText = 'position:fixed;right:14px;bottom:96px;width:42px;height:42px;border-radius:50%;background:#21262d;border:1px solid #30363d;color:#c9d1d9;font-size:17px;display:none;z-index:1200;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.4);';
  btn.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
  document.body.appendChild(btn);
  window.addEventListener('scroll', function() { btn.style.display = window.scrollY > 400 ? 'block' : 'none'; }, { passive: true });
})();
</script>
</body>
