<main>
<h1>🔍 全站搜索</h1>
<div class="search-wrap">
<input id="q" type="search" placeholder="搜景区 / 美食 / 住宿 / 网红点 / 城市 / 专题…" autocomplete="off" aria-label="搜索站内内容">

</div>
<div class="chips" role="group" aria-label="类型筛选">
<button class="chip" data-f="all" aria-pressed="true">全部</button>
<button class="chip" data-f="scenic" aria-pressed="false">🏛 景点</button>
<button class="chip" data-f="food" aria-pressed="false">🍜 美食</button>
<button class="chip" data-f="stay" aria-pressed="false">🏨 住宿</button>
<button class="chip" data-f="hot" aria-pressed="false">📸 网红点</button>
<button class="chip" data-f="topic" aria-pressed="false">🗺 专题</button>
<button class="chip" data-f="city" aria-pressed="false">🏙 城市</button>
<button class="chip" data-f="prov" aria-pressed="false">🗺 省份</button>
</div>
<div class="chips" aria-label="热门搜索">
<span style="color:#8b949e;font-size:12.5px;align-self:center;">热门：</span>
<button class="chip hotk">西安</button><button class="chip hotk">大理</button><button class="chip hotk">洱海</button><button class="chip hotk">莫高窟</button><button class="chip hotk">5A</button><button class="chip hotk">火锅</button>
</div>

</main>

<footer>数据：文旅部A级景区公报 · 评价来自携程/大众点评等公开平台<br><a href="index.html">全国旅游攻略地图</a> · <a href="province.html">全国A级景区总表</a> · <a href="taste.html">食宿网红专题</a> · <a href="free.html">免费景区榜</a> · <a href="winter.html">❄️ 冬季专题</a> · <a href="guzhen.html">🏘️ 古镇专题</a> · <a href="haidao.html">🏝️ 海岛专题</a> · <a href="museum.html">🏛️ 博物馆专题</a> · <a href="chun.html">🌸 赏花专题</a></footer>
<script>
(function(){
var IDX=null,filter='all',timer=null;
var q=document.getElementById('q'),results=document.getElementById('results'),
    meta=document.getElementById('meta'),empty=document.getElementById('empty');
var LABEL={scenic:'景点',food:'美食',stay:'住宿',hot:'网红',city:'城市',prov:'省份',topic:'专题'};
fetch('data/search-index.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{IDX=d;run();}).catch(()=>{meta.textContent='索引加载失败，请刷新重试';});

document.querySelectorAll('.chip[data-f]').forEach(c=>c.addEventListener('click',function(){
  filter=this.dataset.f;
  document.querySelectorAll('.chip[data-f]').forEach(x=>x.setAttribute('aria-pressed',x===this));
  run();
}));
document.querySelectorAll('.hotk').forEach(c=>c.addEventListener('click',function(){q.value=this.textContent;run();q.focus();}));
document.getElementById('clear').addEventListener('click',function(){q.value='';run();q.focus();});
q.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(run,200);});
q.addEventListener('keydown',function(e){if(e.key==='Escape'){q.value='';run();}});
// URL 带关键词直达
var init=new URLSearchParams(location.search).get('q');
if(init){q.value=init;}

function norm(s){return String(s||'').toLowerCase();}
function run(){
  if(!IDX)return;
  var kw=norm(q.value.trim());
  var hit=[];
  if(kw){
    for(var i=0;i<IDX.length;i++){
      var e=IDX[i];
      var nm=norm(e.n),py=norm(e.py);
      var sc=0;
      if(nm.indexOf(kw)===0)sc=3;else if(nm.indexOf(kw)>-1)sc=2;
      else if(py.indexOf(kw)>-1)sc=1;
      else if(norm(e.c).indexOf(kw)>-1||norm(e.p).indexOf(kw)>-1)sc=0.5;
      if(sc)hit.push([sc,e]);
    }
    hit.sort(function(a,b){return b[0]-a[0]||(parseFloat(b[1].r)||0)-(parseFloat(a[1].r)||0);});
  }
  var shown=0;
  var html='';
  for(var j=0;j<hit.length&&shown<80;j++){
    var e=hit[j][1];
    if(filter!=='all'&&e.t!==filter)continue;
    shown++;
    var sub=[e.p,e.c,e.l?e.l+'景区':''].filter(Boolean).join(' · ');
    html+='<a class="res" href="'+e.u+'"><span class="badge '+e.t+'">'+(LABEL[e.t]||e.t)+'</span>'
      +'<span class="txt"><span class="nm">'+e.n+'</span>'+(sub?'<span class="sub">'+sub+'</span>':'')+'</span>'
      +(e.r?'<span class="star">⭐'+e.r+'</span>':'')+'</a>';
  }
  results.innerHTML=html;
  empty.hidden=!(kw&&!shown);
  meta.textContent=kw?('命中 '+countHit(hit)+' 条'+(shown<countHit(hit)?'，显示前80条':'')):('索引就绪：共 '+IDX.length+' 条（景区/美食/住宿/网红/城市/省份/专题），输入关键词即可搜索');
  function countHit(h){var f=filter;return f==='all'?h.length:h.reduce(function(s,x){return s+(x[1].t===f?1:0)},0);}
}
})();
</script>
