// ============ 颜色配置 ============
const typeColors = {
  scenic: { '4A': '#ff6b6b', '3A': '#4ec9b0', '2A': '#8b949e', '1A': '#6e7681', default: '#ff6b6b' },
  food: '#f0c674',
  stay: '#a371f7',
  hot: '#ff7b3a',
};

function getMarkerColor(spot) {
  if (spot.type === 'scenic') return typeColors.scenic[spot.level] || typeColors.scenic.default;
  return typeColors[spot.type] || '#58a6ff';
}

function createIcon(color) {
  return L.divIcon({
    className: 'custom-marker',
    html: '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">' +
      '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '" stroke="#fff" stroke-width="2" opacity="0.95"/>' +
      '<circle cx="14" cy="14" r="5.5" fill="#fff"/>' +
      '</svg>',
    iconSize: [28, 36],
    iconAnchor: [14, 36],
    popupAnchor: [0, -34],
  });
}

// ============ 初始化地图 ============
const map = L.map('map', {
  center: [35.02, 110.85],
  zoom: 9,
  zoomControl: true,
  attributionControl: true,
});

const amapVec = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1', '2', '3', '4'],
  maxZoom: 18,
  maxNativeZoom: 18,
  attribution: '高德地图 | Leaflet.js',
});
const amapImg = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
  subdomains: ['1', '2', '3', '4'],
  maxZoom: 18,
  maxNativeZoom: 18,
  attribution: '高德卫星 | Leaflet.js',
});
const amapLabel = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1', '2', '3', '4'],
  maxZoom: 18,
  maxNativeZoom: 18,
});
amapVec.addTo(map);
let currentLayer = amapVec;
let labelLayer = null;

function switchLayer(type, btn) {
  document.querySelectorAll('.layer-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  map.removeLayer(currentLayer);
  if (labelLayer) { map.removeLayer(labelLayer); labelLayer = null; }
  if (type === 'vec') {
    currentLayer = amapVec;
  } else {
    currentLayer = amapImg;
    labelLayer = amapLabel;
    labelLayer.addTo(map);
  }
  currentLayer.addTo(map);
}

// ============ 聚合图层 ============
const clusterGroup = L.markerClusterGroup({
  showCoverageOnHover: false,
  maxClusterRadius: 40,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    return L.divIcon({
      html: '<div style="background:rgba(88,166,255,0.8);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;border:2px solid rgba(255,255,255,0.5);">' + count + '</div>',
      className: 'cluster-icon',
      iconSize: [36, 36],
    });
  },
});

const allMarkers = [];
const markersByType = { scenic: [], food: [], stay: [], hot: [] };

spots.forEach((spot, idx) => {
  spot.id = idx + 1;
  const color = getMarkerColor(spot);
  const marker = L.marker([spot.lat, spot.lng], { icon: createIcon(color) });

  const tagsHtml = spot.tags.map(t => '<span class="iw-tag">' + t + '</span>').join('');
  const popupContent =
    '<div style="min-width:260px;max-width:340px;padding:10px;">' +
    '<div class="iw-title">' + spot.name + '</div>' +
    '<div style="margin-bottom:4px;">' + tagsHtml + '</div>' +
    '<div>门票：<span class="iw-price">' + spot.price + '</span></div>' +
    '<div>评分：<span class="iw-rating">' + spot.rating + '</span></div>' +
    '<div class="iw-addr">地址：' + spot.addr + '</div>' +
    '<div class="iw-review">' + spot.review + '</div>' +
    '<div class="iw-nav">' +
      '<a class="amap-link" href="https://uri.amap.com/marker?position=' + spot.lng + ',' + spot.lat + '&name=' + encodeURIComponent(spot.name) + '" target="_blank">高德导航</a>' +
    '</div>' +
    '</div>';

  marker.bindPopup(popupContent, { maxWidth: 380, minWidth: 260 });
  marker.spotData = spot;
  clusterGroup.addLayer(marker);
  allMarkers.push(marker);
  markersByType[spot.type].push(marker);
});

map.addLayer(clusterGroup);

// ============ 侧栏列表（按县区合并分组 + 类型标注） ============
const TYPE_WORD = { scenic: '景点', food: '美食', stay: '住宿', hot: '网红点' };
const TYPE_ORDER = { scenic: 0, food: 1, stay: 2, hot: 3 };

function tagLabelOf(spot) {
  const word = TYPE_WORD[spot.type] || '';
  return (spot.type === 'scenic' && spot.level) ? (word + '·' + spot.level) : word;
}

function tagClassOf(spot) {
  if (spot.type === 'scenic' && spot.level) return 'tag-' + spot.level;
  return 'tag-' + spot.type;
}

function renderList(filter) {
  const list = document.getElementById('spotList');
  list.innerHTML = '';
  const filtered = filter === 'all' ? spots : spots.filter(s => s.type === filter);
  const countyOrder = ['盐湖区','永济市','河津市','万荣县','芮城县','垣曲县','夏县','新绛县','稷山县','绛县','闻喜县','临猗县','平陆县'];

  // 按县区分组：同县区只出现一个分组头（分组头内含数量），组内按 景点→美食→住宿→网红点 排序
  const groups = new Map();
  filtered.forEach(spot => {
    if (!groups.has(spot.county)) groups.set(spot.county, []);
    groups.get(spot.county).push(spot);
  });
  const sortedCounties = [...groups.keys()].sort((a, b) => countyOrder.indexOf(a) - countyOrder.indexOf(b));

  sortedCounties.forEach(county => {
    const items = groups.get(county).sort((a, b) => TYPE_ORDER[a.type] - TYPE_ORDER[b.type]);
    const h = document.createElement('div');
    h.className = 'county-header';
    h.textContent = '📍 ' + county + '（' + items.length + '）';
    list.appendChild(h);

    items.forEach(spot => {
      const color = getMarkerColor(spot);
      const div = document.createElement('div');
      div.className = 'spot-item';
      div.innerHTML =
        '<div class="name"><span class="dot" style="background:' + color + ';"></span>' + spot.name +
        ' <span class="tag-mini ' + tagClassOf(spot) + '">' + tagLabelOf(spot) + '</span></div>' +
        '<div class="meta">' + spot.addr + '</div>' +
        '<div class="meta">门票：<span class="price">' + spot.price + '</span> | <span class="rating">' + spot.rating + '</span></div>';
      div.onclick = function() {
        map.flyTo([spot.lat, spot.lng], 14, { duration: 0.8 });
        if (window.innerWidth <= 860) closeSidebar(); // 手机上点景区自动收起抽屉看地图
        setTimeout(() => {
          const m = allMarkers.find(m => m.spotData.id === spot.id);
          if (m) {
            clusterGroup.zoomToShowLayer(m, () => {
              m.openPopup();
            });
          }
        }, 500);
        document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
      };
      list.appendChild(div);
    });
  });
}

renderList('all');

// ============ 筛选 ============
function filterType(type, btn) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderList(type);
  clusterGroup.clearLayers();
  const toShow = type === 'all' ? allMarkers : markersByType[type];
  toShow.forEach(m => clusterGroup.addLayer(m));
}

// ============ 移动端抽屉交互 ============
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); }
if (window.innerWidth <= 860) map.on('click', closeSidebar);
// ============ 初始：飞往盐湖 ============
setTimeout(() => {
  map.flyTo([34.98, 110.89], 11, { duration: 1 });
}, 800);
</script>
