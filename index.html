  { prov:'澳门特别行政区', name:'大三巴牌坊', county:'澳门特别行政区', type:'scenic', level:'', lat:22.1980, lng:113.5400, price:'免费', rating:'—', addr:'澳门半岛', tags:['世界遗产','地标'], review:'圣保禄教堂前壁，澳门的城市名片。' },

  // ===== 全国 · 台湾省（4） =====
  { prov:'台湾省', name:'日月潭国家风景区', county:'台湾省', type:'scenic', level:'', lat:23.8560, lng:120.9110, price:'【待核实】', rating:'—', addr:'台湾南投县', tags:['湖泊'], review:'日潭月潭相连，游船环湖玄光寺阿婆茶叶蛋。' },
  { prov:'台湾省', name:'阿里山', county:'台湾省', type:'scenic', level:'', lat:23.5130, lng:120.8010, price:'【待核实】', rating:'—', addr:'台湾嘉义县', tags:['森林铁路','日出'], review:'小火车穿千年神木林，祝山观日平台。' },
  { prov:'台湾省', name:'台北101', county:'台湾省', type:'scenic', level:'', lat:25.0338, lng:121.5645, price:'【待核实】', rating:'—', addr:'台湾台北市', tags:['地标'], review:'曾是世界第一高楼，阻尼器风阻尼球必看。' },
  { prov:'台湾省', name:'垦丁国家公园', county:'台湾省', type:'scenic', level:'', lat:21.9500, lng:120.7900, price:'【待核实】', rating:'—', addr:'台湾屏东县', tags:['海岛'], review:'台湾最南端，鹅銮鼻灯塔与白沙滩。' },
];

// ============ 地图初始化 ============
const typeColors = {
  scenic: { '4A': '#ff6b6b', '3A': '#4ec9b0', '2A': '#8b949e', '1A': '#6e7681', default: '#ff6b6b' },
  food: '#f0c674', stay: '#a371f7', hot: '#ff7b3a',
};
function getMarkerColor(spot) {
  if (spot.type === 'scenic') return typeColors.scenic[spot.level] || typeColors.scenic.default;
  return typeColors[spot.type] || '#58a6ff';
}
function createIcon(color) {
  return L.divIcon({
    className: 'custom-marker',
    html: '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36">' +
      '<path d="M14 0C6.3 0 0 6.3 0 14c0 10.5 14 22 14 22s14-11.5 14-22C28 6.3 21.7 0 14 0z" fill="' + color + '" stroke="#fff" stroke-width="2" opacity="0.95"/>' +
      '<circle cx="14" cy="14" r="5.5" fill="#fff"/></svg>',
    iconSize: [28, 36], iconAnchor: [14, 36], popupAnchor: [0, -34],
  });
}

const map = L.map('map', { center: [36.20, 106.50], zoom: 4, zoomControl: true, attributionControl: true });
const amapVec = L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'], maxZoom: 18, maxNativeZoom: 18, attribution: '高德地图 | Leaflet.js',
}).addTo(map);
const amapImg = L.tileLayer('https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}', {
  subdomains: ['1','2','3','4'], maxZoom: 18, maxNativeZoom: 18, attribution: '高德卫星 | Leaflet.js',
});

const clusterGroup = L.markerClusterGroup({
  showCoverageOnHover: false, maxClusterRadius: 40,
  iconCreateFunction: function(cluster) {
    const count = cluster.getChildCount();
    return L.divIcon({
      html: '<div style="background:rgba(88,166,255,0.8);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold;border:2px solid rgba(255,255,255,0.5);">' + count + '</div>',
      className: 'cluster-icon', iconSize: [36, 36],
    });
  },
});
const allMarkers = [];
spots.forEach((spot, idx) => {
  spot.id = idx + 1;
  const marker = L.marker([spot.lat, spot.lng], { icon: createIcon(getMarkerColor(spot)) });
  const tagsHtml = spot.tags.map(t => '<span class="iw-tag">' + t + '</span>').join('');
  marker.bindPopup(
    '<div style="min-width:260px;max-width:340px;padding:10px;">' +
    '<div class="iw-title">' + spot.name + '</div>' +
    '<div style="margin-bottom:4px;">' + tagsHtml + '</div>' +
    '<div>门票：<span class="iw-price">' + spot.price + '</span></div>' +
    '<div>评分：<span class="iw-rating">' + spot.rating + '</span></div>' +
    '<div class="iw-addr">地址：' + spot.addr + '</div>' +
    '<div class="iw-review">' + spot.review + '</div>' +
    '<div class="iw-nav"><a class="amap-link" href="https://uri.amap.com/marker?position=' + spot.lng + ',' + spot.lat + '&name=' + encodeURIComponent(spot.name) + '" target="_blank">高德导航</a></div>' +
    '</div>', { maxWidth: 380, minWidth: 260 });
  marker.spotData = spot;
  allMarkers.push(marker);
});
allMarkers.forEach(m => clusterGroup.addLayer(m));
map.addLayer(clusterGroup);

// ============ 左侧：省-市-区县级联 ============
const SHANXI_CITIES = ['太原市','大同市','朔州市','忻州市','吕梁市','晋中市','阳泉市','长治市','晋城市','临汾市','运城市'];
const YUNCHENG_COUNTIES = ['盐湖区','永济市','河津市','芮城县','临猗县','万荣县','新绛县','稷山县','闻喜县','夏县','平陆县','垣曲县','绛县'];
const TYPE_WORD = { scenic: '景点', food: '美食', stay: '住宿', hot: '网红点' };
const TYPE_ORDER = { scenic: 0, food: 1, stay: 2, hot: 3 };
// 山西11市中心坐标（选市后地图飞行定位）
const CITY_CENTERS = {
  '太原市': [37.87, 112.55], '大同市': [40.09, 113.30], '朔州市': [39.33, 112.43],
  '忻州市': [38.42, 112.74], '吕梁市': [37.52, 111.14], '晋中市': [37.30, 112.60],
  '阳泉市': [37.87, 113.58], '长治市': [36.20, 113.11], '晋城市': [35.50, 112.85],
  '临汾市': [36.08, 111.52], '运城市': [35.02, 110.90],
};
let currentType = 'all';
let currentProv = '山西省';
let currentCity = '';
let currentCounty = '';

// 判断点位所属省份/地市：省外点位带 prov 字段、county 即城市名；运城景点 county 为区县名，其余山西点位 county 即市名
function spotProv(s) { return s.prov || '山西省'; }
function spotCity(s) {
  if (spotProv(s) !== '山西省') return s.county;
  return YUNCHENG_COUNTIES.includes(s.county) ? '运城市' : s.county;
}

const provSel = document.getElementById('provSel');
const citySel = document.getElementById('citySel');
const countySel = document.getElementById('countySel');
let divisionData = null;
let divisionFetchStarted = false;

function countyShort(name) {
  const short = name.replace(/(市|县|区|旗|自治县|自治旗)$/, '');
  return short.length >= 2 ? short : name; // 单字短名（如"绛县"）用全名匹配防误判
}

function fillCities(cities) {
  citySel.innerHTML = '<option value="">全部城市</option>';
  cities.forEach(c => {
    const opt = document.createElement('option');
    opt.value = c; opt.textContent = c;
    citySel.appendChild(opt);
  });
  citySel.disabled = false;
}

(function initProvinces() {
  PROVINCES.forEach(([name]) => {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    provSel.appendChild(opt);
  });
  // 默认全国视角：provSel 留空，citySel 保持禁用
  renderSpotList();
  showMarkers();
  const span = document.querySelector('#header h1 span');
  if (span) span.textContent = '· 全国' + spots.length + '个精选点位 + 1310家5A/4A全量图层';
  const stat = document.getElementById('statLine');
  if (stat) stat.innerHTML = '文旅部公报：全国A级景区<strong>16994</strong>个（2025年末）· 本站精选<strong>' + spots.length + '</strong>个点位 · 5A/4A全量<strong>1310</strong>家图层可开启';
})();

// 懒加载全国行政区划（china-division开源库，双CDN源，失败自动降级内置数据）
function loadDivision() {
  if (divisionData || divisionFetchStarted) return;
  divisionFetchStarted = true;
  const urls = [
    'https://unpkg.com/china-division/dist/pca-code.json',
    'https://cdn.jsdelivr.net/npm/china-division/dist/pca-code.json'
  ];
  (async () => {
    for (const u of urls) {
      try { const r = await fetch(u); if (r.ok) { divisionData = await r.json(); break; } } catch (e) { /* 换下一个源 */ }
    }
    if (divisionData && provSel.value) onProvinceChange(false);
  })();
}
loadDivision();

function findProvince(name) {
  return divisionData ? divisionData.find(p => p.name === name) : null;
}

function onProvinceChange(fly) {
  currentProv = provSel.value;
  currentCity = ''; currentCounty = '';
  if (fullCluster) rebuildFullLayer();
  countySel.innerHTML = '<option value="">全部区县</option>';
  countySel.disabled = true;
  citySel.innerHTML = '';
  hideToast();
  if (!currentProv) { // 全国
    citySel.disabled = true;
    citySel.innerHTML = '<option value="">请先选择省份</option>';
    renderSpotList(); showMarkers();
    if (fly !== false) map.flyTo([36.20, 106.50], 4, { duration: 1 });
    return;
  }
  const node = findProvince(currentProv);
  const cities = node ? node.children.map(c => c.name) : (currentProv === '山西省' ? SHANXI_CITIES : null);
  if (cities) fillCities(cities);
  else { citySel.disabled = true; citySel.innerHTML = '<option value="">行政区划加载中</option>'; }
  renderSpotList(); showMarkers();
  if (fly !== false) {
    const c = PROVINCES.find(p => p[0] === currentProv);
    if (c) map.flyTo([c[1], c[2]], currentProv === '山西省' ? 8 : 7, { duration: 1 });
  }
  if (!spots.some(s => spotProv(s) === currentProv)) showToast(currentProv);
}

function onCityChange() {
  currentCity = citySel.value;
  currentCounty = '';
  countySel.innerHTML = '<option value="">全部区县</option>';
  if (!currentCity) { countySel.disabled = true; renderSpotList(); showMarkers(); return; }
  const pNode = findProvince(currentProv);
  const cNode = pNode ? pNode.children.find(c => c.name === currentCity) : null;
  const counties = currentCity === '运城市' ? ((cNode && cNode.children) ? cNode.children.map(a => a.name) : YUNCHENG_COUNTIES) : null;
  if (counties) {
    counties.forEach(a => {
      const opt = document.createElement('option');
      opt.value = a; opt.textContent = a;
      countySel.appendChild(opt);
    });
    countySel.disabled = false;
  } else {
    countySel.disabled = true;
  }
  renderSpotList(); showMarkers();
  // 地图飞到该市中心
  const cc = CITY_CENTERS[currentCity];
  if (cc) map.flyTo(cc, 9, { duration: 1 });
}

function onCountyChange() {
  currentCounty = countySel.value;
  renderSpotList(); showMarkers();
}

function goShanxi() {
  provSel.value = '山西省';
  onProvinceChange();
}

// ===== 移动端抽屉 =====
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

function showToast(prov) {
  const t = document.getElementById('toast');
  t.innerHTML = '<strong>' + prov + '</strong> 主要景区陆续收录中。<br>目前已收录全国' + spots.length + '个点位 · 山西451家A级全量。<br>' +
    '<button type="button" onclick="goShanxi()">去山西看看 →</button>';
  t.style.display = 'block';
}
function hideToast() { document.getElementById('toast').style.display = 'none'; }

// ============ 全国5A/4A全量图层（懒加载 data/national.json，1310家官方评定） ============
let fullCluster = null; let fullLoading = false; let fullList = [];
function wgs2gcj(lat, lng) { // WGS-84 → GCJ-02（高德瓦片坐标系，避免地标偏移）
  const a = 6378245.0, ee = 0.00669342162296594323;
  function tLat(x, y) {
    let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
    r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
    return r;
  }
  function tLng(x, y) {
    let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
    r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
    r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
    r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
    return r;
  }
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const radLat = lat / 180 * Math.PI; let magic = Math.sin(radLat);
  magic = 1 - ee * magic * magic; const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sq) * Math.PI);
  dLng = (dLng * 180) / (a / sq * Math.cos(radLat) * Math.PI);
  return [lat + dLat, lng + dLng];
}

function makeFullMarker(s) {
    const gc = wgs2gcj(s.lat, s.lng);
    const m = L.circleMarker(gc, { radius: 5, color: '#a371f7', weight: 1, fillColor: '#c9a0ff', fillOpacity: 0.9 });
    m.bindPopup('<div style="min-width:240px;padding:6px 2px;">' +
      '<div class="iw-title">' + s.n + '</div>' +
      '<span class="iw-tag">' + s.l + '</span> <span class="iw-tag">' + s.p + '</span>' +
      '<div style="margin-top:4px;">门票：<span class="iw-price">' + s.t + '</span></div>' +
      '<div class="iw-addr">数据来源：China Top Attractions 公开数据集（2026-08核验）</div>' +
      '<div class="iw-nav"><a class="amap-link" href="https://uri.amap.com/marker?position=' + gc[1] + ',' + gc[0] + '&name=' + encodeURIComponent(s.n) + '" target="_blank">高德导航</a></div></div>', { maxWidth: 300 });
    return m;
  }
  function rebuildFullLayer() {
    if (!fullCluster) return;
    fullCluster.clearLayers();
    fullList.filter(s => !currentProv || s.p === currentProv).forEach(s => fullCluster.addLayer(makeFullMarker(s)));
  }
  async function toggleFullLayer(on) {
  const chk = document.getElementById('fullLayerChk');
  if (on && !fullCluster && !fullLoading) {
    fullLoading = true; chk.disabled = true;
    try {
      const r = await fetch('data/national.json');
      if (!r.ok) throw new Error('HTTP ' + r.status);
      fullList = await r.json();
      fullCluster = L.markerClusterGroup({
        showCoverageOnHover: false, maxClusterRadius: 60,
        iconCreateFunction: function(c) {
          const n = c.getChildCount();
          return L.divIcon({ html: '<div style="background:rgba(163,113,247,0.85);color:#fff;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;border:2px solid rgba(255,255,255,0.5);">' + n + '</div>', className: 'cluster-icon', iconSize: [36, 36] });
        }
      });
      rebuildFullLayer();
      map.addLayer(fullCluster);
    } catch (e) {
      chk.checked = false;
      const t = document.getElementById('toast');
      t.innerHTML = '<strong>全量图层加载失败</strong><br>请检查网络后重新勾选重试。';
      t.style.display = 'block';
    }
    fullLoading = false; chk.disabled = false;
  }
  if (fullCluster) { if (on) map.addLayer(fullCluster); else map.removeLayer(fullCluster); }
}

// ============ 类型筛选 ============
function filterType(type, el) {
  currentType = type;
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderSpotList(); showMarkers();
}

function showMarkers() {
  clusterGroup.clearLayers();
  allMarkers.filter(m => {
    if (currentProv && spotProv(m.spotData) !== currentProv) return false;
    if (currentType !== 'all' && m.spotData.type !== currentType) return false;
    if (currentCity && spotCity(m.spotData) !== currentCity) return false;
    if (currentCounty && currentCity === '运城市' && countyShort(m.spotData.county) !== countyShort(currentCounty)) return false;
    return true;
  }).forEach(m => clusterGroup.addLayer(m));
}

// ============ 山西省景点列表（按县区分组+类型标注） ============
function tagLabelOf(spot) {
  const word = TYPE_WORD[spot.type] || '';
  return (spot.type === 'scenic' && spot.level) ? (word + '·' + spot.level) : word;
}
function tagClassOf(spot) {
  if (spot.type === 'scenic' && spot.level) return 'tag-' + spot.level;
  return 'tag-' + spot.type;
}

function renderSpotList() {
  const area = document.getElementById('spotArea');
  area.innerHTML = '';
  const placeholder = (html) => {
    area.innerHTML = '<div style="padding:16px 8px;text-align:center;color:#8b949e;font-size:12px;line-height:1.8;">' + html + '</div>';
  };
  const filtered = (currentType === 'all' ? spots : spots.filter(s => s.type === currentType))
    .filter(s => !currentProv || spotProv(s) === currentProv)
    .filter(s => !currentCity || spotCity(s) === currentCity)
    .filter(s => !currentCounty || (currentCity === '运城市' && countyShort(s.county) === countyShort(currentCounty)));
  if (!filtered.length) { placeholder('<div style="font-size:26px;">🚧</div>该地区暂无收录点位<br>' +
      '目前已收录全国' + spots.length + '个点位 · 山西451家A级全量<br>' +
      '<a href="shanxi.html" style="color:#58a6ff;">查看山西总表 →</a>'); return; }

  // 按县区/城市分组（保持数据源顺序），组内按 景点→美食→住宿→网红点 排序
  const groups = new Map();
  filtered.forEach(spot => {
    if (!groups.has(spot.county)) groups.set(spot.county, []);
    groups.get(spot.county).push(spot);
  });

  [...groups.keys()].forEach(county => {
    const items = groups.get(county).sort((a, b) => TYPE_ORDER[a.type] - TYPE_ORDER[b.type]);
    const h = document.createElement('div');
    h.className = 'county-header';
    h.textContent = '📍 ' + county + '（' + items.length + '）';
    area.appendChild(h);
    items.forEach(spot => {
      const div = document.createElement('div');
      div.className = 'spot-item';
      div.innerHTML =
        '<div class="name"><span class="dot" style="background:' + getMarkerColor(spot) + ';"></span>' + spot.name +
        ' <span class="tag-mini ' + tagClassOf(spot) + '">' + tagLabelOf(spot) + '</span></div>' +
        '<div class="meta">' + spot.addr + '</div>' +
        '<div class="meta">门票：<span class="price">' + spot.price + '</span> | <span class="rating">' + spot.rating + '</span></div>';
      div.onclick = function() {
        map.flyTo([spot.lat, spot.lng], 14, { duration: 0.8 });
        if (window.innerWidth <= 860) closeSidebar(); // 手机上点景区自动收起抽屉看地图
        setTimeout(() => {
          const m = allMarkers.find(m => m.spotData.id === spot.id);
          if (m) clusterGroup.zoomToShowLayer(m, () => m.openPopup());
        }, 500);
        document.querySelectorAll('.spot-item').forEach(el => el.classList.remove('active'));
        div.classList.add('active');
      };
      area.appendChild(div);
    });
  });
}

renderSpotList();
</script>
