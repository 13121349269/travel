  { name:'北武当山景区', county:'吕梁市', type:'scenic', level:'4A', lat:37.8900, lng:111.4200, price:'【待核实】', rating:'4.4/携程', addr:'吕梁市方山县', tags:['道教名山'], review:'道教名山，金顶石阶陡直如天梯。<br>"武当山真的很值得去,那天又是下雪,对于南方小土豆来说真的是一次非常好的体验"——携程<br>"天下第一仙山,世界文化遗产。自然风光与道教文化结合得很好,值得一游。"——携程"天下第一仙山,世界文化遗产。自然风光与道教文化结合得很好,值得一游。"——携程<br>"武当山山势雄奇,古建筑依山而建,仙气十足。作为道教圣地,文化底蕴深厚,登高可赏云海,金顶震撼"——携程<br>"武当山风景壮丽,云雾缭绕如仙境,金顶日出震撼人心,古建筑群气势恢宏,道教文化底蕴深厚"——去哪儿<br>"游览感受还可以,就是票价太贵了!"——去哪儿<br>"北武当山集雄奇险秀于一身,是我国北方著名的道教圣地。山势陡峭,奇岩嶙峋,松石相映,自然景观极为壮丽。"——携程' },

  { name:'平遥古城景区', county:'晋中市', type:'scenic', level:'5A', lat:37.2000, lng:112.1800, price:'125元（通票）', rating:'4.7/携程', addr:'晋中市平遥县', tags:['5A','世界遗产','晋商'], review:'世界文化遗产，晚清中国金融中心，日昇昌票号"汇通天下"。<br>"平遥古城不愧是世界文化遗产,整座古城保存得非常完整,漫步在青石板街道上,仿佛穿越回明清时期"——携程<br>"专程打卡平遥古城,这座活着的古城远超预期。避开主街人流,小巷安静古朴"——携程"专程打卡平遥古城,这座活着的古城远超预期。避开主街人流,小巷安静古朴"——携程' },

  { name:'双林寺景区', county:'晋中市', type:'scenic', level:'4A', lat:37.1600, lng:112.1300, price:'【待核实】', rating:'4.6/携程', addr:'晋中市平遥县', tags:['彩塑','国保'], review:'两千余尊彩绘泥塑，被誉为"东方彩塑艺术馆"。<br>"名副其实的东方彩塑艺术宝库。两千余尊元明彩塑栩栩如生,韦驮像身姿飒爽,千手观音端庄传神。"——携程<br>"看到千手观音和水月观音时直接热泪盈眶,太美了!悬塑实在是太惊艳了。"——去哪儿' },

  { name:'常家庄园景区', county:'晋中市', type:'scenic', level:'4A', lat:37.6800, lng:112.7500, price:'【待核实】', rating:'4.5/携程', addr:'晋中市榆次区', tags:['晋商庄园'], review:'晋商儒商第一家，园林之大冠绝晋中。<br>"都说"乔家看名,常家看规模",实地逛完常家庄园确实名不虚传!这里游客更少,逛起来很舒服。"——携程<br>"不仅宅院规模巨大,还有如江南般的园林,山西大院中绝无仅有的特色。"——同程' },
  { name:'榆次老城景区', county:'晋中市', type:'scenic', level:'4A', lat:37.6800, lng:112.7300, price:'【待核实】', rating:'4.7/携程', addr:'晋中市榆次区', tags:['古城'], review:'隋代古城，城隍庙琉璃影壁精美。<br>"绚烂的彩灯、丰富的街边美食、一场接一场的表演,简直就像穿越回了古代在赶庙会!"——大众点评<br>"榆次老城县衙是保存较好的古代衙门建筑。"——携程' },
  { name:'石膏山景区', county:'晋中市', type:'scenic', level:'4A', lat:36.7500, lng:111.8000, price:'【待核实】', rating:'4.7/携程', addr:'晋中市灵石县', tags:['森林公园'], review:'太岳山国家森林公园，溶洞瀑布并存。<br>"登山需要体力哦,不过山顶的风景很好,风光无限开阔。"——携程<br>"山上红叶开满,漫山遍野的红叶,美极了,登高远眺,山峰峻秀,虽累并快乐着!"——同程' },
  { name:'红崖峡谷景区', county:'晋中市', type:'scenic', level:'4A', lat:36.8000, lng:111.8500, price:'【待核实】', rating:'4.6/携程', addr:'晋中市灵石县', tags:['峡谷'], review:'太岳峡谷，高空玻璃吊桥。<br>"红崖峡谷的红岩地貌真的很有特色,一路山清水秀,空气特别清新,走在峡谷里特别舒服。"——携程<br>"北方少有的赤色嶂石岩峡谷,晴天时红崖耀眼,拍照出片。相比热门景区,商业气息淡。"——携程' },
  { name:'乌金山景区', county:'晋中市', type:'scenic', level:'4A', lat:37.8000, lng:112.7800, price:'【待核实】', rating:'4.5/携程', addr:'晋中市榆次区', tags:['宗教文化','游乐园'], review:'宗教文化+狂欢谷游乐。<br>"公园内景色不错,树木茂盛,空气清新,仿佛一处大氧吧。古建筑风格非常漂亮。"——携程<br>"乌金山是天然大氧吧,空气质量好,森林覆盖率高。"——携程' },
  { name:'后沟古村景区', county:'晋中市', type:'scenic', level:'4A', lat:37.7200, lng:112.8500, price:'【待核实】', rating:'4.6/携程', addr:'晋中市榆次区', tags:['古村落'], review:'农耕文明活化石，黄土高原窑居样本。<br>"后沟古村还是值得一去的,带老人去怀旧,带小朋友去认识一下农村生活。村子整体建筑很紧凑,层层叠叠。"——携程<br>"原汁原味,原始村落,不可替代的古迹,保护完好,步步都是景,多部影视剧拍摄基地。"——猫途鹰' },

  { prov:'北京市', name:'明十三陵', county:'北京市', type:'scenic', level:'5A', lat:40.29, lng:116.24, price:'【待核实】', rating:'4.6/携程', addr:'北京市（近似定位）', tags:['5A'], review:'明朝十三位皇帝的陵墓群，以长陵、定陵最著名，依天寿山而建。<br>"强烈推荐明十三陵!群山围合的风水格局一眼就能感受到,成片古柏郁郁葱葱。神道石像生静静伫立,造型古朴传神,随手拍都很出片。"——携程<br>"明十三陵是世界文化遗产,非常值得一游。"——携程' },
  { prov:'北京市', name:'圆明园遗址公园', county:'北京市', type:'scenic', level:'4A', lat:40.008, lng:116.298, price:'【待核实】', rating:'4.6/携程', addr:'北京市（近似定位）', tags:['4A'], review:'清代皇家园林遗址，号称万园之园，现存大水法等西洋楼遗址石构件。<br>"圆明园不愧是"万园之园",虽然如今看到的多是断壁残垣,但漫步其中,依然能感受到它曾经的恢宏气度与深厚的历史底蕴。"——携程' },
  { prov:'北京市', name:'北海公园', county:'北京市', type:'scenic', level:'4A', lat:39.9254, lng:116.3897, price:'【待核实】', rating:'4/携程', addr:'北京市（近似定位）', tags:['4A'], review:'中国现存最古老的皇家园林之一，白塔矗立琼华岛，始建于辽金时期。<br>"值得一游的北京名胜,公园有山有水有古迹,让人心情愉悦,视野开阔。"——携程' },
  { prov:'北京市', name:'景山公园', county:'北京市', type:'scenic', level:'4A', lat:39.9285, lng:116.397, price:'【待核实】', rating:'4.5/携程', addr:'北京市（近似定位）', tags:['4A'], review:'明清皇家御苑，万春亭是北京中轴线制高点，可俯瞰故宫全景。<br>"万春亭是景山的最高点,也是北京中轴线的最高点,可俯瞰故宫全景,来北京一定要去景山公园。"——携程' },
  { prov:'北京市', name:'雍和宫', county:'北京市', type:'scenic', level:'4A', lat:39.948, lng:116.417, price:'【待核实】', rating:'4.8/携程', addr:'北京市（近似定位）', tags:['4A'], review:'北京规模最大的藏传佛教寺院，原为雍正帝潜邸，建筑融合汉藏风格。<br>"北京雍和宫不愧是皇家寺院,建筑群宏伟壮观,内部展品的佛像、文物精美。"——携程' },
  { prov:'北京市', name:'香山公园', county:'北京市', type:'scenic', level:'4A', lat:39.992, lng:116.185, price:'【待核实】', rating:'4.7/携程', addr:'北京市（近似定位）', tags:['4A'], review:'金元明清皇家园林，秋季红叶闻名，主峰香炉峰海拔575米。<br>"香山公园的秋天美极了,这里最美的当然是红叶"——携程' },
  { prov:'北京市', name:'古北水镇', county:'北京市', type:'scenic', level:'4A', lat:40.686, lng:116.707, price:'【待核实】', rating:'4.7/携程', addr:'北京市（近似定位）', tags:['4A'], review:'密云司马台长城脚下的北方水镇，依山傍水，汤河穿镇而过。<br>"国内极少能古镇水乡与长城同框的景区,人工河道串联青瓦石桥,复刻江南水乡风貌"——携程' },
  { prov:'天津市', name:'天津古文化街旅游区（津门故里）', county:'天津市', type:'scenic', level:'5A', lat:39.143, lng:117.195, price:'免费', rating:'4.6/携程', addr:'天津市（近似定位）', tags:['5A'], review:'津门发源地，仿清民间街市，天后宫坐落其中，汇集泥人张等老字号。<br>"漫步其中,每一块青砖、每一个雕花,都在诉说着天津的故事,充满了浓郁的中国味、天津味、古味和文化味。"——携程' },
  { prov:'天津市', name:'黄崖关长城', county:'天津市', type:'scenic', level:'4A', lat:40.24, lng:117.36, price:'【待核实】', rating:'4.6/携程', addr:'天津市（近似定位）', tags:['4A'], review:'蓟州北部的明长城重要关隘，以雄险著称，有凤凰楼、八卦关城等遗迹。<br>"一直以为长城只有八达岭的热闹,直到来了黄崖关,才发现真正的长城风骨在这里!人少、险峻、有历史、还出片"——携程<br>"国庆假期出游,整体人不多,景色也是很好的,长城整体维护也是不错的。"——携程' },
  { prov:'天津市', name:'独乐寺', county:'天津市', type:'scenic', level:'4A', lat:40.045, lng:117.408, price:'【待核实】', rating:'4.5/微信公众号测评', addr:'天津市（近似定位）', tags:['4A'], review:'辽统和年间重建，观音阁为现存最古老木构楼阁之一，泥塑观音高16米。<br>"独乐寺历史底蕴浓厚,古建古朴大气,观音塑像十分震撼,园内安静清幽,讲解细致易懂,门票性价比很高"——携程<br>"非常震撼的古迹,保存的非常完好,觀音閣和山門的樓閣和神像都讓人印象深刻。"——永安旅游' },
  { prov:'天津市', name:'五大道文化旅游区', county:'天津市', type:'scenic', level:'4A', lat:39.111, lng:117.202, price:'免费', rating:'4.5/携程', addr:'天津市（近似定位）', tags:['4A'], review:'近代租界历史街区，保留两千余幢各国风格花园洋房，人称万国建筑博览。' },
  { prov:'天津市', name:'大悲禅院', county:'天津市', type:'scenic', level:'4A', lat:39.16, lng:117.185, price:'【待核实】', rating:'4.6/携程', addr:'天津市（近似定位）', tags:['4A'], review:'天津规模最大的佛教寺院，清代始建，曾供奉玄奘法师顶骨舍利。' },
  { prov:'天津市', name:'石家大院', county:'天津市', type:'scenic', level:'4A', lat:39.012, lng:117.008, price:'【待核实】', rating:'4.7/携程', addr:'天津市（近似定位）', tags:['4A'], review:'清末民初津西首富石氏宅邸，位于杨柳青古镇，砖雕石雕木雕精美。<br>"杨柳青的地标性建筑,挺大的院子,历史很久远,也曾经辉煌过的一个家族"——大众点评<br>"去的时候有部分院子维修,整体感觉还不错,长知识,尤其前院的回廊水池园林很有特色"——携程' },
  { prov:'天津市', name:'周恩来邓颖超纪念馆', county:'天津市', type:'scenic', level:'4A', lat:39.099, lng:117.165, price:'免费', rating:'4.7/大众点评', addr:'天津市（近似定位）', tags:['4A'], review:'纪念周恩来、邓颖超的专题纪念馆，展示二人生平事迹与遗物。' },
  { prov:'天津市', name:'泰达航母主题公园', county:'天津市', type:'scenic', level:'4A', lat:39.19, lng:117.79, price:'【待核实】', rating:'4.5/携程', addr:'天津市（近似定位）', tags:['4A'], review:'以退役基辅号航空母舰为主体的军事主题公园，位于滨海新区。<br>"泰达航母气势磅礴,伫立海边格外震撼。登上基辅号甲板,海风拂面,万吨巨舰的宏伟扑面而来。"——携程<br>"登上基辅号航母,巨大舰体带来强烈的视觉冲击,可以走进船舱、甲板,近距离感受舰艇内部构造"——去哪儿' },
  { prov:'天津市', name:'天津方特欢乐世界', county:'天津市', type:'scenic', level:'4A', lat:39.135, lng:117.755, price:'【待核实】', rating:'4.6/携程', addr:'天津市（近似定位）', tags:['4A'], review:'滨海新区大型科技文化主题乐园，含多项高科技游乐项目。' },
  { prov:'天津市', name:'天津海昌极地海洋公园', county:'天津市', type:'scenic', level:'4A', lat:38.99, lng:117.71, price:'【待核实】', rating:'4.3/携程', addr:'天津市（近似定位）', tags:['4A'], review:'集极地动物展示与海洋科普于一体的大型海洋主题公园。' },
  { prov:'天津市', name:'梨木台风景区', county:'天津市', type:'scenic', level:'4A', lat:40.09, lng:117.51, price:'【待核实】', rating:'4.6/携程', addr:'天津市（近似定位）', tags:['4A'], review:'蓟州原始森林峡谷，有天津神农架之称，藤本植物群落华北罕见。' },
  { prov:'河北省', name:'承德避暑山庄及周围寺庙', county:'承德市', type:'scenic', level:'5A', lat:40.982, lng:117.942, price:'【待核实】', rating:'4.4/携程', addr:'承德市（近似定位）', tags:['5A'], review:'清代夏宫，中国现存占地最大的皇家园林，外八庙融合汉蒙藏建筑风格。<br>"承德避暑山庄名不虚传,皇家气派与江南婉约完美相融。宫殿庄重古朴,湖区亭台错落、山水如画"——携程<br>"承德避暑山庄不愧是现存最大的皇家园林,宫殿区楠木殿古朴典雅,湖区湖光山色确实凉快。就是旺季人有点多,总体非常值得一游。"——携程<br>"避暑山庄是清代第二个政治中心,规模最大皇家园林,历史底蕴足够。但是园区超大、夏天正午暴晒,一定要早进园。"——携程' },
  { prov:'河北省', name:'西柏坡景区', county:'石家庄市', type:'scenic', level:'5A', lat:38.354, lng:113.93, price:'【待核实】', rating:'4.3/携程', addr:'石家庄市（近似定位）', tags:['5A'], review:'解放战争时期中共中央所在地，三大战役指挥地，著名革命圣地。<br>"爱国主义教育基地,是中共中央和中国人民解放军总部的所在地。"——携程' },
  { prov:'河北省', name:'清西陵', county:'保定市', type:'scenic', level:'5A', lat:39.35, lng:115.38, price:'【待核实】', rating:'4.3/携程', addr:'保定市（近似定位）', tags:['5A'], review:'清代皇家陵寝，雍正、嘉庆、道光、光绪四帝葬此，古松林密布。<br>"景区很大,景点分散,可以自驾,如买联票可自西向东游览,全程4小时。历史厚重。"——携程' },
  { prov:'河北省', name:'娲皇宫', county:'邯郸市', type:'scenic', level:'5A', lat:36.577, lng:113.69, price:'【待核实】', rating:'4.3/携程', addr:'邯郸市（近似定位）', tags:['5A'], review:'涉县古建筑群，主体殿宇以铁链悬系于崖壁，传为女娲炼石补天处。<br>"太行深处的娲皇宫,悬空阁楼依崖而建,惊险壮观。摩崖刻经洋洋大观,笔墨穿越千年。"——携程' },
  { prov:'河北省', name:'白石山景区', county:'保定市', type:'scenic', level:'5A', lat:39.22, lng:114.7, price:'【待核实】', rating:'4.4/携程', addr:'保定市（近似定位）', tags:['5A'], review:'涞源大理岩峰林地貌，玻璃栈道悬于绝壁，主峰佛光顶海拔2096米。<br>"白石山的云海,以雨后初晴最为壮观。前夜有雨、翌日初晴,云海出现概率高达七成。"——携程' },
  { prov:'河北省', name:'正定隆兴寺', county:'石家庄市', type:'scenic', level:'4A', lat:38.142, lng:114.571, price:'【待核实】', rating:'4.6/携程', addr:'石家庄市（近似定位）', tags:['4A'], review:'中国现存宋代建筑最多的寺院，千手观音铜像高21米。<br>"去隆兴寺之前真的没想到此次那么棒,原本就想看一眼鲁迅先生盛赞的“东方美神”观音塑像的"——携程<br>"不愧为“东方美神”!摩尼殿的外观非常独特而美观。"——携程' },
  { prov:'河北省', name:'赵州桥景区', county:'石家庄市', type:'scenic', level:'4A', lat:37.76, lng:114.79, price:'【待核实】', rating:'4.5/携程', addr:'石家庄市（近似定位）', tags:['4A'], review:'隋代李春设计建造的安济桥，世界现存最古老的敞肩石拱桥。<br>"终于见到课本里的赵州桥本桥了!现在景区免费开放,但一定得提前预约"——携程<br>"走在桥上踏着车辙,忍不住会想象千年之前会是什么景象"——大众点评' },
  { prov:'河北省', name:'直隶总督署博物馆', county:'保定市', type:'scenic', level:'4A', lat:38.86, lng:115.49, price:'【待核实】', rating:'4.7/携程', addr:'保定市（近似定位）', tags:['4A'], review:'清代直隶省最高军政衙署，曾国藩、李鸿章等曾在此任职，格局保存完整。<br>"来保定旅游,直隶总督署肯定要来打卡!有“一座总督署,半部清史”的说法,真不是夸大。"——携程<br>"总督府不大,有免费导游讲解,值得来一趟。"——去哪儿' },
  { prov:'河北省', name:'金山岭长城', county:'承德市', type:'scenic', level:'4A', lat:40.63, lng:117.26, price:'【待核实】', rating:'4.5/携程', addr:'承德市（近似定位）', tags:['4A'], review:'滦平境内明长城精华段，敌楼密集，障墙、文字砖独具特色。<br>"天公作美,景色优美。人少空旷,心情舒畅。明代遗址,戚继光建。比八达岭,性价比高。"——去哪儿<br>"金山岭长城景色宜人,人不多,体验感很好"——去哪儿' },
  { prov:'河北省', name:'大境门', county:'张家口市', type:'scenic', level:'4A', lat:40.839, lng:114.87, price:'【待核实】', rating:'4.5/携程', addr:'张家口市（近似定位）', tags:['4A'], review:'张家口长城关隘，万里长城四大关口之一，门楣题有大好河山。' },
  { prov:'河北省', name:'吴桥杂技大世界', county:'沧州市', type:'scenic', level:'4A', lat:37.63, lng:116.4, price:'【待核实】', rating:'4.4/携程', addr:'沧州市（近似定位）', tags:['4A'], review:'杂技之乡吴桥的主题园区，展演传统杂技魔术与民间绝活。' },
  { prov:'河北省', name:'太舞滑雪小镇', county:'张家口市', type:'scenic', level:'4A', lat:40.93, lng:115.19, price:'【待核实】', rating:'4.4/携程', addr:'张家口市（近似定位）', tags:['4A'], review:'崇礼大型滑雪度假区，2022年冬奥会张家口赛区场馆所在地之一。' },
  { prov:'内蒙古自治区', name:'阿尔山—柴河旅游景区', county:'兴安盟', type:'scenic', level:'5A', lat:47.17, lng:119.94, price:'【待核实】', rating:'4.7/携程', addr:'兴安盟（近似定位）', tags:['5A'], review:'火山温泉胜地，有天池、杜鹃湖等火山地貌，林海与熔岩景观并存。<br>"北线自驾必来阿尔山森林公园,火山天池、原始林海一步一景,驼峰岭天池风景最佳。"——携程' },
  { prov:'内蒙古自治区', name:'满洲里市中俄边境旅游区', county:'呼伦贝尔市', type:'scenic', level:'5A', lat:49.6, lng:117.4, price:'【待核实】', rating:'4.6/携程', addr:'呼伦贝尔市（近似定位）', tags:['5A'], review:'中俄边境口岸城市景区，含套娃广场与国门，建筑充满异域风情。<br>"满洲里国门气势恢宏,站在这里满满的家国自豪感扑面而来。可以眺望对岸俄罗斯风光"——携程' },
  { prov:'内蒙古自治区', name:'呼伦贝尔大草原·莫尔格勒河景区', county:'呼伦贝尔市', type:'scenic', level:'5A', lat:49.27, lng:119.76, price:'【待核实】', rating:'4.6/去哪儿', addr:'呼伦贝尔市（近似定位）', tags:['5A'], review:'莫尔格勒河蜿蜒于呼伦贝尔草原深处，河道曲折，被誉为天下第一曲水。<br>"当天阳光明媚,风很大,莫日格勒河静静流淌,天下第一九曲名不虚传。"——携程' },
  { prov:'内蒙古自治区', name:'克什克腾石阵旅游区', county:'赤峰市', type:'scenic', level:'5A', lat:43.94, lng:117.47, price:'【待核实】', rating:'4.6/携程', addr:'赤峰市（近似定位）', tags:['5A'], review:'克什克腾旗花岗岩石林，冰川冻融形成，属世界地质公园核心园区。<br>"感叹大自然的神奇,一个词,鬼斧神工!鲲鹏落草原,桃园结义,七仙女。"——携程' },

  { prov:'辽宁省', name:'沈阳世博园（沈阳植物园）', county:'沈阳市', type:'scenic', level:'5A', lat:41.84, lng:123.63, price:'【待核实】', rating:'4.6/携程', addr:'沈阳市（近似定位）', tags:['5A'], review:'2006年世界园艺博览会举办地，汇集百余个展园，百合塔为标志建筑。<br>"世博园今年的菊花展特别漂亮!北京园等各个园区都有丰富多彩的菊花展,造型各异,颜色鲜艳,十分别致。"——携程' },
  { prov:'辽宁省', name:'张氏帅府博物馆', county:'沈阳市', type:'scenic', level:'4A', lat:41.793, lng:123.457, price:'【待核实】', rating:'4.5/去哪儿', addr:'沈阳市（近似定位）', tags:['4A'], review:'张作霖、张学良父子的官邸私宅，大青楼小青楼并立，东北近代史见证。<br>"一座帅府半部民国史,旧居保存完好,青砖院落很有年代感。"——携程<br>"少帅府还是值得一来的,非常震撼,尤其是里面的四合院+大青楼的格局"——携程' },
  { prov:'辽宁省', name:'大连森林动物园', county:'大连市', type:'scenic', level:'4A', lat:38.88, lng:121.63, price:'【待核实】', rating:'4.7/携程', addr:'大连市（近似定位）', tags:['4A'], review:'白云山麓依山而建，圈养放养结合，可观赏大熊猫等珍稀动物。' },
  { prov:'辽宁省', name:'大连圣亚海洋世界', county:'大连市', type:'scenic', level:'4A', lat:38.87, lng:121.6, price:'【待核实】', rating:'4.6/今日头条游记', addr:'大连市（近似定位）', tags:['4A'], review:'星海湾海底通道式水族馆，海底隧道长约118米，极地动物丰富。' },
  { prov:'辽宁省', name:'盘锦红海滩国家风景廊道', county:'盘锦市', type:'scenic', level:'4A', lat:40.85, lng:121.86, price:'【待核实】', rating:'4.5/携程', addr:'盘锦市（近似定位）', tags:['4A'], review:'碱蓬草覆盖的滨海滩涂，秋季形成红色海岸线，湿地为丹顶鹤栖息地。<br>"盘锦的红海滩,去的时候已是深秋了,稍有遗憾,因为红色已经渐渐消退了,不过还是挺震撼的"——大众点评<br>"景色是兰的海水,红的海滩,很美,孩子们玩的开心。"——携程' },
  { prov:'辽宁省', name:'兴城古城', county:'葫芦岛市', type:'scenic', level:'4A', lat:40.62, lng:120.7, price:'【待核实】', rating:'4.7/携程', addr:'葫芦岛市（近似定位）', tags:['4A'], review:'明代宁远城，保存完整的方形古城，袁崇焕曾在此取得宁远大捷。<br>"一座活着的军事古城,体验感超预期!最震撼的是站在城楼上,想象袁崇焕将军在此击退强敌的场景"——携程<br>"走在3200米的青砖城墙上,仿佛能触摸到六百年的历史脉搏。"——携程' },
  { prov:'辽宁省', name:'鸭绿江断桥', county:'丹东市', type:'scenic', level:'4A', lat:40.12, lng:124.39, price:'【待核实】', rating:'4.7/携程', addr:'丹东市（近似定位）', tags:['4A'], review:'1950年被炸毁的鸭绿江大桥遗迹，桥体弹痕犹存，隔江可望朝鲜新义州。<br>"站在鸭绿江断桥上,江风拂面,心中真是五味杂陈啊。"——大众点评<br>"上桥走一走体验感十足,雄赳赳,气昂昂跨过鸭绿江的气势"——携程' },

  { prov:'辽宁省', name:'关门山国家森林公园', county:'本溪市', type:'scenic', level:'4A', lat:41.08, lng:124.24, price:'【待核实】', rating:'4.7/携程', addr:'本溪市（近似定位）', tags:['4A'], review:'本溪东部山区森林公园，秋季枫叶景观著名，有东北小黄山之称。<br>"十一自驾打卡本溪关门山,不愧是“东北小黄山”,秋日山林氛围感拉满!"——携程<br>"景区很大,现在去枫叶还有一些不太艳丽,但一路溪水潺潺,也是很美的。"——携程' },
  { prov:'山东省', name:'青岛海底世界', county:'青岛市', type:'scenic', level:'4A', lat:36.056, lng:120.338, price:'【待核实】', rating:'4.7/携程', addr:'青岛市（近似定位）', tags:['4A'], review:'位于汇泉湾畔的大型海洋馆，可穿行海底隧道观赏海洋生物。<br>"青岛海底世界值得打卡!标志性海底隧道沉浸式体验,鲨鱼、鳐鱼、海龟从头顶缓缓游过。水母宫光影梦幻,非常出片。"——携程' },
  { prov:'山东省', name:'青岛啤酒博物馆', county:'青岛市', type:'scenic', level:'4A', lat:36.07, lng:120.367, price:'【待核实】', rating:'4.6/携程', addr:'青岛市（近似定位）', tags:['4A'], review:'设在百年青岛啤酒厂老厂房内，展示啤酒酿造工艺与品牌历史。<br>"参观青岛啤酒博物馆,了解了青岛啤酒百年历史,熟悉了青岛啤酒酿造工艺,观看了青岛啤酒制作流程"——携程<br>"青岛啤酒博物馆非常值得一去,这里不仅是世界五大啤酒博物馆之一"——携程' },
  { prov:'山东省', name:'青岛海滨风景区', county:'青岛市', type:'scenic', level:'4A', lat:36.059, lng:120.319, price:'免费', rating:'4.7/携程', addr:'青岛市（近似定位）', tags:['4A'], review:'以栈桥、小青岛等滨海景点为核心的青岛湾沿岸观光带。' },
  { prov:'山东省', name:'千佛山风景区', county:'济南市', type:'scenic', level:'4A', lat:36.641, lng:117.031, price:'30元', rating:'4.7/携程', addr:'济南市（近似定位）', tags:['4A'], review:'济南三大名胜之一，有隋代千佛崖造像，可俯瞰济南城区。<br>"千佛山不愧是济南三大名胜之一,整体游览体验格外舒服。"——携程<br>"千佛山还是不错的,适合出行锻炼身体时去锻炼,总体不高,大人小孩都适合去爬一下。"——大众点评' },
  { prov:'山东省', name:'大明湖', county:'济南市', type:'scenic', level:'5A', lat:36.675, lng:117.025, price:'免费', rating:'4.6/携程', addr:'济南市（近似定位）', tags:['5A'], review:'由众泉汇流而成的城中湖，湖畔有历下亭、超然楼等古迹。<br>"大明湖地处济南市中心,是旅游必打卡的景点,整个公园免门票"——携程' },
  { prov:'山东省', name:'烟台山景区', county:'烟台市', type:'scenic', level:'4A', lat:37.549, lng:121.401, price:'【待核实】', rating:'4.6/携程', addr:'烟台市（近似定位）', tags:['4A'], review:'烟台市区北端滨海山丘，有明代狼烟墩台遗址与近代领事馆建筑群。<br>"烟台山还是很值得打卡的,沿百年老街朝阳街一直走到头,就是烟台山了。"——携程<br>"登上烟台山的灯塔,被眼前的云彩美到了"——携程' },
  { prov:'山东省', name:'长岛风景区', county:'烟台市', type:'scenic', level:'4A', lat:37.922, lng:120.734, price:'【待核实】', rating:'4.7/携程', addr:'烟台市（近似定位）', tags:['4A'], review:'庙岛群岛主岛区域，有九丈崖、月牙湾等海蚀地质景观。' },
  { prov:'山东省', name:'成山头风景区', county:'威海市', type:'scenic', level:'4A', lat:37.392, lng:122.684, price:'【待核实】', rating:'4.7/携程', addr:'威海市（近似定位）', tags:['4A'], review:'位于山东半岛最东端，又称天尽头，秦始皇曾两次巡行至此。<br>"成山头不愧是“中国好望角”,碧海蓝天与奇岩峭壁交相辉映"——携程<br>"站在这块伸向大海的巨石之上,极目远眺,海天一色的壮丽景象尽收眼底"——携程' },
  { prov:'山东省', name:'沂山风景区', county:'潍坊市', type:'scenic', level:'5A', lat:36.187, lng:118.656, price:'【待核实】', rating:'4.6/携程', addr:'潍坊市（近似定位）', tags:['5A'], review:'临朐县境山地景区，古称五镇之首，东镇庙遗址位于山麓。<br>"自然环境景色优美,人文历史悠久,不来沂山不知道是五镇之首,也看到了百丈崖这样宏伟的瀑布景观"——携程' },
  { prov:'山东省', name:'青州古城', county:'潍坊市', type:'scenic', level:'5A', lat:36.688, lng:118.478, price:'免费', rating:'4.6/携程', addr:'潍坊市（近似定位）', tags:['5A'], review:'古九州之一青州的城址区域，保留昭德古街等历史街巷。<br>"难得免费开放的5A级古城!古九州底蕴深厚,青石板街巷纵横,牌坊林立。"——携程' },
  { prov:'山东省', name:'周村古商城', county:'淄博市', type:'scenic', level:'4A', lat:36.8, lng:117.858, price:'【待核实】', rating:'4.4/携程', addr:'淄博市（近似定位）', tags:['4A'], review:'周村区的百年商业街市，历史上丝绸业繁盛，有旱码头之称。<br>"最像古城的一座古城,最最最最最重要的是 古城的停车费只要1元/小时。"——去哪儿<br>"景区内店铺林立、街巷纵横,为山东仅有、江北罕见"——大众点评' },
  { prov:'山东省', name:'萤火虫水洞·地下大峡谷', county:'临沂市', type:'scenic', level:'5A', lat:35.79, lng:118.63, price:'【待核实】', rating:'4.6/张家界武陵源旅游官网', addr:'临沂市（近似定位）', tags:['5A'], review:'沂水县境内的溶洞景区，地下大峡谷以洞穴漂流为特色。<br>"真的被震撼到了,北方一般没有喀斯特溶洞,南方像贵州等地方最多,竟然在沂水这个小地方有这么大的溶洞"——携程<br>"来临沂必打卡的溶洞景区。亿万年形成的地下溶洞,石笋、钟乳石景观很壮观"——携程' },
  { prov:'山东省', name:'微山湖旅游区', county:'济宁市', type:'scenic', level:'5A', lat:34.807, lng:117.12, price:'【待核实】', rating:'4.6/携程', addr:'济宁市（近似定位）', tags:['5A'], review:'北方大型淡水湖泊，铁道游击队故事发生地，夏季有连片荷花。<br>"微山湖景色秀丽,烟波浩渺,水天一色,是北方难得一见的大型天然湖泊。"——携程' },
  { prov:'山东省', name:'黄河口生态旅游区', county:'东营市', type:'scenic', level:'4A', lat:37.77, lng:119.05, price:'【待核实】', rating:'4.6/携程', addr:'东营市（近似定位）', tags:['4A'], review:'黄河入海口湿地，可观赏河海交汇景观与候鸟迁徙。<br>"黄河口生态旅游区太值得一去!大片芦苇荡一望无际,湿地生机盎然"——携程<br>"乘船前往入海口,亲眼见到黄蓝交汇的奇观,内心满是震撼。"——携程' },
  { prov:'山东省', name:'万平口海滨风景区', county:'日照市', type:'scenic', level:'4A', lat:35.392, lng:119.53, price:'免费', rating:'4.6/携程', addr:'日照市（近似定位）', tags:['4A'], review:'日照市区东侧的海滨浴场景区，海岸线平缓，沙质细软。' },
  { prov:'江苏省', name:'虎丘山风景名胜区', county:'苏州市', type:'scenic', level:'5A', lat:31.323, lng:120.573, price:'【待核实】', rating:'4.3/携程', addr:'苏州市（近似定位）', tags:['5A'], review:'苏州城西北名胜，有千年虎丘塔与剑池等古迹。<br>"都说虎丘是吴中第一名山,逛完确实名副其实。山体不高,走起来完全不累,不用费劲爬山。"——携程' },
  { prov:'江苏省', name:'留园', county:'苏州市', type:'scenic', level:'5A', lat:31.318, lng:120.562, price:'【待核实】', rating:'4.6/携程', addr:'苏州市（近似定位）', tags:['5A'], review:'中国四大名园之一，以建筑空间布局精巧和太湖石冠云峰著称。<br>"被留园惊艳到了。我最喜欢的苏州园林。3个多小时漫步园中,意犹未尽。"——携程' },
  { prov:'江苏省', name:'寒山寺', county:'苏州市', type:'scenic', level:'4A', lat:31.312, lng:120.567, price:'20元', rating:'4.5/携程', addr:'苏州市（近似定位）', tags:['4A'], review:'枫桥古镇旁古刹，因唐代张继《枫桥夜泊》诗而知名。<br>"因一首古诗慕名而来,来到这座藏在苏州城里的千年古刹。红墙、碑廊、钟楼,处处带着古诗里的意境。"——携程<br>"敲响古钟,浑厚悠长的钟声缓缓散开,内心也慢慢沉静下来。"——携程' },
  { prov:'江苏省', name:'金鸡湖景区', county:'苏州市', type:'scenic', level:'5A', lat:31.318, lng:120.716, price:'免费', rating:'4.5/携程', addr:'苏州市（近似定位）', tags:['5A'], review:'苏州工业园区内的城市湖泊，环湖有摩天轮、音乐喷泉等设施。<br>"很喜欢苏州金鸡湖畔的休闲氛围,造型独特的东方之门,浪漫的苏州之眼摩天轮"——携程' },
  { prov:'江苏省', name:'同里古镇', county:'苏州市', type:'scenic', level:'5A', lat:31.156, lng:120.712, price:'100元', rating:'4.6/携程', addr:'苏州市（近似定位）', tags:['5A'], review:'江南水乡古镇，以世界遗产退思园和水巷桥梁格局为特色。<br>"同里古镇值得一游,江南园林的杰作,碧水绿树拱桥乌篷船石板路,白墙黛瓦的极具年代感的江南民居"——携程' },
  { prov:'江苏省', name:'明孝陵', county:'南京市', type:'scenic', level:'5A', lat:32.055, lng:118.841, price:'70元', rating:'5/去哪儿', addr:'南京市（近似定位）', tags:['5A'], review:'明太祖朱元璋与马皇后的合葬陵寝，神道石像生保存完整。<br>"明孝陵底蕴厚重,古建筑气势恢宏,石刻神道古朴震撼。山林清幽静谧,历史氛围感十足"——携程' },
  { prov:'江苏省', name:'总统府', county:'南京市', type:'scenic', level:'4A', lat:32.046, lng:118.795, price:'35元', rating:'4.6/携程', addr:'南京市（近似定位）', tags:['4A'], review:'近代建筑群，先后为清代两江总督署与民国时期办公府邸。<br>"来南京必须去的地方,半部近代史!"——携程<br>"一座总统府,半部近代史。中西合璧的建筑古朴庄重,亭台园林雅致静谧。"——携程' },
  { prov:'江苏省', name:'玄武湖景区', county:'南京市', type:'scenic', level:'4A', lat:32.075, lng:118.795, price:'免费', rating:'4.8/携程', addr:'南京市（近似定位）', tags:['4A'], review:'南京城内最大湖泊，紧邻明城墙，湖中分布五洲。<br>"免费的大公园,不逊色于西湖,一年四季景色都迷人,夏日的荷花,秋季的银杏树"——携程<br>"出了南京站就到了湖边,湖面开阔,远山逶迤。"——携程' },
  { prov:'江苏省', name:'栖霞山', county:'南京市', type:'scenic', level:'4A', lat:32.152, lng:118.952, price:'【待核实】', rating:'4.8/携程', addr:'南京市（近似定位）', tags:['4A'], review:'南京东北郊名山，秋季红叶知名，山中有千佛岩与舍利塔。<br>"秋季漫山红枫从浅粉到深红层层晕染,像铺了满山霞彩"——携程<br>"栖霞山跟紫金山牛首山是南京最出名的三座名山了,栖霞赏秋很出名"——携程' },
  { prov:'江苏省', name:'个园', county:'扬州市', type:'scenic', level:'4A', lat:32.398, lng:119.444, price:'【待核实】', rating:'4.6/携程', addr:'扬州市（近似定位）', tags:['4A'], review:'扬州盐商园林，以四季假山叠石艺术为特色。<br>"个园,门票团购40左右,是中国四大名园之一,与以叠石为胜的园林相比,个园以竹石取胜"——大众点评<br>"四大名园之一的个园,果然名不虚传,来扬州必去的园林之一!"——大众点评' },
  { prov:'江苏省', name:'大明寺', county:'扬州市', type:'scenic', level:'4A', lat:32.422, lng:119.411, price:'【待核实】', rating:'4.5/携程', addr:'扬州市（近似定位）', tags:['4A'], review:'扬州蜀冈古刹，唐代鉴真东渡前曾在此主持法务。<br>"登上栖灵塔俯视能将周围景色一收眼底包括瘦西湖 景色太美了"——大众点评<br>"但是总的来说大明寺是一定要来的 即使不是佛教 感觉也很宁静"——大众点评' },
  { prov:'江苏省', name:'灵山大佛', county:'无锡市', type:'scenic', level:'5A', lat:31.426, lng:120.094, price:'210元', rating:'4.5/携程', addr:'无锡市（近似定位）', tags:['5A'], review:'无锡马山的大型青铜释迦牟尼立像，通高88米。<br>"灵山大佛是非常值得去的,那里风景真美,也非常有灵气。九龙灌浴非常震撼!"——携程<br>"大佛非常震撼。九龙灌浴表演老少皆宜。"——携程"大佛非常震撼。九龙灌浴表演老少皆宜。"——携程' },
  { prov:'江苏省', name:'无锡影视基地三国水浒城', county:'无锡市', type:'scenic', level:'5A', lat:31.504, lng:120.267, price:'【待核实】', rating:'4.6/携程', addr:'无锡市（近似定位）', tags:['5A'], review:'为拍摄《三国演义》《水浒传》建成的影视主题园区，滨临太湖。<br>"五星好评✨央视影视基地果然名不虚传!三国城大气恢宏,水浒城市井氛围感拉满。"——携程<br>"王牌演出三英战吕布真人真马,现场超震撼"——携程' },
  { prov:'江苏省', name:'天目湖旅游度假区', county:'常州市', type:'scenic', level:'5A', lat:31.298, lng:119.418, price:'【待核实】', rating:'4.6/携程', addr:'常州市（近似定位）', tags:['5A'], review:'溧阳境内的湖泊型景区，含山水园与南山竹海等板块。<br>"天目湖山水秀丽,青山环抱一汪碧水,泛舟湖上心旷神怡。"——携程' },
  { prov:'江苏省', name:'茅山风景区', county:'镇江市', type:'scenic', level:'5A', lat:31.718, lng:119.283, price:'【待核实】', rating:'4.5/携程', addr:'镇江市（近似定位）', tags:['5A'], review:'道教名山，横跨句容与金坛，有九霄万福宫等宫观。<br>"茅山上风景真不错,去的那天有点雨,下过雨的山林空气清新,负氧离子丰富,水洗过的青山绿水特别养眼。"——携程' },
  { prov:'江苏省', name:'濠河风景名胜区', county:'南通市', type:'scenic', level:'5A', lat:32.013, lng:120.864, price:'免费', rating:'4.5/携程', addr:'南通市（近似定位）', tags:['5A'], review:'环绕南通老城的护城河，国内保存较完整的古护城河之一。<br>"夜游濠河体验感极佳。乘船穿行于南通城区的灯光夜景中"——携程<br>"非常不错的国家5a级景区,免费参观,濠河是保存比较完整的古代护城河"——同程' },
  { prov:'江苏省', name:'云龙湖景区', county:'徐州市', type:'scenic', level:'5A', lat:34.238, lng:117.174, price:'免费', rating:'4.6/携程', addr:'徐州市（近似定位）', tags:['5A'], review:'徐州城区西南的湖泊，与云龙山相邻，三面环山。<br>"云龙湖在云龙山脚下,这里的徐州城看起来更像是烟雨江南,水光潋滟,杨柳依依,山清水秀"——携程' },
  { prov:'江苏省', name:'周恩来故里景区', county:'淮安市', type:'scenic', level:'5A', lat:33.512, lng:119.142, price:'免费', rating:'4.7/携程', addr:'淮安市（近似定位）', tags:['5A'], review:'由周恩来纪念馆、故居及驸马巷历史街区组成的纪念地。<br>"听说周恩来纪念地红色文化教育在全国都很出名,特意带孩子来接受教育。"——澎湃新闻' },
  { prov:'安徽省', name:'三河古镇', county:'合肥市', type:'scenic', level:'5A', lat:31.512, lng:117.196, price:'免费', rating:'4.8/携程', addr:'合肥市（近似定位）', tags:['5A'], review:'肥西县境内水乡古镇，丰乐河、杭埠河、小南河三水交汇。<br>"三河古镇是合肥周边很值得打卡的免费古镇,小桥流水,古街古巷氛围感十足。"——携程' },
  { prov:'安徽省', name:'新安江山水画廊', county:'黄山市', type:'scenic', level:'4A', lat:29.868, lng:118.435, price:'【待核实】', rating:'4.6/去哪儿', addr:'黄山市（近似定位）', tags:['4A'], review:'歙县境内新安江段，两岸徽派村落与山水相映，可乘船游览。<br>"新安江风景很美,沿江游船游览非常惬意,九姓捕鱼的小表演很有趣味性"——携程<br>"江畔梯田、古埠、枇杷园相映成趣,山水与徽风相融,宛如流动的水墨长卷"——携程' },
  { prov:'安徽省', name:'齐云山', county:'黄山市', type:'scenic', level:'4A', lat:29.789, lng:118.253, price:'【待核实】', rating:'4.6/携程', addr:'黄山市（近似定位）', tags:['4A'], review:'道教名山，位于休宁县，以丹霞地貌与摩崖石刻著称。<br>"齐云山不亏道教四大名山之一,逍遥街的活动也非常有意思。特别是非遗传承表演非常精彩。"——携程<br>"齐云山非常美,而且人不多,非常适合作为周末爬山的好去处。山上民宿餐厅都很多,整个山体不大,爬起来也不累。"——携程' },
  { prov:'安徽省', name:'太平湖风景区', county:'黄山市', type:'scenic', level:'4A', lat:30.295, lng:118.013, price:'【待核实】', rating:'5/去哪儿', addr:'黄山市（近似定位）', tags:['4A'], review:'黄山市北部的峡谷型湖泊，由陈村水库蓄水形成。<br>"太平湖宛如一颗璀璨明珠,镶嵌在黄山与九华山之间。这里湖水清澈碧透,青山连绵起伏,岛屿星罗棋布"——携程<br>"风景不错,游客不多,很适合悠闲游"——携程' },
  { prov:'安徽省', name:'牯牛降风景区', county:'池州市', type:'scenic', level:'4A', lat:30.06, lng:117.4, price:'【待核实】', rating:'4.6/携程', addr:'池州市（近似定位）', tags:['4A'], review:'皖南国家级自然保护区，主峰海拔1727米，森林生态系统保存完好。<br>"祁门牯牛降地处深林深处,整个森林保护区无论是从空气、水质来讲都是十分优质的,十分适合来此洗洗肺"——携程<br>"远离城市喧嚣,在山林中碧水间放空自己,于天然中放飞心灵,可以春天来采茶,夏天来避暑"——携程' },
  { prov:'安徽省', name:'方特欢乐世界', county:'芜湖市', type:'scenic', level:'4A', lat:31.353, lng:118.433, price:'【待核实】', rating:'5/携程', addr:'芜湖市（近似定位）', tags:['4A'], review:'芜湖的大型主题乐园，包含多个室内外游乐项目。' },
  { prov:'安徽省', name:'龙川景区', county:'宣城市', type:'scenic', level:'5A', lat:30.071, lng:118.592, price:'【待核实】', rating:'4.6/携程', addr:'宣城市（近似定位）', tags:['5A'], review:'绩溪县龙川村胡氏聚居地，存有明代胡氏宗祠与奕世尚书坊。<br>"龙川风景区不愧是5A景区,很值得一游,景色迷人,感觉风景靓丽,空气清新,象在画中游"——携程' },
  { prov:'安徽省', name:'查济景区', county:'宣城市', type:'scenic', level:'4A', lat:30.53, lng:117.95, price:'【待核实】', rating:'4.4/携程', addr:'宣城市（近似定位）', tags:['4A'], review:'泾县境内保存规模较大的明清古村落，古桥祠堂众多。<br>"查济古村落原汁原味,没有过度商业化。白墙黛瓦溪流环绕,古祠堂、老巷弄很有韵味,慢悠悠闲逛十分舒服"——携程<br>"查济古村是典型的徽派古建筑村落。粉壁黛瓦马头墙,天井院落配三雕刻(砖雕石雕木雕)依山傍水,素雅重礼"——携程' },
  { prov:'安徽省', name:'天堂寨风景区', county:'六安市', type:'scenic', level:'5A', lat:31.167, lng:115.768, price:'【待核实】', rating:'4.4/携程', addr:'六安市（近似定位）', tags:['5A'], review:'大别山名山之一，位于金寨县，以瀑布群与原始森林为主要景观。<br>"带家人去安徽六安的天堂寨景区游玩,华东的最后一片原始森林"——携程' },
  { prov:'安徽省', name:'万佛湖风景区', county:'六安市', type:'scenic', level:'5A', lat:31.31, lng:116.945, price:'【待核实】', rating:'4.8/携程', addr:'六安市（近似定位）', tags:['5A'], review:'舒城县境内龙河口水库形成的湖泊景区，湖中岛屿众多。<br>"万佛湖真的太治愈了!湖水清澈碧绿,群山环绕,岛屿错落有致"——携程<br>"万佛湖宛如一颗璀璨明珠镶嵌大地!它碧波浩渺,湖水清澈如镜"——携程' },
  { prov:'安徽省', name:'八里河旅游区', county:'阜阳市', type:'scenic', level:'5A', lat:32.563, lng:116.262, price:'【待核实】', rating:'4.8/携程', addr:'阜阳市（近似定位）', tags:['5A'], review:'颍上县境内的湖泊景区，分为东区、西区等多个园区。<br>"八里河真的是皖北超良心的5A景区,湖景开阔、中西景观都有,拍照特别出片。"——携程<br>"是湿地景色,环境总体上不错。但里面多为人造景观,没什么特别好玩的。"——携程' },
  { prov:'安徽省', name:'琅琊山风景区', county:'滁州市', type:'scenic', level:'4A', lat:32.283, lng:118.31, price:'【待核实】', rating:'4.7/携程', addr:'滁州市（近似定位）', tags:['4A'], review:'滁州城西名山，欧阳修《醉翁亭记》所记醉翁亭位于山中。<br>"琅琊山作为5A景区,整体运营十分成熟。景交车调度有序,游览动线规划合理,各类配套设施完善。"——携程<br>"实景比想象中更清幽。亭子古朴,林间小道蜿蜒,仿佛能听见欧阳修当年的吟诵。空气里都是山野的味道"——携程' },
  { prov:'安徽省', name:'采石矶', county:'马鞍山市', type:'scenic', level:'4A', lat:31.664, lng:118.467, price:'【待核实】', rating:'4.7/携程', addr:'马鞍山市（近似定位）', tags:['4A'], review:'长江沿岸名矶，位于马鞍山，矶头建有纪念李白的太白楼。<br>"长江三大矶之首的采石矶,风景不错,景区内绿树成荫,亭台楼阁小桥流水,山不高轻松登顶,上到三台阁可到看长江风景"——携程<br>"采石矶还是值得走一走,人不太多,大自然感觉很好~"——去哪儿' },
  { prov:'安徽省', name:'皇藏峪国家森林公园', county:'宿州市', type:'scenic', level:'4A', lat:34.07, lng:117.06, price:'【待核实】', rating:'4.6/携程', addr:'宿州市（近似定位）', tags:['4A'], review:'萧县境内山地景区，因刘邦藏身传说得名，森林覆盖率高。' },
  { prov:'安徽省', name:'五千年文博园', county:'安庆市', type:'scenic', level:'4A', lat:30.445, lng:116.309, price:'【待核实】', rating:'4.6/携程', addr:'安庆市（近似定位）', tags:['4A'], review:'太湖县境内的文化主题园区，含根雕展馆与仿古建筑群。<br>"这个景区本身是有文化的,三皇五帝,孔孟之道,超大圣人雕塑,朝代更替,人伦纲常,秦皇汉武,到近代史,再到现代,有创意"——携程<br>"建议大家只买一期的,二期感觉像荒废了一样,走过去也挺远的。总体下来去下一期就可以了,还有点可玩性。"——携程' },
  { prov:'浙江省', name:'西溪国家湿地公园', county:'杭州市', type:'scenic', level:'5A', lat:30.273, lng:120.062, price:'80元', rating:'4.6/去哪儿', addr:'杭州市（近似定位）', tags:['5A'], review:'城市湿地典范，摇橹船穿行芦苇水道。<br>"西溪湿地面积很大,更适合坐船游览,既可以赏江南的水乡美景,又可以节约体力,凉快一些。"——携程' },
  { prov:'浙江省', name:'宋城', county:'杭州市', type:'scenic', level:'4A', lat:30.194, lng:120.105, price:'【待核实】', rating:'4.7/携程', addr:'杭州市（近似定位）', tags:['4A'], review:'依托宋文化建造的主题公园，大型演出《宋城千古情》常年上演。<br>"各种节目表演真的是好看极了,推荐宋城千古情和幻影,电视里看表演和现场看真的完全不一样。"——大众点评<br>"千古情非常震撼,大型歌舞剧很精彩,科技视觉效果很强 抛绣球好玩好看"——大众点评' },
  { prov:'浙江省', name:'良渚古城遗址公园', county:'杭州市', type:'scenic', level:'4A', lat:30.377, lng:119.993, price:'【待核实】', rating:'4.7/携程', addr:'杭州市（近似定位）', tags:['4A'], review:'良渚文化核心遗址，2019年列入世界遗产名录，展示古城格局。<br>"良渚古城遗址公园不愧为世界文化遗产,实地游览令人深深震撼。园区辽阔静谧,稻田、水网与夯土遗址相融"——携程<br>"非常值得去 一年四季 都是可以的 很放松 在里面闲逛 是很休闲的 拍照也很出片"——携程' },
  { prov:'浙江省', name:'天目山', county:'杭州市', type:'scenic', level:'4A', lat:30.342, lng:119.437, price:'【待核实】', rating:'4.3/携程', addr:'杭州市（近似定位）', tags:['4A'], review:'临安区境山地，有古银杏与柳杉群落，峰顶分东、西两天目。' },
  { prov:'浙江省', name:'溪口-滕头旅游景区', county:'宁波市', type:'scenic', level:'5A', lat:29.66, lng:121.272, price:'【待核实】', rating:'4.6/携程', addr:'宁波市（近似定位）', tags:['5A'], review:'奉化溪口为蒋氏故里，滕头村为生态农业示范村，两地合并为一个景区。<br>"蒋氏故居位于溪口古镇,古镇很安静、游客不多,走在古镇步行街上"——携程<br>"雪窦山风景区和蒋氏故居联票安排非常合理,两天整好,一点不累。"——携程' },
  { prov:'浙江省', name:'天一阁·月湖景区', county:'宁波市', type:'scenic', level:'5A', lat:29.872, lng:121.538, price:'30元', rating:'4.5/携程', addr:'宁波市（近似定位）', tags:['5A'], review:'天一阁为中国现存最早的私家藏书楼，毗邻月湖历史街区。<br>"不愧是亚洲最古老的私家藏书楼!踏入园区满是清雅书香"——携程<br>"天一阁很值得一去,历史文化底蕴非常浓厚,园林环境也很清幽。"——携程' },
  { prov:'浙江省', name:'前童古镇', county:'宁波市', type:'scenic', level:'4A', lat:29.29, lng:121.382, price:'【待核实】', rating:'4.3/携程', addr:'宁波市（近似定位）', tags:['4A'], review:'宁海县境内明清古村镇，童姓聚居，水系穿村而过的格局保存完好。<br>"家家有活水,户户有雕梁,挺有味道的。陈逸飞以前在这儿拍过电影。"——今日头条<br>"古镇挺大的,逛了三个多小时才逛完。"——今日头条' },
  { prov:'浙江省', name:'楠溪江', county:'温州市', type:'scenic', level:'4A', lat:28.42, lng:120.68, price:'【待核实】', rating:'4/携程', addr:'温州市（近似定位）', tags:['4A'], review:'永嘉县境内瓯江支流，以江流滩林与沿岸古村落为特色。<br>"这里是一个比较小众的景点,主要就是为了带孩子体验一下竹筏漂流,结果现在都是电动的了,没有人力竹筏了"——去哪儿<br>"楠溪江风景很好,景点众多,且有些是免费的,适合春天全家出动,吹吹风、看看景,发发呆,吃吃饭。"——携程' },
  { prov:'浙江省', name:'江心屿', county:'温州市', type:'scenic', level:'4A', lat:28.021, lng:120.632, price:'【待核实】', rating:'4.7/携程', addr:'温州市（近似定位）', tags:['4A'], review:'温州市区瓯江中的岛屿，有东西双塔与江心寺等古迹。' },
  { prov:'浙江省', name:'南湖旅游区', county:'嘉兴市', type:'scenic', level:'5A', lat:30.76, lng:120.762, price:'【待核实】', rating:'4.4/携程', addr:'嘉兴市（近似定位）', tags:['5A'], review:'嘉兴城南湖泊，中共一大会址之一的红船停靠于湖面。<br>"南湖不光风景很美,还有很多历史故事,特别是关于我党第一大的召开"——携程<br>"嘉兴南湖是非常美丽的湖泊,这里烟雨朦胧,很有古典韵味"——携程' },
  { prov:'浙江省', name:'南浔古镇', county:'湖州市', type:'scenic', level:'5A', lat:30.87, lng:120.419, price:'【待核实】', rating:'4.4/携程', addr:'湖州市（近似定位）', tags:['5A'], review:'湖州水乡古镇，有小莲庄、嘉业堂藏书楼等近代园林宅邸。<br>"南浔古镇主街全域免费游览十分划算,园内古迹联票定价亲民,性价比很高。"——同程<br>"小莲庄景观雅致秀美,张石铭旧宅恢弘惊艳"——携程' },
  { prov:'浙江省', name:'莫干山', county:'湖州市', type:'scenic', level:'4A', lat:30.601, lng:119.862, price:'【待核实】', rating:'4.7/携程', addr:'湖州市（近似定位）', tags:['4A'], review:'德清县境山地度假地，以竹海、近代别墅群和清凉气候著称。<br>"莫干山很美,但是很费腿,虽然有接驳车,但是换车点离景点还要走很多很多路,腿脚不好不建议来!无数的台阶"——携程<br>"特意避开人流来到莫干山度假,彻底被这片竹海治愈了。山林环境清幽静谧,空气清新湿润,行走在步道上十分惬意。"——携程' },
  { prov:'浙江省', name:'鲁迅故里·沈园', county:'绍兴市', type:'scenic', level:'5A', lat:29.993, lng:120.589, price:'鲁迅故里免费，沈园40元', rating:'4.7/携程', addr:'绍兴市（近似定位）', tags:['5A'], review:'绍兴城区鲁迅故居街区与宋代名园沈园组成的景区。<br>"白墙映着池水,亭台清幽安静,没有过度喧闹。"——携程<br>"沈园不大,1个小时可以逛完,是讲陆游和唐婉的爱情故事"——携程' },
  { prov:'浙江省', name:'兰亭', county:'绍兴市', type:'scenic', level:'4A', lat:29.942, lng:120.512, price:'40元', rating:'4.7/携程', addr:'绍兴市（近似定位）', tags:['4A'], review:'绍兴西南郊古迹，相传为王羲之与友人雅集处，存鹅池碑亭。<br>"兰亭,因了王羲之,因了《兰亭序》,早已神往,如今身临其境,真是一个清雅的好地方。非常喜欢这里。"——大众点评<br>"茂林修竹,曲水流觞,一步一景,不虚此行。"——大众点评' },
  { prov:'浙江省', name:'双龙风景旅游区', county:'金华市', type:'scenic', level:'4A', lat:29.152, lng:119.681, price:'【待核实】', rating:'5/携程', addr:'金华市（近似定位）', tags:['4A'], review:'金华山麓溶洞景区，双龙洞因洞口双龙形钟乳石得名。' },
  { prov:'浙江省', name:'神仙居', county:'台州市', type:'scenic', level:'5A', lat:28.66, lng:120.57, price:'【待核实】', rating:'4.8/携程', addr:'台州市（近似定位）', tags:['5A'], review:'仙居县境内以流纹岩峰林著称的山岳景区，有观音峰等景观。<br>"不愧是5A景区,也是为数不多的有超长电梯的景区,真是对不喜欢爬山的人来说非常友好"——携程<br>"神仙居风光秀丽,山石奇峰错落有致。如意桥惊险壮观,栈道平缓好走。"——携程' },
  { prov:'浙江省', name:'桃花岛风景旅游区', county:'舟山市', type:'scenic', level:'4A', lat:29.815, lng:122.281, price:'【待核实】', rating:'4.8/携程', addr:'舟山市（近似定位）', tags:['4A'], review:'舟山群岛大岛之一，因金庸小说《射雕英雄传》而广为人知。' },
  { prov:'上海市', name:'上海科技馆', county:'上海市', type:'scenic', level:'5A', lat:31.224, lng:121.543, price:'60元', rating:'4.7/携程', addr:'上海市（近似定位）', tags:['5A'], review:'浦东大型科技展馆，含生物万象、地壳探秘等常设展区。' },
  { prov:'上海市', name:'上海野生动物园', county:'上海市', type:'scenic', level:'5A', lat:31.06, lng:121.709, price:'130元', rating:'4.7/携程', addr:'上海市（近似定位）', tags:['5A'], review:'浦东大型动物园，车入区可乘车观赏猛兽，饲养大熊猫等动物。' },
  { prov:'上海市', name:'东方绿舟', county:'上海市', type:'scenic', level:'4A', lat:31.096, lng:121.058, price:'50元', rating:'5/携程', addr:'上海市（近似定位）', tags:['4A'], review:'青浦淀山湖畔的青少年素质教育基地，含智慧大道与仿真航母等设施。' },
  { prov:'上海市', name:'上海辰山植物园', county:'上海市', type:'scenic', level:'4A', lat:31.087, lng:121.187, price:'60元', rating:'5/携程', addr:'上海市（近似定位）', tags:['4A'], review:'松江区大型植物园，由矿坑改造的矿坑花园为特色景观。' },
  { prov:'上海市', name:'上海植物园', county:'上海市', type:'scenic', level:'4A', lat:31.152, lng:121.451, price:'【待核实】', rating:'4/携程', addr:'上海市（近似定位）', tags:['4A'], review:'市区南部植物园，盆景园与兰室为特色展区。' },
  { prov:'上海市', name:'古猗园', county:'上海市', type:'scenic', level:'4A', lat:31.297, lng:121.324, price:'12元', rating:'5/携程', addr:'上海市（近似定位）', tags:['4A'], review:'嘉定南翔的明代古典园林，以猗猗绿竹与逸野堂等景观著称。<br>"非常适合来逛一逛的地方,夏天荷花盛开,记得喷点驱蚊药水,蚊子还是蛮多的,票价12元,但是不算贵"——携程<br>"闹中取静的江南名园,池水清澈,亭台倒映水面,园内有缺角亭、唐代经幢等古迹。春夏赏荷、秋日看银杏"——携程' },
  { prov:'上海市', name:'枫泾古镇', county:'上海市', type:'scenic', level:'4A', lat:30.841, lng:121.002, price:'【待核实】', rating:'4.6/携程', addr:'上海市（近似定位）', tags:['4A'], review:'金山区的江南水乡古镇，地处吴越交界，保存多段老街。<br>"今年过年去了趟枫泾古镇,感觉还挺不错的。就是人有点太多了,停车也十分地困难"——携程<br>"枫泾古镇坐落于上海金山区,是一座充满江南水乡风情的千年古镇,以“三步两座桥,一望十条港”闻名"——携程' },
  { prov:'上海市', name:'田子坊', county:'上海市', type:'scenic', level:'3A', lat:31.211, lng:121.468, price:'免费', rating:'4.8/携程', addr:'上海市（近似定位）', tags:['3A'], review:'泰康路弄堂改造的文创街区，石库门里弄内有众多小店与工作室。' },
  { prov:'上海市', name:'上海世纪公园', county:'上海市', type:'scenic', level:'4A', lat:31.216, lng:121.55, price:'10元', rating:'4.6/携程', addr:'上海市（近似定位）', tags:['4A'], review:'浦东大型城市公园，含湖泊、草坪与梅花景观区。' },
  { prov:'上海市', name:'上海共青森林公园', county:'上海市', type:'scenic', level:'4A', lat:31.297, lng:121.543, price:'免费', rating:'5/携程', addr:'上海市（近似定位）', tags:['4A'], review:'杨浦区黄浦江畔的森林公园，以林地与水系景观为主。' },
  { prov:'上海市', name:'上海海昌海洋公园', county:'上海市', type:'scenic', level:'4A', lat:30.888, lng:121.94, price:'【待核实】', rating:'4/携程', addr:'上海市（近似定位）', tags:['4A'], review:'临港地区的海洋主题乐园，含极地海洋动物展馆与游乐设施。<br>"上海海昌海洋公园体验感很棒!虎鲸科普秀特别震撼,虎鲸跃出水面的瞬间全场欢呼,前排还会被水花泼到,很有氛围感。"——携程<br>"大部分项目都拉爆了,除了海豚过山车没有一个项目能打的,作为一个海洋公园,动物元素太少"——携程' },
  { prov:'湖北省', name:'木兰草原', county:'武汉市', type:'scenic', level:'5A', lat:31.04, lng:114.44, price:'【待核实】', rating:'5/携程', addr:'武汉市（近似定位）', tags:['5A'], review:'黄陂木兰文化生态旅游区组成部分，华中地区最大的草原风情主题景区。<br>"这次去体验了一下木兰草原网红观光小火车,彩色车身很出片!慢悠悠穿梭在大草原、花海之间"——携程<br>"演出很震撼 烟花也很不错 门票的性价比还是很值的 格桑花海正好盛开 阳光下很出片"——携程' },
  { prov:'湖北省', name:'清江画廊', county:'宜昌市', type:'scenic', level:'5A', lat:30.47, lng:111.19, price:'【待核实】', rating:'5/携程', addr:'宜昌市（近似定位）', tags:['5A'], review:'长阳清江山水，乘船游江观武落钟离山，土家族发祥地。<br>"船在江中游,人在画里走。看两岸青山连绵,听土家山歌悠扬,江水绿得像宝石,倒映着蓝天白云"——携程<br>"今天天气转晴了,清江画廊景色非常清幽静美,是和两峡一坝不同的体验"——携程' },
  { prov:'湖北省', name:'三峡人家', county:'宜昌市', type:'scenic', level:'5A', lat:30.76, lng:111.16, price:'【待核实】', rating:'5/携程', addr:'宜昌市（近似定位）', tags:['5A'], review:'西陵峡畔的峡江风情景区，龙进溪、灯影石与土家吊脚楼交融。<br>"一步一景,白墙青瓦,坐船登岸,仿佛一秒穿越水墨画。游览明月湾,这里被誉为"长江三峡第一湾""——携程<br>"龙进溪溪水清澈见底,两岸竹林掩映,坐乌篷船逆流而上,能看到土家姑娘溪边捶衣、鸬鹚捕鱼的原生态场景"——携程' },
  { prov:'湖北省', name:'屈原故里文化旅游区', county:'宜昌市', type:'scenic', level:'5A', lat:30.83, lng:110.98, price:'【待核实】', rating:'5/携程', addr:'宜昌市（近似定位）', tags:['5A'], review:'秭归凤凰山，与三峡大坝隔江相望，屈原祠迁建于此。<br>"屈原故里文化旅游区的景区面积比较大,有山上和江边两部分。景区的屈原文化和端午因素浓厚"——携程<br>"屈原祠是在葛州坝建设时,因征用地而搬迁重建,共有9个展斤,有屈原铜像,受千万人敬仰"——携程' },
  { prov:'湖北省', name:'腾龙洞', county:'恩施土家族苗族自治州', type:'scenic', level:'5A', lat:30.33, lng:109, price:'【待核实】', rating:'5/携程', addr:'恩施土家族苗族自治州（近似定位）', tags:['5A'], review:'利川巨型喀斯特溶洞，洞口高逾70米，内有激光秀演出。<br>"亚洲特大溶洞确实很震撼,洞内空间巨大,温度很低,夏天进去特别凉快"——携程<br>"非常震撼的巨型溶洞,空间宏大开阔,和普通小溶洞完全不同。洞内温度适宜很适合避暑"——携程' },
  { prov:'湖北省', name:'恩施土司城', county:'恩施土家族苗族自治州', type:'scenic', level:'4A', lat:30.29, lng:109.48, price:'【待核实】', rating:'5/携程', addr:'恩施土家族苗族自治州（近似定位）', tags:['4A'], review:'土家族仿古建筑群，九进堂规模宏大，展示土司文化。<br>"进门就被城门楼震撼,里面九进堂、廪君祠、土司王府都值得细看,木质结构和吊脚楼元素很有特色。"——携程<br>"没啥意思的景点,避坑"——去哪儿' },
  { prov:'湖北省', name:'三国赤壁古战场', county:'咸宁市', type:'scenic', level:'5A', lat:29.88, lng:113.64, price:'【待核实】', rating:'5/携程', addr:'咸宁市（近似定位）', tags:['5A'], review:'赤壁市长江南岸，赤壁之战发生地，存有摩崖石刻赤壁二字。<br>"类似逛公园一样,小朋友是个三国迷,全程很兴奋,沿着每个主题地点走,在不同时段都有NPC剧情表演"——携程<br>"去赤壁旅游必去三国古战场,尤其对三国历史感兴趣的朋友不容错过,也特别适合带娃的家庭"——携程' },
  { prov:'湖北省', name:'隐水洞', county:'咸宁市', type:'scenic', level:'4A', lat:29.6, lng:114.66, price:'【待核实】', rating:'5/携程', addr:'咸宁市（近似定位）', tags:['4A'], review:'通山典型喀斯特溶洞，洞内可乘船、小火车与步行游览。' },
  { prov:'湖北省', name:'明显陵', county:'荆门市', type:'scenic', level:'5A', lat:31.19, lng:112.72, price:'【待核实】', rating:'5/携程', addr:'荆门市（近似定位）', tags:['5A'], review:'钟祥明世宗父母合葬陵，世界文化遗产明清皇家陵寝组成部分。<br>"5A级景区,世界级遗产,明显陵景区恢弘肃穆,明代帝陵格局完整,神道石刻精美沧桑,建筑与山势自然交融"——携程<br>"园区规模宏大,内地所能见的最大的明代帝陵,环境肃穆优美,石结构建筑大部分完整,形制规整"——携程' },
  { prov:'湖北省', name:'古隆中', county:'襄阳市', type:'scenic', level:'5A', lat:31.98, lng:112, price:'【待核实】', rating:'5/携程', addr:'襄阳市（近似定位）', tags:['5A'], review:'诸葛亮躬耕隐居地，三顾茅庐典故发生处，有武侯祠等遗迹。<br>"襄阳古隆中取票方便 风景美 看了三顾堂前表演 听了三国评书 景区集历史 文化 自然风光于一体"——去哪儿<br>"蛮好玩的,既看了古迹,又回味了历史,NPC互动做的非常好!"——去哪儿' },
  { prov:'湖北省', name:'炎帝神农故里', county:'随州市', type:'scenic', level:'4A', lat:31.9, lng:113.28, price:'【待核实】', rating:'5/携程', addr:'随州市（近似定位）', tags:['4A'], review:'随县厉山镇炎帝神农诞生地，谒祖广场可容万人拜祖。' },
  { prov:'湖北省', name:'东坡赤壁', county:'黄冈市', type:'scenic', level:'4A', lat:30.44, lng:114.87, price:'【待核实】', rating:'4.4/携程', addr:'黄冈市（近似定位）', tags:['4A'], review:'黄冈古城西北长江边，苏轼前后赤壁赋创作地，又名文赤壁。' },
  { prov:'湖北省', name:'荆州古城历史文化旅游区', county:'荆州市', type:'scenic', level:'4A', lat:30.35, lng:112.24, price:'【待核实】', rating:'4.7/携程', addr:'荆州市（近似定位）', tags:['4A'], review:'保存完好的古城墙，周长约11公里，三国文化名城。<br>"全国少数真迹古城,气势宏伟,历史悠久,值得一游"——携程<br>"站在荆州古城墙下,仰头望去,高大巍峨的城墙就像一位饱经沧桑的老人,静静诉说着千年的故事。"——携程' },
  { prov:'湖北省', name:'龟峰山', county:'黄冈市', type:'scenic', level:'4A', lat:31.17, lng:115.03, price:'【待核实】', rating:'5/携程', addr:'黄冈市（近似定位）', tags:['4A'], review:'麻城境内山地景区，山顶巨石形似神龟，春季杜鹃花海著名。<br>"特意来龟峰山看杜鹃,四月底去的时候花还没完全盛开,只开了一部分,全盛期应该会非常震撼。"——携程<br>"景区相对来说非常挑天气,雨天雾天体验相当差,晴天非常好,后面有太阳后明显景色体验直线上升,满山遍野杜鹃非常漂亮"——携程' },
  { prov:'湖南省', name:'崀山', county:'邵阳市', type:'scenic', level:'5A', lat:26.43, lng:110.76, price:'【待核实】', rating:'5/携程', addr:'邵阳市（近似定位）', tags:['5A'], review:'新宁丹霞地貌，辣椒峰、骆驼峰、天一巷为代表性景观。<br>"标准的丹霞地貌,自然景色不错,天一巷也无愧于天下第一巷的名号,又深又长,有一定的趣味"——携程<br>"很小众但是很磅礴大气的景区。在八角寨景区,缆车登顶,鲸鱼闹海壮丽画面便映入眼帘,气势非凡"——携程' },
  { prov:'湖南省', name:'东江湖', county:'郴州市', type:'scenic', level:'5A', lat:25.94, lng:113.33, price:'【待核实】', rating:'5/携程', addr:'郴州市（近似定位）', tags:['5A'], review:'资兴人工湖泊，雾漫小东江晨雾如仙境，被誉为人间天上一湖水。<br>"漫步小东江,晨雾缭绕宛若仙境,江面薄雾轻柔,山水朦胧如画。渔夫撒网氛围感拉满"——携程<br>"郴州东江湖雾漫小东江完全是现实里的水墨仙境,专程早起看雾的确不虚此行!"——携程' },
  { prov:'湖南省', name:'桃花源', county:'常德市', type:'scenic', level:'5A', lat:28.87, lng:111.55, price:'【待核实】', rating:'5/携程', addr:'常德市（近似定位）', tags:['5A'], review:'陶渊明桃花源记原型地，秦溪秦谷再现武陵渔人探秘场景。<br>"真如世外桃源一般,青山绿水,景色宜人,穿行期间,身心涤荡,秦溪秦谷一线值得慢慢体验"——携程<br>"秦谷里面会有一些互动景点,走走逛逛还不错"——携程' },
  { prov:'湖南省', name:'花明楼（刘少奇故里）', county:'长沙市', type:'scenic', level:'5A', lat:28.01, lng:112.63, price:'【待核实】', rating:'4.5/携程', addr:'长沙市（近似定位）', tags:['5A'], review:'宁乡花明楼炭子冲，刘少奇同志故居与纪念馆所在地。<br>"刘少奇纪念馆是红色景点,是教育基地,可以带孩子来参观,一代伟人,值得我们去缅怀"——携程<br>"导游小肖接待热情,主动帮助游客拍照;行程安排合理,每个景点都有充裕时间游玩"——去哪儿' },
  { prov:'湖南省', name:'张家界大峡谷', county:'张家界市', type:'scenic', level:'4A', lat:29.42, lng:110.66, price:'【待核实】', rating:'5/携程', addr:'张家界市（近似定位）', tags:['4A'], review:'慈利峡谷景区，世界最长玻璃桥横跨谷上，全长约430米。<br>"大峡谷还是很壮观的,尤其是那个最高最长的玻璃桥。但桥上面太晒,一定要打伞哦,否则容易中暑。"——携程<br>"张家界大峡谷是我最喜欢的景点,虽然不敢玩刺激的设施,体验玻璃桥及玻璃栈道,漫步于峡谷溪流,美景美不胜收"——携程' },
  { prov:'湖南省', name:'黄龙洞', county:'张家界市', type:'scenic', level:'4A', lat:29.36, lng:110.71, price:'【待核实】', rating:'4.8/携程', addr:'张家界市（近似定位）', tags:['4A'], review:'武陵源大型溶洞，定海神针石笋高约20米，洞内有地下阴河。<br>"黄龙真的太美了!不愧是人间瑶池,满山彩池层层叠叠,湖水蓝绿通透像宝石一样。沿途山林郁郁葱葱"——携程<br>"素有“人间瑶池”之称的黄龙果然名不虚传!层层相连的钙化彩池错落分布,池水在光影下变幻出蓝、绿、黄等多种色彩"——携程<br>"黄龙被誉为人间瑶池,独特钙华彩池色彩斑斓。雪山林海环绕,五彩池惊艳夺目。"——携程<br>"网上很多人说避雷,但去了真的也是绝美!和九寨沟不同的风格,各有特色何必踩一捧一?"——携程' },
  { prov:'湖南省', name:'矮寨奇观旅游区', county:'湘西土家族苗族自治州', type:'scenic', level:'5A', lat:28.39, lng:109.59, price:'【待核实】', rating:'5/携程', addr:'湘西土家族苗族自治州（近似定位）', tags:['5A'], review:'吉首矮寨大桥横跨德夯大峡谷，创多项桥梁世界纪录。<br>"很不错的大桥,很壮观,大桥的建筑也是令人赞叹,大桥上的风景很美"——携程<br>"矮寨大桥很壮观,值得打卡,但其实远观更震撼;悬崖栈道风光无限"——去哪儿' },
  { prov:'湖南省', name:'猛洞河漂流', county:'湘西土家族苗族自治州', type:'scenic', level:'4A', lat:28.99, lng:109.85, price:'【待核实】', rating:'4.6/去哪儿', addr:'湘西土家族苗族自治州（近似定位）', tags:['4A'], review:'永顺境内峡谷漂流，全程约17公里，被誉为天下第一漂。' },
  { prov:'湖南省', name:'炎帝陵', county:'株洲市', type:'scenic', level:'5A', lat:26.49, lng:113.77, price:'【待核实】', rating:'4.6/大众点评', addr:'株洲市（近似定位）', tags:['5A'], review:'炎陵县鹿原陂，炎帝神农氏陵寝地，海内外炎黄子孙谒祖圣地。' },
  { prov:'湖南省', name:'苏仙岭', county:'郴州市', type:'scenic', level:'4A', lat:25.8, lng:113.03, price:'【待核实】', rating:'5/携程', addr:'郴州市（近似定位）', tags:['4A'], review:'郴州城内名山，苏耽跨鹤成仙传说地，有三绝碑摩崖石刻。' },
  { prov:'湖南省', name:'柳叶湖', county:'常德市', type:'scenic', level:'4A', lat:29.06, lng:111.72, price:'【待核实】', rating:'4.6/携程', addr:'常德市（近似定位）', tags:['4A'], review:'常德城东城市湖泊，水域面积约21平方公里，环湖马拉松赛道。' },
  { prov:'湖南省', name:'岳麓山', county:'长沙市', type:'scenic', level:'5A', lat:28.19, lng:112.93, price:'【待核实】', rating:'4.8/携程', addr:'长沙市（近似定位）', tags:['5A'], review:'湘江西岸名山，爱晚亭、岳麓书院坐落其间，南岳七十二峰之尾。<br>"岳麓山不愧半部湖南史,登顶俯瞰湘江与长沙城,心旷神怡。千年学府岳麓书院文脉悠长,爱晚亭的枫叶诗意盎然"——携程<br>"有名的岳麓书院就在山上,长沙的文化底蕴之地,参观需要另外买票。景区有电瓶车,有缆车,还是挺轻松的"——大众点评' },
  { prov:'湖南省', name:'万佛山', county:'怀化市', type:'scenic', level:'4A', lat:26.17, lng:109.78, price:'【待核实】', rating:'4.5/携程', addr:'怀化市（近似定位）', tags:['4A'], review:'通道县丹霞峰林，万座丹峰列阵，有玻璃栈道悬于绝壁。<br>"小张家界,有一种精致的美,很不错。"——同程<br>"现在做的玻璃索道,有点像张家界的感觉,很美的风景,值得一去的地方"——同程' },
  { prov:'湖南省', name:'洪江古商城', county:'怀化市', type:'scenic', level:'4A', lat:27.11, lng:109.84, price:'【待核实】', rating:'4.5/携程', addr:'怀化市（近似定位）', tags:['4A'], review:'明清商城遗存，保存380余栋古建筑，湘西南商埠博物馆。<br>"值得游玩的古城,洪江历史上是商家荟聚的地方,所以城有很多保存完整的古建筑,里面比较大,有点容易迷路"——携程<br>"人很少,有点东西看"——携程' },
  { prov:'江西省', name:'龟峰', county:'上饶市', type:'scenic', level:'5A', lat:28.37, lng:117.45, price:'【待核实】', rating:'5.0/携程', addr:'上饶市（近似定位）', tags:['5A'], review:'弋阳丹霞地貌，龟形巨石群造型奇绝，世界自然遗产组成部分。' },
  { prov:'江西省', name:'明月山', county:'宜春市', type:'scenic', level:'5A', lat:27.85, lng:114.3, price:'【待核实】', rating:'4.3/携程', addr:'宜春市（近似定位）', tags:['5A'], review:'宜春城南名山，云谷飞瀑落差百余米，山下温汤富硒温泉。' },
  { prov:'江西省', name:'武功山', county:'萍乡市', type:'scenic', level:'5A', lat:27.48, lng:114.18, price:'【待核实】', rating:'5/携程', addr:'萍乡市（近似定位）', tags:['5A'], review:'高山草甸绵延十万亩，金顶海拔1918米，徒步露营胜地。' },
  { prov:'江西省', name:'仙女湖', county:'新余市', type:'scenic', level:'4A', lat:27.75, lng:114.78, price:'【待核实】', rating:'5/携程', addr:'新余市（近似定位）', tags:['4A'], review:'毛衣女下凡传说地，50余平方公里湖面岛屿星罗棋布。<br>"新余仙女湖真的超出预期!坐船游湖吹着湖风特别舒服,湖水碧绿,一座座小岛错落有致,山水氛围感拉满。"——携程<br>"乘船游湖,岛屿错落,湖水碧绿,满满的仙气。山水原生态,空气清新,登上龙王岛俯瞰全湖视野绝佳。"——携程' },
  { prov:'江西省', name:'婺源江湾', county:'上饶市', type:'scenic', level:'5A', lat:29.37, lng:118.06, price:'【待核实】', rating:'5/携程', addr:'上饶市（近似定位）', tags:['5A'], review:'婺源东部徽派古镇，萧江宗祠与古街巷保存完好。' },
  { prov:'江西省', name:'大觉山', county:'抚州市', type:'scenic', level:'5A', lat:27.71, lng:117.07, price:'【待核实】', rating:'5/携程', addr:'抚州市（近似定位）', tags:['5A'], review:'资溪原始森林峡谷漂流，大觉岩寺悬于崖壁洞穴之中。' },
  { prov:'江西省', name:'灵山', county:'上饶市', type:'scenic', level:'4A', lat:28.42, lng:117.85, price:'【待核实】', rating:'4/携程', addr:'上饶市（近似定位）', tags:['4A'], review:'上饶北部花岗岩山体，72峰石锥造型奇特，被称为睡美人。' },
  { prov:'江西省', name:'望仙谷', county:'上饶市', type:'scenic', level:'4A', lat:28.53, lng:117.87, price:'【待核实】', rating:'5/携程', addr:'上饶市（近似定位）', tags:['4A'], review:'上饶广信区峡谷悬崖上的仿古建筑群，夜观灯火如天街。<br>"里面街区很美,吃的也不贵。夜景更是绝绝子,仙剑既视感!仙气飘飘,虽然人多,还是值得来的!"——携程<br>"望仙谷主要是夜晚的灯光比较壮观,悬崖峭壁各种仿古建筑如此之多而且布局精妙很有创意"——携程' },
  { prov:'江西省', name:'浮梁古县衙', county:'景德镇市', type:'scenic', level:'4A', lat:29.35, lng:117.22, price:'【待核实】', rating:'4.4/携程', addr:'景德镇市（近似定位）', tags:['4A'], review:'江南保存完整的县级衙署，五品县衙规格罕见，千年瓷茶古镇。' },
  { prov:'江西省', name:'瑶里古镇', county:'景德镇市', type:'scenic', level:'4A', lat:29.55, lng:117.58, price:'【待核实】', rating:'5/去哪儿', addr:'景德镇市（近似定位）', tags:['4A'], review:'浮梁高岭土发源地，徽派老街沿瑶河而建，瓷茶文化名镇。<br>"瑶里古镇确实好山好水,白墙黛瓦、溪水绕村,走在青石板路上很有江南古镇的味道,风景值得一来。"——携程<br>"风景还是不错,青山绿水…一个下午在景区走了三圈"——携程' },

  { prov:'江西省', name:'八一起义纪念馆', county:'南昌市', type:'scenic', level:'4A', lat:28.68, lng:115.89, price:'免费', rating:'4/携程', addr:'南昌市（近似定位）', tags:['4A'], review:'南昌起义总指挥部旧址，军旗升起的地方，馆藏起义史料。<br>"军旗升起的地方,值得打卡,免费参观,60岁以上老人跟持有军人优待证可以不用预约,走绿色通道。"——携程<br>"不用门票,性价比相当高,来这里了解中国革命历史,真正感受到革命传统教育,个人觉得很好。"——携程' },
  { prov:'江西省', name:'鄱阳湖国家湿地公园', county:'上饶市', type:'scenic', level:'4A', lat:29, lng:116.68, price:'【待核实】', rating:'5/携程', addr:'上饶市（近似定位）', tags:['4A'], review:'鄱阳县境候鸟栖息地，冬季白鹤天鹅云集，亚洲最大湿地之一。<br>"第一大淡水湖,丰水季湖景非常美,枯水季据说是个草原。下船就是一个很大的候鸟园,亲子最佳"——携程<br>"这里生态环境超好,原生态的湿地风光保留得很完整,草地、湖泊、滩涂相映成趣,随手一拍都是原生态大片。"——携程' },
  { prov:'福建省', name:'南靖土楼（田螺坑）', county:'漳州市', type:'scenic', level:'4A', lat:24.621, lng:117.092, price:'【待核实】', rating:'5/携程', addr:'漳州市（近似定位）', tags:['4A'], review:'四菜一汤土楼群，世界遗产核心区。' },
  { prov:'福建省', name:'云水谣古镇', county:'漳州市', type:'scenic', level:'4A', lat:24.65, lng:117.02, price:'【待核实】', rating:'5/携程', addr:'漳州市（近似定位）', tags:['4A'], review:'南靖千年古榕水乡，和贵楼、怀远楼两座世遗土楼坐落于此。<br>"景区里大大小小土楼十几个,造型各异。让人惊叹于老祖先的聪明才智和卓越的创造能力!"——携程<br>"泥土房子,沼泽地上建房子,小桥流水,六百多年的大榕树下喝茶聊天,喝咖啡,慢悠悠且舒服~"——携程' },

  { prov:'福建省', name:'湄洲岛', county:'莆田市', type:'scenic', level:'4A', lat:25.05, lng:119.11, price:'【待核实】', rating:'5/携程', addr:'莆田市（近似定位）', tags:['4A'], review:'妈祖文化发祥地，湄洲祖庙为全球妈祖庙宇祖庭。<br>"岛上的氛围真的超好,没有拥挤的人潮,只有海风、古寺和治愈的海岸线。"——携程<br>"很喜欢湄洲岛 我们去的时候人不多 民宿老板和岛民都很热情 菜市场那边吃饭很便宜比天后广场那边性价比高太多了"——携程' },
  { prov:'福建省', name:'泰宁大金湖', county:'三明市', type:'scenic', level:'5A', lat:26.9, lng:117.18, price:'【待核实】', rating:'5/携程', addr:'三明市（近似定位）', tags:['5A'], review:'水上丹霞地貌，甘露岩寺悬于岩穴，世界自然遗产组成部分。' },

  { prov:'福建省', name:'玉华洞', county:'三明市', type:'scenic', level:'4A', lat:26.73, lng:117.47, price:'【待核实】', rating:'5/携程', addr:'三明市（近似定位）', tags:['4A'], review:'将乐大型溶洞，形成于2.7亿年前，洞内钟乳石景观丰富。' },
  { prov:'福建省', name:'崇武古城', county:'泉州市', type:'scenic', level:'4A', lat:24.88, lng:118.97, price:'【待核实】', rating:'4.6/携程', addr:'泉州市（近似定位）', tags:['4A'], review:'惠安明代抗倭石城，我国现存最完整的花岗岩滨海石城。<br>"登上城墙,一半是大海一半是古城,适合带娃悠闲体验古城的淳朴民风,还可以买好吃的鱼卷带回来"——携程<br>"小众景点,游客不多,超乎预期。是中国现存最完整的丁字型石砌古城。三面临海,是明代海防战略要地。"——携程' },
  { prov:'福建省', name:'东山风动石景区', county:'漳州市', type:'scenic', level:'4A', lat:23.74, lng:117.55, price:'【待核实】', rating:'4.6/携程', addr:'漳州市（近似定位）', tags:['4A'], review:'东山岛铜陵镇，风动石重约200吨临崖而立，海蚀奇观。<br>"作为“天下第一奇石”,风动石危立悬崖、惊险壮观,让人不得不惊叹大自然的鬼斧神工。"——携程<br>"说实话,没啥特别的,40多块钱就看一块石头,还有一座关帝庙,其它也就没啥了。"——去哪儿' },
  { prov:'福建省', name:'冠豸山', county:'龙岩市', type:'scenic', level:'4A', lat:25.71, lng:116.75, price:'【待核实】', rating:'5/携程', addr:'龙岩市（近似定位）', tags:['4A'], review:'连城丹霞名山，主峰形似獬豸冠，与石门湖山水相连。<br>"冠豸山景区离连城县城很近,打车公交都方便,景区面积大,设施完善,有步行栈道,爬山路段也不算很陡。"——携程<br>"陡峭的栈道和奇峰怪石不断带来惊喜,尤其站在高处俯瞰丹霞地貌,红岩绿树相映成趣,随手一拍都是大片。"——携程' },

  { prov:'福建省', name:'九鲤湖', county:'莆田市', type:'scenic', level:'4A', lat:25.72, lng:118.7, price:'【待核实】', rating:'5/携程', addr:'莆田市（近似定位）', tags:['4A'], review:'仙游九漈瀑布群闻名，祈梦文化发源地，何氏九仙传说地。<br>"九鲤湖不愧福建三绝!九漈飞瀑气势磅礴,水雾清凉。湖水澄澈,山林葱郁,步道好走,天然氧吧超治愈,避暑绝佳。"——携程<br>"风景真的很好,瀑布下舍不得离开,山路设计得也很好,不走弯路,基本上都是在树荫下,不会被暴晒。"——携程' },
  { prov:'广东省', name:'白云山', county:'广州市', type:'scenic', level:'5A', lat:23.18, lng:113.29, price:'【待核实】', rating:'5/携程', addr:'广州市（近似定位）', tags:['5A'], review:'广州城北五岭余脉，羊城第一秀，摩星岭可俯瞰全城。<br>"5A景区名不虚传,玉皇顶登顶视野开阔,云海翻涌宛如仙境,日出必看;九龙瀑布落差大、水雾缭绕,拍照很出片"——携程' },
  { prov:'广东省', name:'西樵山', county:'佛山市', type:'scenic', level:'5A', lat:22.94, lng:112.98, price:'【待核实】', rating:'5/去哪儿', addr:'佛山市（近似定位）', tags:['5A'], review:'南海古火山遗址，61.9米观音坐像矗立，理学家湛若水讲学地。' },

  { prov:'广东省', name:'万绿湖', county:'河源市', type:'scenic', level:'4A', lat:23.85, lng:114.72, price:'【待核实】', rating:'4.7/携程', addr:'河源市（近似定位）', tags:['4A'], review:'新丰江水库，370平方公里湖面，华南最大人工湖，水质常年优良。' },
  { prov:'广东省', name:'南华寺', county:'韶关市', type:'scenic', level:'4A', lat:24.73, lng:113.62, price:'【待核实】', rating:'4.6/携程', addr:'韶关市（近似定位）', tags:['4A'], review:'曲江曹溪六祖惠能弘法道场，禅宗祖庭，存六祖真身。<br>"南华禅寺是禅宗六祖惠能弘法37年的地方,在佛教界地位极高,素有“禅宗祖庭”、“岭南第一禅寺”之称。"——携程<br>"如今还供奉着六祖的真身舍利,寺庙里建筑恢弘,树木郁郁葱葱,尤其是几颗古树尤为珍贵。"——携程' },
  { prov:'广东省', name:'湖光岩', county:'湛江市', type:'scenic', level:'4A', lat:21.15, lng:110.28, price:'【待核实】', rating:'4.4/携程', addr:'湛江市（近似定位）', tags:['4A'], review:'玛珥式火山口湖，湖底沉积记录十余万年古气候变迁。<br>"中国唯一的玛珥湖,湖光岩是世界地质公园的核心景区。湖水清澈如镜,四周被火山熔岩环抱,生态环境极为独特。"——携程<br>"漫步湖边,停停走走,湖水清澈、空气清新,让人神清气爽!"——携程' },
  { prov:'广东省', name:'广济桥', county:'潮州市', type:'scenic', level:'4A', lat:23.66, lng:116.65, price:'【待核实】', rating:'4.3/携程', addr:'潮州市（近似定位）', tags:['4A'], review:'韩江古桥始建于南宋，梁桥浮桥结合，中国四大古桥之一。<br>"20元门票,太值了,中国四大名桥之一,关键是它的美是永恒的,桥上游人如织,人们被古人的智慧深深折服"——携程<br>"来潮州必打卡广济桥,果然名不虚传!作为中国四大古桥之一,世界最早的启闭式桥梁,亲身走上桥,才真切体会到古人了不起的智慧。"——携程' },
  { prov:'广东省', name:'南澳岛生态旅游区', county:'汕头市', type:'scenic', level:'4A', lat:23.44, lng:117.13, price:'【待核实】', rating:'4.5/携程', addr:'汕头市（近似定位）', tags:['4A'], review:'广东唯一海岛县，青澳湾沙质细腻，北回归线标志塔自然之门。<br>"真的太爱南澳岛这份原生态的海岛美了!一日环岛游逛遍核心美景,全程惊喜拉满,不愧是广东小众宝藏海岛"——携程<br>"南澳岛是位于汕头市的一座非常美的海岛,选择自驾游是最方便的,来回都要经过南澳大桥全场九千多米,与海天连为一线,甚是美丽。"——大众点评' },
  { prov:'广西壮族自治区', name:'象山景区', county:'桂林市', type:'scenic', level:'5A', lat:25.27, lng:110.29, price:'【待核实】', rating:'4.6/携程', addr:'桂林市（近似定位）', tags:['5A'], review:'象鼻山酷似饮水巨象，桂林城徽，与两江四湖连片游览。' },
  { prov:'广西壮族自治区', name:'独秀峰·王城景区', county:'桂林市', type:'scenic', level:'5A', lat:25.28, lng:110.3, price:'【待核实】', rating:'4.7/携程', addr:'桂林市（近似定位）', tags:['5A'], review:'明靖江王府遗址，独秀峰下桂林山水甲天下摩崖石刻原碑。' },
  { prov:'广西壮族自治区', name:'遇龙河景区', county:'桂林市', type:'scenic', level:'4A', lat:24.75, lng:110.47, price:'【待核实】', rating:'4.6/携程', addr:'桂林市（近似定位）', tags:['4A'], review:'阳朔漓江支流，竹筏漂流两岸田园风光，人称小漓江。<br>"竹笩漂流是全人手, 沒有漓江電竹笩的嘈雜聲, 大約漂兩個小時, 好悠閒, 沿途景色優美"——Tripadvisor<br>"坐竹筏除可欣賞沿河的山脈美景外,還有河壩落差的輕微刺激感覺。"——Tripadvisor' },
  { prov:'广西壮族自治区', name:'银子岩', county:'桂林市', type:'scenic', level:'4A', lat:24.66, lng:110.37, price:'【待核实】', rating:'4.6/携程', addr:'桂林市（近似定位）', tags:['4A'], review:'荔浦喀斯特溶洞，钟乳石晶莹如银，贯穿十二座山峰。<br>"都说“游了银子岩,一世不缺钱”,这次阳朔行程特意过来打卡银子岩,整体体验有惊喜也有需要适应的地方。"——携程<br>"银子岩简直绝了!洞内钟乳石千奇百怪,有的如擎天石柱,有的似银花闪烁,在灯光映照下璀璨夺目,宛若梦幻的地下宫殿。"——携程' },
  { prov:'广西壮族自治区', name:'猫儿山', county:'桂林市', type:'scenic', level:'4A', lat:25.88, lng:110.41, price:'【待核实】', rating:'4.6/携程', addr:'桂林市（近似定位）', tags:['4A'], review:'兴安华南第一高峰海拔2141米，漓江、资江发源地。' },
  { prov:'广西壮族自治区', name:'涠洲岛南湾鳄鱼山景区', county:'北海市', type:'scenic', level:'5A', lat:21.02, lng:109.11, price:'【待核实】', rating:'4.5/携程', addr:'北海市（近似定位）', tags:['5A'], review:'火山岛地质公园，海蚀火山地貌，中国最年轻火山岛核心区。' },
  { prov:'广西壮族自治区', name:'百色起义纪念园', county:'百色市', type:'scenic', level:'5A', lat:23.9, lng:106.62, price:'【待核实】', rating:'4.5/携程', addr:'百色市（近似定位）', tags:['5A'], review:'百色起义纪念碑、纪念馆与红七军军部旧址组成红色园区。' },
  { prov:'广西壮族自治区', name:'通灵大峡谷', county:'百色市', type:'scenic', level:'4A', lat:23.15, lng:106.32, price:'【待核实】', rating:'4.3/携程', addr:'百色市（近似定位）', tags:['4A'], review:'靖西峡谷内单级瀑布落差188米，古崖葬遗址与珍稀植物并存。<br>"通灵大峡谷真的太震撼了!瀑布超级壮观,落差188.6米。水雾扑面而来特别凉快。里面植物很多,像个天然大氧吧。"——携程<br>"早就听说过通灵大峡谷,景色确实不错植被茂密,空气清新,赶上多水期,大瀑布很震撼,出口的溶洞也有特色。"——携程' },
  { prov:'广西壮族自治区', name:'鹅泉风景区', county:'百色市', type:'scenic', level:'4A', lat:22.99, lng:106.3, price:'【待核实】', rating:'4.4/携程', addr:'百色市（近似定位）', tags:['4A'], review:'靖西南疆名泉，泉水面积逾3万平方米，德天瀑布水源之一。<br>"鹅泉是靖西最值得去的景点,小而精,风景优美,拍照非常出片,小孩子喂鱼喂鹅玩得不亦乐乎,节假日还有民俗表演"——携程<br>"这里的竹筏价格非常实惠,一个人只要10块钱,大概20分钟左右的航程,很舒服惬意。"——携程' },
  { prov:'广西壮族自治区', name:'程阳八寨', county:'柳州市', type:'scenic', level:'4A', lat:25.76, lng:109.67, price:'【待核实】', rating:'4.3/携程', addr:'柳州市（近似定位）', tags:['4A'], review:'三江侗族村寨群，程阳永济桥为世界四大历史名桥之一。<br>"程阳八寨藏着最原汁原味的侗乡风情,风雨桥、鼓楼、吊脚楼错落有致,民风淳朴,烟火气十足,慢逛十分惬意。"——携程<br>"走过四大历史名桥之一的程阳永济桥,漫步自然古村落,还体验了侗族待客的最高礼仪百家宴,感受到了侗家人的热情好客"——携程' },
  { prov:'广西壮族自治区', name:'黄姚古镇', county:'贺州市', type:'scenic', level:'5A', lat:24.24, lng:111.2, price:'【待核实】', rating:'4.6/携程', addr:'贺州市（近似定位）', tags:['5A'], review:'昭平千年古镇，青砖黛瓦枕水而居，发祥于宋朝的姚江畔。' },

  { prov:'海南省', name:'分界洲岛', county:'陵水黎族自治县', type:'scenic', level:'5A', lat:18.58, lng:110.1, price:'【待核实】', rating:'4.6/携程', addr:'陵水黎族自治县（近似定位）', tags:['5A'], review:'牛岭分界线上的海岛，南北气候分界标志，可潜海观珊瑚。' },
  { prov:'海南省', name:'南湾猴岛', county:'陵水黎族自治县', type:'scenic', level:'4A', lat:18.43, lng:110.02, price:'【待核实】', rating:'4.6/携程', addr:'陵水黎族自治县（近似定位）', tags:['4A'], review:'猕猴自然保护区，2500余只野生猕猴，跨海索道连接新村港。<br>"南湾猴岛太好玩啦!跨海索道视野绝美,能俯瞰渔排海景。岛上猕猴活泼可爱,随处可见,互动有趣,表演精彩,亲子出游超推荐!"——携程<br>"成人票210,其中缆车就值200……公园十分钟就走完了,如果不是猴子爱好者,没必要去,但是缆车不可错过。"——携程' },
  { prov:'海南省', name:'槟榔谷黎苗文化旅游区', county:'保亭黎族苗族自治县', type:'scenic', level:'5A', lat:18.62, lng:109.64, price:'【待核实】', rating:'4.7/携程', addr:'保亭黎族苗族自治县（近似定位）', tags:['5A'], review:'黎族苗族文化活态博物馆，展示黎锦、船型屋与纹面文化。' },
  { prov:'海南省', name:'雷琼海口火山群世界地质公园', county:'海口市', type:'scenic', level:'4A', lat:19.93, lng:110.2, price:'【待核实】', rating:'4.6/携程', addr:'海口市（近似定位）', tags:['4A'], review:'石山马鞍岭火山口，万年火山遗迹与火山民居石头村。<br>"登顶可俯瞰海口全景,火山口植被茂密,熔岩隧道凉爽神秘。科普性强,适合亲子研学,徒步难度适中。"——携程<br>"离市区近,管理非常好,攀爬不多,风景不错,值得再来"——去哪儿' },

  { prov:'海南省', name:'兴隆热带植物园', county:'万宁市', type:'scenic', level:'4A', lat:18.74, lng:110.19, price:'【待核实】', rating:'4.4/携程', addr:'万宁市（近似定位）', tags:['4A'], review:'热带香料饮料作物科普园，咖啡、胡椒、可可种植展示。<br>"兴隆热带植物园超级值得打卡,绿植繁茂品种丰富,可可咖啡,见血封喉等奇花异草让人大开眼界,讲解员孙导耐心又专业"——携程<br>"植物园很多好看的植物,每一处都是精细,有小花老师细致的讲解,带孩子认识了可可的开花,授粉和结果,满满的体验感"——去哪儿' },
  { prov:'海南省', name:'东山岭', county:'万宁市', type:'scenic', level:'4A', lat:18.79, lng:110.48, price:'【待核实】', rating:'4.3/携程', addr:'万宁市（近似定位）', tags:['4A'], review:'万宁第一山，花岗岩奇石林立，潮音寺历史悠远，东山羊产地。' },

  { prov:'海南省', name:'五指山热带雨林风景区', county:'五指山市', type:'scenic', level:'4A', lat:18.78, lng:109.52, price:'【待核实】', rating:'4.7/携程', addr:'五指山市（近似定位）', tags:['4A'], review:'海南岛最高峰五指山腹地，热带雨林昌化江源，黎峒文化园。' },

  { prov:'四川省', name:'武侯祠博物馆', county:'成都市', type:'scenic', level:'4A', lat:30.644, lng:104.047, price:'【待核实】', rating:'4.2/携程', addr:'成都市（近似定位）', tags:['4A'], review:'纪念诸葛亮的祠庙，三国遗迹与园林结合。<br>"来南阳游玩顺路打卡武侯祠,园区环境清幽安静,园内古树木葱郁,古建筑古朴大气,氛围感十足"——携程' },
  { prov:'四川省', name:'杜甫草堂', county:'成都市', type:'scenic', level:'4A', lat:30.6598, lng:104.0255, price:'【待核实】', rating:'4.6/携程', addr:'成都市（近似定位）', tags:['4A'], review:'杜甫流寓成都故居，中国文学史圣地。<br>"浣花溪畔的清幽园林,红墙翠竹氛围感十足。茅屋与碑刻留存诗圣笔墨,满是家国情怀,闹市里难得的诗意净土"——携程<br>"杜甫草堂清幽雅致,竹林与池水相映,远离闹市喧嚣。园内保留着茅屋故居,碑刻、古木错落其间,处处透着文人气息。"——携程' },
  { prov:'四川省', name:'黄龙溪古镇', county:'成都市', type:'scenic', level:'4A', lat:30.31, lng:104.08, price:'免费', rating:'4.5/携程', addr:'成都市（近似定位）', tags:['4A'], review:'府河畔千年水乡古镇，保存清代街市格局。' },
  { prov:'四川省', name:'三星堆博物馆', county:'德阳市', type:'scenic', level:'4A', lat:30.9905, lng:104.4015, price:'【待核实】', rating:'4.6/携程', addr:'德阳市（近似定位）', tags:['4A'], review:'展示古蜀青铜文明的专题博物馆，青铜面具闻名。<br>"三星堆此行收获满满,文物极具冲击力,纵目面具、大立人令人叹为观止。讲解专业细致,把晦涩的古蜀历史讲得通俗易懂"——携程<br>"参观了三星堆我都相信了有外星人,或者三千多年前的古蜀人拥有我们所不知的高度文明,太震撼了"——携程' },
  { prov:'四川省', name:'蜀南竹海', county:'宜宾市', type:'scenic', level:'4A', lat:28.41, lng:105.08, price:'【待核实】', rating:'4.7/携程', addr:'宜宾市（近似定位）', tags:['4A'], review:'连片楠竹林海，集山水溶洞竹景于一体。<br>"一踏入蜀南竹海,就像穿越到了绿色梦境~满眼的翠绿,简直是夏天的解暑神器!缆车穿梭,独享宁静,每一口呼吸都是满满的清新感。"——携程<br>"蜀南竹海,川南一绝,7万余亩楠竹覆山峦,翠浪连天、清幽绝尘。翡翠长廊光影斑驳,海中海竹筏轻摇,风过竹涛如龙吟。"——携程' },
  { prov:'四川省', name:'兴文石海', county:'宜宾市', type:'scenic', level:'4A', lat:28.22, lng:105.23, price:'【待核实】', rating:'4.6/携程', addr:'宜宾市（近似定位）', tags:['4A'], review:'喀斯特地质公园，有大漏斗和石林景观。' },
  { prov:'四川省', name:'自贡恐龙博物馆', county:'自贡市', type:'scenic', level:'4A', lat:29.395, lng:104.8, price:'【待核实】', rating:'4.5/携程', addr:'自贡市（近似定位）', tags:['4A'], review:'建在大山铺恐龙化石群遗址上的专业博物馆。<br>"自贡恐龙博物馆非常值得打卡,是国内少有的遗址类恐龙博物馆。走进馆内,可以直接看见原地埋藏的恐龙化石群,视觉冲击力很强。"——携程<br>"馆内保留真实化石发掘现场,巨型马门溪龙骨架直击眼球,氛围感拉满。展陈清晰易懂,互动设备有趣,票价亲民。"——携程' },

  { prov:'贵州省', name:'马岭河峡谷', county:'黔西南布依族苗族自治州', type:'scenic', level:'4A', lat:25.08, lng:104.89, price:'【待核实】', rating:'4.7/携程', addr:'黔西南布依族苗族自治州（近似定位）', tags:['4A'], review:'兴义市郊地缝峡谷，两岸瀑布群密集。<br>"马岭河大峡谷,不愧是地球上最美丽的伤疤!群瀑飞流,水雾弥漫,万马奔腾瀑布气势磅礴"——携程<br>"专程来兴义打卡马岭河大峡谷,看完真心觉得不虚此行,堪称大地撕裂开的绝美伤疤。"——携程' },
  { prov:'贵州省', name:'万峰林', county:'黔西南布依族苗族自治州', type:'scenic', level:'4A', lat:25.07, lng:104.92, price:'【待核实】', rating:'4.4/携程', addr:'黔西南布依族苗族自治州（近似定位）', tags:['4A'], review:'兴义近郊锥状喀斯特峰林，田园村寨点缀其间。<br>"贵州兴义万峰林真的值得专程过来,亲眼见到才懂“唯有此处峰成林”的磅礴气势"——同程<br>"天下山峰何其多 唯有此处峰成林!来到万峰林可以看到很多锥形的山峰和田园、河流、村寨交织在一起"——携程' },
  { prov:'贵州省', name:'肇兴侗寨', county:'黔东南苗族侗族自治州', type:'scenic', level:'4A', lat:26.06, lng:109.23, price:'【待核实】', rating:'4.4/携程', addr:'黔东南苗族侗族自治州（近似定位）', tags:['4A'], review:'全国最大侗族村寨之一，鼓楼群与风雨桥著称。<br>"肇兴侗寨能够近距离接触侗族人民生活,感受不同民族文化,许多老奶奶都一边做针线活一边贩卖小挂件"——携程<br>"鼓楼古寨依山傍水,侗族大歌空灵治愈,烟火气十足"——携程' },

  { prov:'云南省', name:'云南民族村', county:'昆明市', type:'scenic', level:'4A', lat:24.965, lng:102.665, price:'【待核实】', rating:'4.7/同程', addr:'昆明市（近似定位）', tags:['4A'], review:'滇池之滨的民族文化村寨群，展示二十五族风情。<br>"民族村挺适合去了解少数民族的。真像一个少数民族博物馆,里面有真正的少数民族同胞居住在自己的民族房子里。"——去哪儿<br>"一定要请导游,自己玩的话,可能的确没什么意思,只能走马观花的看看。"——大众点评' },
  { prov:'云南省', name:'九乡风景区', county:'昆明市', type:'scenic', level:'4A', lat:25.1, lng:103.35, price:'【待核实】', rating:'5/携程', addr:'昆明市（近似定位）', tags:['4A'], review:'宜良县溶洞群，雄狮大厅为国内罕见地下厅堂。<br>"“不来九乡,枉游云南”,这是九乡风景区的标语,到了九乡这里便是洞中有洞,洞中有水,洞中有天。"——大众点评<br>"九乡溶洞确实鬼斧神雕。各种钟乳石。形态各异,栩栩如生。更令人感到神奇的是居然有地下瀑布穿流其中。"——携程' },
  { prov:'云南省', name:'大理古城', county:'大理白族自治州', type:'scenic', level:'4A', lat:25.69, lng:100.16, price:'免费', rating:'4.3/携程', addr:'大理白族自治州（近似定位）', tags:['4A'], review:'南诏大理古都，苍山洱海之间的历史文化名城。<br>"大理古城值得来逛一逛,南门进来青石板路古色古香,背靠苍山,远处就能望见连绵山峦,很有南诏古国的氛围感"——携程<br>"大理古城建于明洪武十五年,曾是东南亚最繁华古都之一,有600年历史沉淀,家家流水户户养花"——携程' },

  { prov:'云南省', name:'元阳哈尼梯田', county:'红河哈尼族彝族自治州', type:'scenic', level:'4A', lat:23.12, lng:102.77, price:'【待核实】', rating:'4.6/携程', addr:'红河哈尼族彝族自治州（近似定位）', tags:['4A'], review:'哀牢山区千级哈尼梯田，世界文化遗产核心区。<br>"非常震撼的景点,夕阳朝阳都看了!无数梯田层层叠叠,在阳光下更显耀眼!"——携程<br>"滇东南上最重要的一站,世界遗产元阳梯田。冬季灌水的梯田,色彩光影十分漂亮,看到了蓝色梯田、彩色梯田"——携程' },
  { prov:'云南省', name:'建水古城', county:'红河哈尼族彝族自治州', type:'scenic', level:'4A', lat:23.62, lng:102.83, price:'古城免费，部分景点收费', rating:'4/携程', addr:'红河哈尼族彝族自治州（近似定位）', tags:['4A'], review:'滇南历史文化名城，文庙与朱家花园著称。<br>"建水古城还挺难得的,没那么商业化,街上好多店还是那种“百元几件”的服装店,旅拍也是刚起步,感觉挺真实。"——携程<br>"建水古城很值得一去,它保留了许多古建筑,朱家花园,文庙等都有深厚的历史和文化底蕴"——携程' },

  { prov:'西藏自治区', name:'哲蚌寺', county:'拉萨市', type:'scenic', level:'4A', lat:29.67, lng:91.04, price:'【待核实】', rating:'4.7/携程', addr:'拉萨市（近似定位）', tags:['4A'], review:'格鲁派六大寺之一，曾是藏区最大寺院。<br>"这是曾经的藏区的政治佛教中心,一世~五世达赖喇嘛嘛,在此驻锡,在藏族同胞心目中,他是无可替代的信仰中心"——携程<br>"白色建筑群依山铺满山坡,远望如巨大米堆,拍照很出片,不过海拔高,游览得悠着点慢慢走。"——携程' },

  { prov:'西藏自治区', name:'羊卓雍措', county:'山南市', type:'scenic', level:'4A', lat:29.08, lng:90.6, price:'【待核实】', rating:'4.6/携程', addr:'山南市（近似定位）', tags:['4A'], review:'喜马拉雅北麓大型内陆微咸水湖。<br>"羊卓雍措不愧是西藏三大圣湖之一,初见便被其深深震撼。湖水是层次丰富的碧蓝,宛如镶嵌山间的蓝宝石"——携程<br>"漂亮是真漂亮,分了五个可以观景的平台,但是为什么要收费呢?"——携程' },

  { prov:'西藏自治区', name:'鲁朗景区', county:'林芝市', type:'scenic', level:'4A', lat:29.76, lng:94.74, price:'【待核实】', rating:'4.6/携程', addr:'林芝市（近似定位）', tags:['4A'], review:'林海草甸与藏式村落构成的高原田园风光区。<br>"鲁朗林海,一处让人心旷神怡的地方。这里绿树成荫,空气清新,四季景色各异"——携程<br>"鲁朗林海宛如高原上的绿野仙踪!踏入这片原始森林,满目葱郁,松树参天,雪山巍峨,云雾缭绕如仙境。"——携程' },
  { prov:'甘肃省', name:'甘肃省博物馆', county:'兰州市', type:'scenic', level:'4A', lat:36.074, lng:103.759, price:'免费', rating:'4.7/携程', addr:'兰州市（近似定位）', tags:['4A'], review:'藏有铜奔马与丝绸之路文物的省级综合博物馆。<br>"最有名的展品当属马踏飞燕和玻璃莲花托盏,看到了真身也是很幸运,由衷感叹古人的智慧和精巧的手艺。"——携程<br>"馆藏十分丰富,从远古彩陶到汉代简牍,从丝绸之路珍品到佛教艺术文物,件件都藏着陇原大地的厚重历史"——携程' },

  { prov:'甘肃省', name:'黄河石林', county:'白银市', type:'scenic', level:'4A', lat:36.93, lng:104.11, price:'【待核实】', rating:'4.5/携程', addr:'白银市（近似定位）', tags:['4A'], review:'景泰县黄河岸边砂砾岩石林，龙湾村环抱其间。<br>"慕名打卡昆明石林,不愧是世界自然遗产,大自然的鬼斧神工太震撼了。整片石林怪石林立,奇峰错落"——携程<br>"云南石林堪称自然奇观,亿万年的时光雕琢出这片石海翻腾的壮阔景象。行走化石迷宫,感慨万千"——携程' },
  { prov:'甘肃省', name:'炳灵寺石窟', county:'临夏回族自治州', type:'scenic', level:'4A', lat:35.94, lng:103.24, price:'【待核实】', rating:'4.6/携程', addr:'临夏回族自治州（近似定位）', tags:['4A'], review:'黄河刘家峡库区崖壁石窟，始凿于十六国时期。<br>"真的是夯到爆炸的地方,顶级的历史艺术价值和自然景观相结合,不亏是世界遗产。"——携程<br>"真的相当不错,坐船去炳灵寺,比陆路多了很多景色,也很特别,感叹于古人的精湛技艺"——携程' },

  { prov:'甘肃省', name:'扎尕那', county:'甘南藏族自治州', type:'scenic', level:'4A', lat:34.05, lng:103.1, price:'【待核实】', rating:'4.6/携程', addr:'甘南藏族自治州（近似定位）', tags:['4A'], review:'迭部县石城山寨，藏族村落隐于嶙峋峰林之间。<br>"扎尕那是甘南藏地的隐秘仙境,藏语意为“石匣子”。四面石峰壁立如城,云雾缠绕山腰,溪流穿行谷底。"——携程<br>"风景太一般了,真没搞懂,怎么会是甘南最火爆的景点,估计全靠营销出来的。"——携程' },

  { prov:'青海省', name:'门源百里油菜花海', county:'海北藏族自治州', type:'scenic', level:'4A', lat:37.38, lng:101.62, price:'【待核实】', rating:'4.6/携程', addr:'海北藏族自治州（近似定位）', tags:['4A'], review:'祁连山南麓连片油菜花田，七月金黄如海。<br>"从未见过这么大面积的油菜花田,一眼望去仿佛花海边际与天相接,给人一种非常震撼的感觉"——大众点评<br>"雪山映衬下的油菜花真是绝无仅有的景色!"——大众点评' },

  { prov:'青海省', name:'贵德国家地质公园', county:'海南藏族自治州', type:'scenic', level:'4A', lat:36.04, lng:101.42, price:'【待核实】', rating:'4.7/携程', addr:'海南藏族自治州（近似定位）', tags:['4A'], review:'阿什贡七彩丹霞峰丛，黄河清流穿境而过。' },

  { prov:'宁夏回族自治区', name:'贺兰山岩画', county:'银川市', type:'scenic', level:'4A', lat:38.73, lng:105.99, price:'【待核实】', rating:'4.4/携程', addr:'银川市（近似定位）', tags:['4A'], review:'贺兰口崖壁岩画群，记录北方游牧民族生活。<br>"贺兰山岩画很有历史氛围感,亲眼看到千年石刻很震撼,景区还有岩画馆和艺术馆可以参观。"——携程<br>"远山雄浑壮阔,偶尔还能看见岩羊出没,人文与自然风光兼备。"——携程' },

  { prov:'宁夏回族自治区', name:'须弥山石窟', county:'固原市', type:'scenic', level:'4A', lat:36.14, lng:106.04, price:'【待核实】', rating:'4.6/去哪儿', addr:'固原市（近似定位）', tags:['4A'], review:'北朝至隋唐开凿的石窟群，大佛楼造像著名。' },
  { prov:'宁夏回族自治区', name:'六盘山国家森林公园', county:'固原市', type:'scenic', level:'4A', lat:35.36, lng:106.33, price:'【待核实】', rating:'4.6/携程', addr:'固原市（近似定位）', tags:['4A'], review:'泾源县境内黄土高原天然森林区，凉殿峡老龙潭。<br>"很值得一去的地方,毕竟"早知有盘山,何必下江南"这句乾隆的评语,给了盘山很好的注释,说明这里的景色秀丽,很似江南。"——携程<br>"盘山山林清幽,山石奇峻,自然风光格外秀美。登山路线丰富,缆车省力省心,景区工作人员服务贴心,游玩体验舒适。"——携程' },

  { prov:'河北省', name:'承德避暑山庄', county:'承德市', type:'scenic', level:'5A', lat:40.9817, lng:117.9382, price:'【待核实】', rating:'—', addr:'承德市双桥区', tags:['5A','世界遗产','皇家园林'], review:'清代夏宫，"一座山庄，半部清史"。' },
  { prov:'河北省', name:'山海关景区', county:'秦皇岛市', type:'scenic', level:'5A', lat:40.0098, lng:119.7531, price:'【待核实】', rating:'—', addr:'秦皇岛市山海关区', tags:['5A','天下第一关'], review:'长城入海处老龙头，山海关雄踞咽喉。<br>"套票含3个景点,超值,登上天下第一关的城墙,历史厚重感很强,登上钟鼓楼可以俯瞰古城全景,值得一去。"——携程<br>"天下第一关确实值得看,面积比较大,城楼也相当雄伟,老龙头水上长城也很值得去,里面可观赏的比较多,景区物价也比较实惠。"——携程' },
  { prov:'河北省', name:'白洋淀景区', county:'保定市', type:'scenic', level:'5A', lat:38.9060, lng:115.9840, price:'【待核实】', rating:'—', addr:'保定市安新县', tags:['5A','华北明珠'], review:'华北最大淡水湖，芦苇荡里的小兵张嘎故事地。<br>"白洋淀不愧是华北明珠,坐船穿梭芦苇荡特别有氛围感,夏天万亩荷塘一望无际,景色很美。"——携程<br>"西岸的白洋淀景区码头有点坑。并不便宜的船票空调也很弱,八月份过去在船上又闷又热,几乎感觉不到空调的存在。"——携程' },
  { prov:'河北省', name:'野三坡景区', county:'保定市', type:'scenic', level:'5A', lat:39.6870, lng:115.7000, price:'【待核实】', rating:'—', addr:'保定市涞水县', tags:['5A','峡谷'], review:'拒马河峡谷漂流+百里峡徒步。<br>"第一次去野山坡百里峡,整个景区峡谷风光秀丽,从一个峡谷到另一个峡谷需要乘坐缆车,但是这段缆车距离非常短,感觉一般。"——携程<br>"峡谷风景还可以,没来过的可以来看看,性价比不高。"——携程' },
  { prov:'河北省', name:'塞罕坝国家森林公园', county:'承德市', type:'scenic', level:'4A', lat:42.4147, lng:117.2846, price:'【待核实】', rating:'—', addr:'承德市围场县', tags:['林海','机械化林场'], review:'三代人种出的世界最大人工林海。<br>"让我震撼的塞罕坝,一眼望不到边的森林,在秋风过后呈现出来的是画卷"——携程<br>"塞罕坝风景优美,有树林、草原、湖泊、牛羊马匹。好看极了!"——携程' },
  { prov:'河北省', name:'广府古城', county:'邯郸市', type:'scenic', level:'5A', lat:36.7790, lng:114.6850, price:'【待核实】', rating:'—', addr:'邯郸市永年区', tags:['5A','水城','太极'], review:'洼淀中的水城，杨式太极拳发源地。<br>"保留古城风貌,工作日人少清静。城墙上自行车多是4人的,没有单人自行车,无商业。古城内百姓居住。"——携程<br>"广府古城是一座被低估的宝藏小城,拥有悠久历史和丰富的文化遗产,可以感受到古代城市的韵味,还可以品尝到地道的美食。"——携程' },
  { prov:'河北省', name:'清东陵', county:'唐山市', type:'scenic', level:'5A', lat:40.1873, lng:117.6426, price:'【待核实】', rating:'—', addr:'唐山市遵化市', tags:['5A','世界遗产','清陵'], review:'中国现存规模最大的帝王陵墓群之一。<br>"清东陵气势恢宏,红墙黄瓦嵌于群山松柏间,尽显皇家威严。神道石像生、裕陵地宫与慈禧陵细节精湛,如读半部清史,震撼难忘。"——携程<br>"世界文化遗产,值得一游。开放的四个点,景陵离其它三个较远,新开,没有什么内容,需要开车过去。"——携程' },

  { prov:'内蒙古自治区', name:'响沙湾', county:'鄂尔多斯市', type:'scenic', level:'5A', lat:40.2850, lng:109.7800, price:'【待核实】', rating:'—', addr:'鄂尔多斯市达拉特旗', tags:['5A','沙漠'], review:'会唱歌的沙子，沙漠度假乐园。<br>"响沙湾体验远超预期!一望无际的金色沙漠十分壮观,滑沙感受独特的鸣沙奇观,骑骆驼、沙漠游乐项目丰富。"——携程<br>"亲子游非常推荐,小朋友们会很开心,沙漠景色很美,仙沙岛娱乐项目都还可以,索道和沙海游艇属于上岛交通工具。"——携程' },
  { prov:'内蒙古自治区', name:'成吉思汗陵旅游区', county:'鄂尔多斯市', type:'scenic', level:'5A', lat:39.3570, lng:109.7700, price:'【待核实】', rating:'—', addr:'鄂尔多斯市伊金霍洛旗', tags:['5A','人文'], review:'一代天骄的衣冠冢与祭祀圣地。<br>"成吉思汗陵庄严肃穆,鎏金穹顶极具民族特色,置身辽阔草原,扑面而来历史厚重感。"——携程<br>"天骄圣地,气势磅礴!整座园区庄严肃穆,建筑很有民族特色。请讲解游览体验更好,了解八百年守陵文化,收获满满。"——携程' },
  { prov:'内蒙古自治区', name:'阿尔山国家森林公园', county:'兴安盟', type:'scenic', level:'5A', lat:47.2360, lng:120.3000, price:'【待核实】', rating:'—', addr:'兴安盟阿尔山市', tags:['5A','火山','天池'], review:'火山天池+不冻河+秋日彩林，一年四季都美。<br>"阿尔山国家森林公园的确涵盖了最美的所有景点。无论是驼峰岭天池的湛蓝。还是杜鹃湖的明秀,大峡谷的壮观。"——携程<br>"阿尔山整体都很漂亮,至于花钱购买的森林公园门票看到的景色挺一般。整体景色还不如免费的不冻河和乌苏浪子湖的景色漂亮。"——携程' },

  { prov:'山东省', name:'台儿庄古城', county:'枣庄市', type:'scenic', level:'5A', lat:34.5620, lng:117.7340, price:'【待核实】', rating:'—', addr:'枣庄市台儿庄区', tags:['5A','运河古城'], review:'"天下第一庄"，运河夜色摇橹船。<br>"硬件设施很不错,景色也不输南方古镇。"——携程<br>"台儿庄古城非常值得来一趟,尤其夜景很好看。"——携程"台儿庄古城非常值得来一趟,尤其夜景很好看。"——携程' },

  { prov:'河南省', name:'龙门石窟', county:'洛阳市', type:'scenic', level:'5A', lat:34.5590, lng:112.4720, price:'90元', rating:'—', addr:'洛阳市洛龙区', tags:['5A','世界遗产','石窟'], review:'伊水两岸十万余尊造像，卢舍那大佛微笑千年。<br>"不愧是世界文化遗产,亲眼见到比图片更加震撼!卢舍那大佛气势恢宏,崖壁石窟连绵伊河两岸"——携程<br>"龙门石窟是中国古代石刻艺术的宝库,其精湛的雕刻技艺和丰富的文化内涵令人叹为观止。"——携程"龙门石窟是中国古代石刻艺术的宝库,其精湛的雕刻技艺和丰富的文化内涵令人叹为观止。"——携程' },
  { prov:'河南省', name:'云台山风景名胜区', county:'焦作市', type:'scenic', level:'5A', lat:35.4340, lng:113.4390, price:'【待核实】', rating:'—', addr:'焦作市修武县', tags:['5A','红石峡'], review:'红石峡丹岩碧水，北方岩溶地貌典范。<br>"景色超出预期。红石峡红岩配碧潭如同天然山水画,潭瀑峡三步一泉五步一瀑,云台天瀑气势磅礴"——携程<br>"云台山真的是超出预期,错峰出行,体验感极好,可以玩水,可以看红石崖独特地貌"——携程"云台山真的是超出预期,错峰出行,体验感极好,可以玩水,可以看红石崖独特地貌"——携程' },
  { prov:'河南省', name:'清明上河园', county:'开封市', type:'scenic', level:'5A', lat:34.8110, lng:114.3520, price:'【待核实】', rating:'—', addr:'开封市龙亭区', tags:['5A','宋文化'], review:'把《清明上河图》搬进现实，大宋不夜城。' },
  { prov:'河南省', name:'白马寺', county:'洛阳市', type:'scenic', level:'4A', lat:34.7270, lng:112.5960, price:'35元', rating:'—', addr:'洛阳市洛龙区', tags:['中国第一古刹'], review:'佛教传入中国后的第一座官办寺院。<br>"白马寺古刹清幽,香火绵长。作为中国第一古刹,殿宇古朴庄严,佛韵浓厚"——携程<br>"但白马寺这个景点真的值得来,有着两千年佛教东传的厚重。齐云塔静默矗立"——携程"但白马寺这个景点真的值得来,有着两千年佛教东传的厚重。齐云塔静默矗立"——携程' },

  { prov:'河南省', name:'老君山景区', county:'洛阳市', type:'scenic', level:'4A', lat:33.7760, lng:111.6500, price:'【待核实】', rating:'—', addr:'洛阳市栾川县', tags:['道教','云海金顶'], review:'"远赴人间惊鸿宴"，雪后金顶全网顶流。<br>"傍晚亮灯后,道观依山而立,灯光打在屋檐和山脊上,确实有一种"人间仙境"的感觉"——携程<br>"雪后,山体和建筑被白雪覆盖,配上金顶灯光,氛围感直接拉满"——携程<br>"傍晚亮灯后,道观依山而立,灯光打在屋檐和山脊上,确实有一种"人间仙境"的感觉"——携程<br>"雪后,山体和建筑被白雪覆盖,配上金顶灯光,氛围感直接拉满"——携程' },

  { prov:'湖北省', name:'黄鹤楼公园', county:'武汉市', type:'scenic', level:'5A', lat:30.5450, lng:114.3030, price:'70元', rating:'—', addr:'武汉市武昌区', tags:['5A','江南名楼'], review:'"昔人已乘黄鹤去"，登楼远眺长江大桥。<br>"登临黄鹤楼,凭栏眺望长江浩荡,感受千古诗词底蕴。园内古木葱郁,亭台错落,历史氛围感浓厚"——携程<br>"天下江山第一楼名不虚传!建筑大气恢弘,登顶俯瞰长江与武汉三镇视野绝佳,诗词文化底蕴拉满"——携程' },
  { prov:'湖北省', name:'三峡大坝旅游区', county:'宜昌市', type:'scenic', level:'5A', lat:30.8230, lng:111.0040, price:'免费（换乘车另计）', rating:'—', addr:'宜昌市夷陵区', tags:['5A','国之重器'], review:'坛子岭俯瞰大国重器，船闸过船震撼。<br>"来到宜昌三峡大坝,登上坛子岭观景台,壮阔的大坝尽收眼底。长长的坝体横卧长江,实现了“高峡出平湖”的奇景"——携程<br>"三峡大坝陆路旅游出乎我的意料,人性化设计,既能高处远观全景,又能近处感受大国重器"——携程' },
  { prov:'湖北省', name:'神农架生态旅游区', county:'神农架林区', type:'scenic', level:'5A', lat:31.7450, lng:110.6750, price:'【待核实】', rating:'—', addr:'神农架林区', tags:['5A','原始森林','野人传说'], review:'华中屋脊，金丝猴与原始密林。<br>"神农架,云海翻涌的绿意秘境,溪涧清冽,松涛低吟,山风拂面如沁凉诗行"——携程<br>"夏日避暑好去处,好逛好玩,吃饭方便,景色秀丽,天然氧吧,有山有水,爬爬山玩玩水,很适合遛娃"——携程<br>"整体自然环境很棒,植被茂密空气清新,联票中的景点神农谷景色壮美,最费体力"——携程' },
  { prov:'湖北省', name:'恩施大峡谷', county:'恩施州', type:'scenic', level:'4A', lat:30.2900, lng:109.1200, price:'【待核实】', rating:'—', addr:'恩施州恩施市', tags:['喀斯特','一炷香'], review:'七星寨绝壁栈道，"一炷香"石柱奇观。<br>"超赞的景色,烟雾缭绕,空气清新。第一天老人孩子7口爬了七星寨,第二天去了地缝,两天都是超赞的体验。"——携程<br>"恩施大峡谷的云龙地缝是山谷塌陷形成的特色卡斯特色地貌,景色很美,即有奇特的山峰,又有壮观的瀑布"——携程"恩施大峡谷的云龙地缝是山谷塌陷形成的特色卡斯特色地貌,景色很美,即有奇特的山峰,又有壮观的瀑布"——携程' },
  { prov:'湖北省', name:'武汉东湖风景名胜区', county:'武汉市', type:'scenic', level:'5A', lat:30.5590, lng:114.3900, price:'免费', rating:'—', addr:'武汉市武昌区', tags:['5A','城中湖'], review:'全国最大城中湖之一，绿道骑行百公里。<br>"东湖是武汉人的宝藏公园,环境优美,湖面壮阔,湖边开发了磨山、梨园、听涛、落雁等很多景区"——携程<br>"世界三大赏樱胜地名不虚传!万株樱花漫山盛放,唐风五重塔配湖景绝美,夜樱灯光璀璨"——携程' },

  // ===== 全国 · 湖南省（7） =====
  { prov:'湖南省', name:'武陵源-天门山旅游区', county:'张家界市', type:'scenic', level:'5A', lat:29.3480, lng:110.5400, price:'【待核实】', rating:'—', addr:'张家界市武陵源区', tags:['5A','世界遗产','阿凡达'], review:'三千奇峰拔地而起，《阿凡达》悬浮山原型。<br>"张家界天门山绝对是一生必去的震撼景区!乘坐世界超长索道直达山顶,穿云破雾的体验太棒了"——携程<br>"山顶的鬼谷栈道和玻璃栈道悬空于万丈深渊之上,既刺激又出片。天门洞开的自然奇迹令人叹为观止"——携程<br>"体力和心情都被照顾到了,景区能这样体谅游客,很了不起!"——张家界武陵源旅游官网<br>"第一眼看到云山雾中的群山林立,那种震撼让人忍不住惊呼出声。"——微信公众号游记<br>"不愧是世界级的自然奇观,三千奇峰拔地而起,八百秀水蜿蜒其间,亲眼所见才懂什么叫鬼斧神工!"——携程<br>"袁家界的阿凡达悬浮山实景超震撼,云雾缭绕时仿佛置身仙境"——携程' },
  { prov:'湖南省', name:'天门山国家森林公园', county:'张家界市', type:'scenic', level:'5A', lat:29.0570, lng:110.4790, price:'【待核实】', rating:'—', addr:'张家界市永定区', tags:['5A','玻璃栈道'], review:'999级天梯洞开天门，玻璃栈道脚下深渊。<br>"看到天门洞那一刻所有辛苦上山都值得了。哈哈,这个是孩子认定为可以二刷的景点"——携程' },
  { prov:'湖南省', name:'凤凰古城', county:'湘西州', type:'scenic', level:'4A', lat:27.9480, lng:109.5990, price:'免费（九景联票另计）', rating:'—', addr:'湘西州凤凰县', tags:['沱江','吊脚楼'], review:'沱江吊脚楼夜景，翠翠的故事还在流传。<br>"凤凰古城是一座“甲之蜜糖,乙之砒霜”的古城,体验感完全取决于你的打开方式。"——携程<br>"清晨的沱江薄雾缭绕,坐上一叶乌篷船,看两岸古朴的吊脚楼倒映在碧绿江水中,宛如一幅流动的水墨画。"——携程"清晨的沱江薄雾缭绕,坐上一叶乌篷船,看两岸古朴的吊脚楼倒映在碧绿江水中,宛如一幅流动的水墨画。"——携程' },
  { prov:'湖南省', name:'岳阳楼-君山岛景区', county:'岳阳市', type:'scenic', level:'5A', lat:29.3720, lng:113.0960, price:'【待核实】', rating:'—', addr:'岳阳市岳阳楼区', tags:['5A','江南名楼'], review:'先天下之忧而忧，《岳阳楼记》诞生地。<br>"站在岳阳楼二层远眺洞庭湖,水面开阔波光粼粼,风拂过脸颊很舒服。"——携程<br>"岳阳楼还是值得的,有眼前的岳阳楼,有五朝代的岳阳楼模型。凭栏远眺八百里洞庭,值得勾留半天。"——携程"岳阳楼还是值得的,有眼前的岳阳楼,有五朝代的岳阳楼模型。凭栏远眺八百里洞庭,值得勾留半天。"——携程' },
  { prov:'湖南省', name:'南岳衡山旅游区', county:'衡阳市', type:'scenic', level:'5A', lat:27.2550, lng:112.7340, price:'【待核实】', rating:'—', addr:'衡阳市南岳区', tags:['5A','五岳'], review:'五岳独秀，祝融峰观日出云海。<br>"南岳人文底蕴浓厚,南岳大庙香火旺盛,登顶祝融峰视野开阔,适合祈福散心"——携程<br>"南岳衡山不愧是五岳名山,登山体验很棒!山林植被茂密,一路古木参天,空气清新,山间风景层次丰富"——携程<br>"清晨登临祝融峰,看云海翻腾、红日喷薄,壮丽景色令人震撼。景区内佛道共存,南岳大庙香火鼎盛"——携程<br>"一定要走梵音古道,这条路才是衡山精髓,非常好玩,不愧五岳独秀"——携程' },
  { prov:'湖南省', name:'韶山旅游区', county:'湘潭市', type:'scenic', level:'5A', lat:27.9150, lng:112.5260, price:'免费（景点预约）', rating:'—', addr:'湘潭市韶山市', tags:['5A','红色旅游'], review:'伟人故里，毛泽东同志故居与铜像广场。<br>"毛主席的故乡是福地、宝地,家乡的人热情、亲切。老板一家热情的服务不亚于五星级饭店服务员"——新浪新闻<br>"趁着假期带孩子来伟人家乡看看,上一堂青春“必修课”。"——新浪新闻<br>"从毛主席故居感受伟人的成长环境,到纪念馆深入了解革命历程,再到铜像广场敬献花篮表达敬意"——去哪儿<br>"除了天气很热以外剩下的服务体验感很好,明码标价,无隐形消费"——去哪儿' },
  { prov:'湖南省', name:'橘子洲景区', county:'长沙市', type:'scenic', level:'5A', lat:28.1920, lng:112.9630, price:'免费', rating:'—', addr:'长沙市岳麓区', tags:['5A','湘江'], review:'独立寒秋，湘江北去，青年毛泽东雕像凝望江面。<br>"长沙必打卡地标橘子洲,夜景氛围感直接拉满!青年毛主席艺术雕塑庄重震撼,站在雕像前内心满是敬畏与动容"——携程<br>"橘子洲头景区,作为长沙的标志性景点,实至名归地被誉为“中国第一洲”。"——携程<br>"橘子洲头,湘江明珠。青年毛泽东雕像巍然屹立,问天台远眺江天一色。四季花木葱茏,橘香四溢"——携程' },

  // ===== 全国 · 广东省（6） =====
  { prov:'广东省', name:'广州长隆旅游度假区', county:'广州市', type:'scenic', level:'5A', lat:23.0020, lng:113.3310, price:'【待核实】', rating:'—', addr:'广州市番禺区', tags:['5A','主题乐园'], review:'野生动物园+欢乐世界+大马戏一站式。<br>"长隆动物园真的是动物园天花板,环境非常自然,空气也很清新,感觉动物活的都很滋润"——携程<br>"广州长隆野生动物世界值得一去,五一假期买了二大一小的票,体验感十足。特别是园区里的小火车和缆车"——携程<br>"景区环境不错,动物种类很多,节目也很丰富多彩,特别适合亲子游。就是节假日人太多,排队等待的时间会比较长"——携程<br>"长隆动物园真的名不虚传 小火车一定要坐 体验感很好 看到很多不同种类的动物"——携程' },
  { prov:'广东省', name:'广州塔', county:'广州市', type:'scenic', level:'4A', lat:23.1066, lng:113.3245, price:'150元起', rating:'—', addr:'广州市海珠区', tags:['小蛮腰','地标'], review:'600米"小蛮腰"，塔顶摩天轮俯瞰珠江。<br>"广州塔不愧是广州地标,大家亲切叫它小蛮腰,造型曲线优美,钢结构设计很有艺术感。"——携程<br>"夜景很好看 但是性价比真的很低"——去哪儿' },
  { prov:'广东省', name:'丹霞山', county:'韶关市', type:'scenic', level:'5A', lat:25.0240, lng:113.7380, price:'【待核实】', rating:'—', addr:'韶关市仁化县', tags:['5A','世界遗产','丹霞地貌'], review:'丹霞地貌命名地，阳元石姐妹峰奇观。<br>"五星好评,丹霞山不高,但是爬山时该有的陡峭惊险全有,景区环境非常好,刚进门就看到野生动物。"——携程<br>"累坏了,风景不错!值得来,慢慢玩"——去哪儿"累坏了,风景不错!值得来,慢慢玩"——去哪儿' },
  { prov:'广东省', name:'开平碉楼文化旅游区', county:'江门市', type:'scenic', level:'5A', lat:22.3730, lng:112.6980, price:'【待核实】', rating:'—', addr:'江门市开平市', tags:['5A','世界遗产','碉楼'], review:'中西合璧的乡土建筑群，《让子弹飞》取景地。<br>"冲着中国第35座世界文化遗产而来。不仅了解了碉楼群的历史,更通过纪录片了解了碉楼由来的文化"——携程<br>"开平碉楼世界文化遗产,值得一去,核心景点就是立园和自力村这大概半天能逛完"——携程<br>"慕名而来,不虚此行。这里的碉楼让我们看到华侨早期的现代化意识和理念,防卫、居住、更是中西结合的杰作"——携程<br>"傍晚时分去的,夕阳下驻立在绿色田野间的碉楼群,拍照还是很容易出片的"——携程' },
  { prov:'广东省', name:'深圳世界之窗', county:'深圳市', type:'scenic', level:'5A', lat:22.5350, lng:113.9740, price:'【待核实】', rating:'—', addr:'深圳市南山区', tags:['5A','主题公园'], review:'一天"环游世界"，埃菲尔铁塔等比缩建。<br>"深圳世界之窗超赞!一日环游世界,各国地标微缩景观精致逼真,夜景灯光璀璨,铁塔与喷泉绝美,表演精彩"——携程<br>"不足是部分景观略陈旧,热门项目需排队,但整体能快速感受世界风情,性价比尚可,是来深必逛的经典景点。"——携程<br>"深圳世界之窗是浓缩全球风光的打卡地,300+世界地标微缩景观还原度高,埃菲尔铁塔、金字塔等拍照出片率拉满"——携程<br>"项目好玩,梅拉尼亚小镇很漂亮!性价比高,演出好看"——去哪儿' },
  { prov:'广东省', name:'肇庆星湖（七星岩·鼎湖山）', county:'肇庆市', type:'scenic', level:'5A', lat:23.0710, lng:112.4700, price:'【待核实】', rating:'—', addr:'肇庆市端州区', tags:['5A','喀斯特'], review:'七星岩湖山相映，鼎湖山北回归线绿洲。<br>"七星岩山环水绕,奇峰叠翠,湖水澄澈明净。岩洞奇特幽深,石刻遍布山间。湖山相融,一步一景"——携程<br>"没买票入园,沿湖边骑车逛了一圈,意外解锁神仙体验✨ 不用挤景区,也能沉浸式感受“桂林之山,杭州之水”的韵味"——携程<br>"好山好水好风光!散步的好去处,景区里有星湖湿地,里面有火烈鸟、丹顶鹤、鸳鸯等动物"——大众点评' },

  // ===== 全国 · 广西壮族自治区（6） =====
  { prov:'广西壮族自治区', name:'桂林漓江风景区', county:'桂林市', type:'scenic', level:'5A', lat:25.2740, lng:110.2900, price:'【待核实】', rating:'—', addr:'桂林市', tags:['5A','山水甲天下'], review:'桂林山水甲天下，竹筏漂流九马画山。<br>"漓江竹筏漂流真的值得冲!坐在竹筏上顺水走,两边山一座接一座,水也清,风一吹特别舒服,真有点“人在画中游”的感觉"——携程<br>"漓江的景色甲天下,实至名归。真正让人有画中游的感觉,你不禁会赞叹大自然的鬼斧神工。"——携程"漓江的景色甲天下,实至名归。真正让人有画中游的感觉,你不禁会赞叹大自然的鬼斧神工。"——携程' },
  { prov:'广西壮族自治区', name:'阳朔西街', county:'桂林市', type:'scenic', level:'', lat:24.7740, lng:110.4940, price:'免费', rating:'—', addr:'桂林市阳朔县', tags:['洋人街','夜生活'], review:'1400年老街混搭全球酒吧，骑行十里画廊。' },
  { prov:'广西壮族自治区', name:'龙脊梯田', county:'桂林市', type:'scenic', level:'4A', lat:25.7900, lng:110.1300, price:'【待核实】', rating:'—', addr:'桂林市龙胜县', tags:['梯田','壮族'], review:'平安寨与金坑大寨，秋收金浪春灌银镜。<br>"龙脊梯田真的震撼人心!层层田埂顺着山势蜿蜒,如大地优美的曲线。云雾漫过山腰,吊脚楼错落其间。"——携程<br>"百闻不如一见,龙脊梯田确实很震撼。层层梯田顺着山势铺展,如同大地雕刻出来的纹路,景色如梦如幻。"——携程' },
  { prov:'广西壮族自治区', name:'德天跨国瀑布', county:'崇左市', type:'scenic', level:'5A', lat:22.9990, lng:106.7170, price:'【待核实】', rating:'—', addr:'崇左市大新县', tags:['5A','跨国瀑布'], review:'亚洲第一跨国瀑布，与越南板约瀑布相连。<br>"德天跨国瀑布气势磅礴,一瀑跨两国景色十分震撼。坐竹筏近距离感受水雾扑面而来,观景台可饱览全景。"——携程<br>"去过两次了,风景非常美,比起黄果树德天有自己的风格,赶上雨水好的季节,水量丰沛瀑布特别壮观。"——大众点评"去过两次了,风景非常美,比起黄果树德天有自己的风格,赶上雨水好的季节,水量丰沛瀑布特别壮观。"——大众点评' },
  { prov:'广西壮族自治区', name:'北海银滩', county:'北海市', type:'scenic', level:'4A', lat:21.4060, lng:109.1300, price:'免费', rating:'—', addr:'北海市银海区', tags:['沙滩'], review:'"天下第一滩"，沙白细软落日温柔。' },
  { prov:'广西壮族自治区', name:'青秀山旅游区', county:'南宁市', type:'scenic', level:'5A', lat:22.7880, lng:108.3860, price:'【待核实】', rating:'—', addr:'南宁市青秀区', tags:['5A','城市绿肺'], review:'邕江之畔"绿城翡翠"。<br>"20元的门票价格非常值得 整个景区非常大 是南宁的城市绿肺 景区观光车单次仅需5元 非常的公道良心"——携程<br>"青秀山不愧南宁宝藏5A景区,林木繁茂空气清新,是绝佳天然氧吧。兰园繁花雅致,步道干净配套齐全"——携程<br>"南宁青秀山绝对是个良心的景区,做为一个5A级景区,票价才20元,而且风景秀丽,必须赞一个!"——大众点评<br>"风景秀丽,东门的叶子花园,莫奈花园,王莲,水生花园,北门的兰园,荫生植物园等都值得一看"——去哪儿' },

  { prov:'海南省', name:'天涯海角游览区', county:'三亚市', type:'scenic', level:'4A', lat:18.2440, lng:109.1030, price:'【待核实】', rating:'—', addr:'三亚市天涯区', tags:['地标'], review:'"到天涯海角"打卡的石头的浪漫。<br>"来天涯海角游玩体验很不错,海边风景特别治愈,海水干净视野开阔。两块标志性石头打卡氛围感拉满,沿路沙滩平缓好走"——携程<br>"天涯海角这个景区现在不收费,还是个挺有标志性的地方,值得一去的。"——携程' },
  { prov:'海南省', name:'南山文化旅游区', county:'三亚市', type:'scenic', level:'5A', lat:18.2910, lng:109.2000, price:'【待核实】', rating:'—', addr:'三亚市崖州区', tags:['5A','108米海上观音'], review:'108米海上圣观音像慈望南海。' },
  { prov:'海南省', name:'呀诺达雨林文化旅游区', county:'三亚市', type:'scenic', level:'5A', lat:18.4200, lng:109.6200, price:'【待核实】', rating:'—', addr:'三亚市保亭县', tags:['5A','热带雨林'], review:'北纬18度热带雨林，踏瀑戏水清凉一夏。<br>"带娃选择了戏水路线,挑战项目有难有易,过程是有趣的,湿身是肯定的,有教练带队全程大概1个多小时"——携程<br>"很棒的雨林,买了vip金钥匙,遇到了很棒的导游,一圈下来已经和小朋友称兄道弟了"——携程<br>"呀诺达景色美,见到了很多以前没见到的植物,导游刘畅非常好,细心,耐心,还充满爱心"——去哪儿<br>"雅诺达的玻璃栈道额非常漂亮。嗯,建议大家都去体验。"——去哪儿' },

  { prov:'重庆市', name:'洪崖洞民俗风貌区', county:'重庆市', type:'scenic', level:'', lat:29.5628, lng:106.5786, price:'免费', rating:'—', addr:'重庆市渝中区', tags:['夜景','网红'], review:'现实版《千与千寻》，吊脚楼灯火层叠。' },
  { prov:'重庆市', name:'大足石刻景区', county:'重庆市', type:'scenic', level:'5A', lat:29.7070, lng:105.7030, price:'115元', rating:'—', addr:'重庆市大足区', tags:['5A','世界遗产','石窟'], review:'唐宋石刻艺术巅峰，千手观音宝顶山必看。<br>"大足石刻不愧是世界文化遗产!依山凿刻的摩崖造像历经千年风雨,依旧神态生动。千手观音、卧佛等雕像工艺精湛"——携程<br>"宝顶是南宋的石刻造像,造像主要集中在大佛湾,整个大佛湾规模不大,只有五百米,但造像整体保存的非常好"——携程<br>"非常值得去,民间故事的石刻,人物形象塑造生动有趣,不是皇家那般刻板套路"——携程<br>"说是大足石刻,其实一般人来个宝顶山就够了,好看的大部分在这。"——携程' },
  { prov:'重庆市', name:'武隆喀斯特旅游区', county:'重庆市', type:'scenic', level:'5A', lat:29.3600, lng:107.7580, price:'【待核实】', rating:'—', addr:'重庆市武隆区', tags:['5A','世界遗产','天生三桥'], review:'天生三桥地缝天坑，《满城尽带黄金甲》取景地。<br>"大自然的鬼斧神工,喀斯特地貌非常震撼,变形金刚取景地打卡。观光电梯下到谷底,峡谷步道景色很美"——携程<br>"武隆的景色的确是鬼斧神工,难怪张导翻山越岭找到这个地方布置了这样一处曲径通幽的场景。"——携程' },
  { prov:'重庆市', name:'白帝城·瞿塘峡', county:'重庆市', type:'scenic', level:'4A', lat:31.0400, lng:109.5700, price:'【待核实】', rating:'—', addr:'重庆市奉节县', tags:['三峡','李白'], review:'朝辞白帝彩云间，夔门天下雄。' },
  { prov:'重庆市', name:'磁器口古镇', county:'重庆市', type:'scenic', level:'4A', lat:29.5780, lng:106.4440, price:'免费', rating:'—', addr:'重庆市沙坪坝区', tags:['古镇','小吃'], review:'一条石板路，千年磁器口，陈麻花排队排到巷尾。' },
  { prov:'重庆市', name:'金佛山景区', county:'重庆市', type:'scenic', level:'5A', lat:29.1000, lng:107.1800, price:'【待核实】', rating:'—', addr:'重庆市南川区', tags:['5A','喀斯特'], review:'世界自然遗产，冬滑雪夏避暑。<br>"重庆金佛山太值得来玩了,真的是避暑圣地,建议穿棉绸长裤长衣游玩,古佛洞只有9度,溶洞也凉快"——携程<br>"算是一个比较小众的景点,但也是五A景区。因为它有三个门可以进入,所以游客相对比较分散"——携程<br>"山顶很凉快,尤其是山顶的古佛洞洞就像进入冰箱里一样,而且非常震撼。避暑游玩的好地方!"——携程' },

  // ===== 全国 · 四川省（9） =====
  { prov:'四川省', name:'九寨沟风景名胜区', county:'阿坝州', type:'scenic', level:'5A', lat:33.2620, lng:103.9180, price:'【待核实】', rating:'—', addr:'阿坝州九寨沟县', tags:['5A','世界遗产','海子'], review:'九寨归来不看水，五彩池翠海叠瀑如调色盘。<br>"九寨归来不看水。九寨沟的景色真的是美极了,蓝天白云碧水,九寨沟的水真是天下一绝。"——携程<br>"我的天啊,亲眼见到才知道九寨沟有多震撼!一片片青绿色的海子镶嵌在山谷之间,湖水通透澄澈"——携程"我的天啊,亲眼见到才知道九寨沟有多震撼!一片片青绿色的海子镶嵌在山谷之间,湖水通透澄澈"——携程' },
  { prov:'四川省', name:'黄龙风景名胜区', county:'阿坝州', type:'scenic', level:'5A', lat:32.7520, lng:103.8230, price:'【待核实】', rating:'—', addr:'阿坝州松潘县', tags:['5A','世界遗产','钙化池'], review:'人间瑶池，三千彩池顺谷铺展。' },
  { prov:'四川省', name:'峨眉山风景区', county:'乐山市', type:'scenic', level:'5A', lat:29.5440, lng:103.3340, price:'【待核实】', rating:'—', addr:'乐山市峨眉山市', tags:['5A','佛教名山','金顶'], review:'普贤道场，金顶十方普贤像与云海佛光。<br>"峨眉山真的值得一游!从报国寺到金顶,一路风景层次丰富。山间古寺清幽,灵猴俏皮可爱,登顶金顶见到十方普贤像"——携程<br>"作为佛教名山和世界自然文化双遗产,峨眉山还是很有必要来一趟的。不过这个门票价格还是太贵了点"——携程"作为佛教名山和世界自然文化双遗产,峨眉山还是很有必要来一趟的。不过这个门票价格还是太贵了点"——携程' },
  { prov:'四川省', name:'乐山大佛景区', county:'乐山市', type:'scenic', level:'5A', lat:29.5450, lng:103.7720, price:'【待核实】', rating:'—', addr:'乐山市市中区', tags:['5A','世界遗产','大佛'], review:'71米弥勒坐佛，"山是一尊佛，佛是一座山"。<br>"亲眼见到乐山大佛真的特别震撼,真切体会到“山是一尊佛,佛是一座山”的磅礴气势。"——携程<br>"乐山大佛气势磅礴,依山临江凿刻而成,千年石刻十分震撼。走九曲栈道近距离瞻仰佛像,感受古人精湛雕刻技艺。"——携程"乐山大佛气势磅礴,依山临江凿刻而成,千年石刻十分震撼。走九曲栈道近距离瞻仰佛像,感受古人精湛雕刻技艺。"——携程' },

  { prov:'四川省', name:'青城山景区', county:'成都市', type:'scenic', level:'5A', lat:30.9000, lng:103.5600, price:'【待核实】', rating:'—', addr:'成都市都江堰市', tags:['5A','道教'], review:'"青城天下幽"，前山问道后山玩水。<br>"终于来到青城山,果然体会到“青城天下幽”。满山绿树,古观藏于密林,一路山泉鸟鸣,空气特别清新"——携程<br>"青城山素有“青城天下幽”美誉,是世界文化遗产、中国道教发源地。前山道观林立"——携程<br>"非常值得去看的景区,看风景的同时还可以领略道家文化的博大精深。"——携程<br>"青城山不愧是青城天下幽!满目青翠,林木繁茂,山间清凉静谧。"——携程' },

  { prov:'贵州省', name:'梵净山旅游区', county:'铜仁市', type:'scenic', level:'5A', lat:27.9150, lng:108.7000, price:'【待核实】', rating:'—', addr:'铜仁市江口县', tags:['5A','世界遗产','弥勒道场'], review:'红云金顶一柱擎天，爬完铁链天梯此生难忘。<br>"不愧是佛教名山 山形如天空之城 山下的寺庙还会施粥 红云金顶90度的天梯上去也是独特体验"——携程<br>"来到梵净山,真切体会到什么叫天空之城。原始森林郁郁葱葱,山顶云雾流转,蘑菇石、红云金顶两大奇观让人叹服"——携程<br>"梵净山不愧世界自然遗产,蘑菇石、红云金顶气势震撼,原始森林空气清新。"——携程' },

  { prov:'贵州省', name:'青岩古镇', county:'贵阳市', type:'scenic', level:'5A', lat:26.3300, lng:106.6900, price:'【待核实】', rating:'—', addr:'贵阳市花溪区', tags:['5A','军事古镇'], review:'青石板路+状元蹄，贵阳人周末后花园。<br>"青岩古镇烟火气十足,石板街巷古色古香,卤猪脚、糕粑稀饭等特色小吃超多。商业化适度,逛吃散步很舒服"——携程<br>"历经600年的青岩古镇,有漂亮的青石板路,古老斑驳的城墙……当然还有必吃的青岩状元蹄"——携程' },
