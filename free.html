<body>
<header>
  <div class="hrow">
    <a class="back" href="index.html">← 返回地图</a>
    <h1>🎁 全国免费景区榜单</h1>
    <a class="back" href="province.html">📋 总表</a>
  </div>
</header>
<div class="wrap">
  <p class="seo" style="margin:4px 0 10px;">全部 5A/4A 级景区中票价免费者共 283 家（38 家 5A、245 家 4A），含游客真实评价与高德导航——穷游、周末游首选。</p>
  <div id="stats" aria-busy="true"></div>
  <div id="provChips"></div>
  <div class="grid" id="list">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
  <div id="empty">该省暂无收录的免费景区</div>
  <button id="more" type="button">加载更多</button>
  <p class="seo">本榜单由全国 A 级景区名录自动筛选票价免费者生成，评价整理自携程/大众点评等公开平台。更多：<a href="province.html">全国A级景区总表</a> · <a href="taste.html?t=food">全国美食专题</a> · <a href="index.html">全国景点地图</a></p>
</div>
<script>
const PAGE = 60;
let all = [], curProv = '', shown = 0;
const $ = id => document.getElementById(id);
const q = k => new URLSearchParams(location.search).get(k) || '';
function gaode(lat, lng, name) { return 'https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=' + encodeURIComponent(name); }
function apply() {
  const rows = curProv ? all.filter(x => x.p === curProv) : all;
  const provs = [...new Set(all.map(x => x.p))];
  $('provChips').innerHTML = '<span class="chip' + (!curProv ? ' active' : '') + '" data-p="">全部 ' + all.length + '</span>' +
    provs.map(p => '<span class="chip' + (p === curProv ? ' active' : '') + '" data-p="' + p + '">' + p.replace(/[省市区自治区壮族回族维吾尔族]/g, '') + ' ' + all.filter(x => x.p === p).length + '</span>').join('');
  [...$('provChips').children].forEach(c => c.onclick = () => { curProv = c.dataset.p; shown = 0; $('list').innerHTML = ''; apply(); });
  const stats = rows.filter(x => x.l === '5A').length;
  $('stats').innerHTML = '<div class="stat"><b>' + rows.length + '</b>免费景区</div>'
    + '<div class="stat"><b>' + stats + '</b>5A</div>'
    + '<div class="stat"><b>' + rows.filter(x => x.l === '4A').length + '</b>4A</div>'
    + '<div class="stat"><b>¥0</b>门票总计</div>';
  $('empty').style.display = rows.length ? 'none' : 'block';
  const frag = document.createDocumentFragment();
  rows.slice(shown, shown + PAGE).forEach(x => {
    const el = document.createElement('div'); el.className = 'card';
    el.innerHTML = '<h2><span class="lv' + (x.l === '5A' ? ' a5' : '') + '">' + x.l + '</span><span class="nm"></span></h2>'
      + '<div class="meta">📍 ' + (x.p || '') + ' · 门票：<span class="free">免费</span></div>'
      + '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="' + gaode(x.lat, x.lng, x.n) + '">🧭 导航</a>'
      + (x.q ? '<button class="btn rev" type="button">💬 评价</button>' : '')
      + '<a class="btn" href="province.html?p=' + encodeURIComponent(x.p || '') + '">📄 全省景区 →</a></div>'
      + (x.q ? '<div class="rev-box">' + x.q + '</div>' : '');
    el.querySelector('.nm').textContent = x.n;
    const rb = el.querySelector('.rev-box');
    if (rb) el.querySelector('.rev').onclick = () => rb.classList.toggle('open');
    frag.appendChild(el);
  });
  shown = Math.min(shown + PAGE, rows.length);
  const list = $('list'); if (shown === PAGE) list.innerHTML = '';
  list.removeAttribute('aria-busy');
  list.appendChild(frag);
  const mb = $('more');
  mb.style.display = rows.length > shown ? 'block' : 'none';
  mb.textContent = '加载更多（已显示 ' + shown + '/' + rows.length + '）';
}
$('more').onclick = apply;
fetch('data/national.json').then(r => r.json()).then(data => {
  all = data.filter(x => (x.t || '').includes('免费'));
  curProv = q('p') || '';
  apply();
}).catch(() => {
  $('list').innerHTML = '';
  $('empty').textContent = '数据加载失败，请检查网络后刷新重试';
  $('empty').style.display = 'block';
});
</script>
</body>
