<head>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍜</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding-bottom: env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #161b22; border-bottom: 1px solid #30363d; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 17px; color: #f0c674; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header a.back { color: #58a6ff; text-decoration: none; font-size: 13px; white-space: nowrap; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 12px; }
  .tabs { display: flex; gap: 6px; margin: 10px 0; }
  .tbtn { font-size: 13px; padding: 6px 14px; border-radius: 16px; border: 1px solid #30363d; background: #161b22; color: #8b949e; cursor: pointer; user-select: none; }
  .tbtn.active { color: #f0c674; border-color: #f0c674; background: rgba(240,198,116,.08); }
  #stats { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .stat { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 8px 12px; font-size: 12px; color: #8b949e; }
  .stat b { color: #f0c674; font-size: 15px; margin-right: 3px; }
  .filters { display: flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  #kw { flex: 1; min-width: 180px; padding: 9px 12px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 16px; }
  #kw:focus { outline: none; border-color: #58a6ff; }
  #sortSel { padding: 9px 10px; background: #161b22; border: 1px solid #30363d; border-radius: 8px; color: #c9d1d9; font-size: 13px; }
  .chips { display: none; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chips.show { display: flex; }
  .chip { padding: 4px 11px; background: #161b22; border: 1px solid #30363d; border-radius: 14px; font-size: 12px; color: #8b949e; text-decoration: none; cursor: pointer; }
  .chip.active { color: #f0c674; border-color: #f0c674; }
  .grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 12px; }
  @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 960px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 12px 14px; }
  .card-top { display: flex; align-items: baseline; gap: 8px; }
  .badge { font-size: 11px; color: #ffb86c; white-space: nowrap; }
  .card h2 { font-size: 15px; color: #e6edf3; line-height: 1.4; min-width: 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: #8b949e; margin-top: 6px; }
  .meta .price { color: #7ee787; }
  .meta .rating { color: #f0c674; }
  .acts { display: flex; gap: 8px; margin-top: 10px; }
  .btn { font-size: 12px; padding: 6px 12px; border-radius: 7px; border: 1px solid #30363d; background: #21262d; color: #c9d1d9; text-decoration: none; cursor: pointer; }
  .btn:hover { border-color: #58a6ff; color: #58a6ff; }
  .rev-box { display: none; margin-top: 10px; font-size: 13px; line-height: 1.8; color: #adbac7; border-top: 1px dashed #30363d; padding-top: 10px; }
  .rev-box.open { display: block; }
  #empty { display: none; text-align: center; color: #8b949e; padding: 40px 0; font-size: 14px; }
  .sk { background: linear-gradient(90deg, #161b22 25%, #1f2630 50%, #161b22 75%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 10px; height: 120px; }
  @keyframes shimmer { to { background-position: -200% 0; } }
  @media (max-width: 700px) {
    header { padding-top: calc(12px + env(safe-area-inset-top)); }
    .tbtn, .chip, .btn { min-height: 44px; display: inline-flex; align-items: center; }
    .btn { padding: 8px 14px; }
    .w-del { min-width: 44px; min-height: 44px; }
    #backTop { width: 44px !important; height: 44px !important; }
  }
  #more { display: none; margin: 16px auto; font-size: 13px; padding: 8px 24px; }
</style>

<body>
<header>
  <a class="back" href="index.html">← 返回地图</a>
  <h1 id="title">🍜 全国美食专题</h1>
  <a class="back" id="wishBtn" href="#" role="button">♡ 心愿单(<span id="wishCount">0</span>)</a>
</header>
<dialog id="wishDlg" aria-label="心愿单">
  <div class="wish-head"><b>♡ 我的心愿单</b><button class="btn" id="wishClose" type="button">关闭</button></div>
  <div id="wishList"></div>
  <div class="wish-foot" id="wishFoot" style="display:none;"><button class="btn" id="wishClear" type="button">🗑 清空</button></div>
</dialog>
<style>
  #wishDlg { background: #161b22; color: #c9d1d9; border: 1px solid #30363d; border-radius: 12px; padding: 16px; max-width: 420px; width: calc(100% - 32px); max-height: min(80dvh, 560px); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #wishDlg::backdrop { background: rgba(0,0,0,.6); }
  .wish-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; color: #f0c674; }
  .wish-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px dashed #30363d; font-size: 13px; }
  .wish-item .w-name { flex: 1; min-width: 0; color: #e6edf3; }
  .wish-item .w-meta { font-size: 11px; color: #8b949e; white-space: nowrap; }
  .wish-item .w-del { border: 0; background: none; color: #f85149; cursor: pointer; font-size: 14px; padding: 2px 6px; }
  .wish-foot { margin-top: 12px; text-align: right; }
  .wish-empty { color: #8b949e; font-size: 13px; padding: 20px 0; text-align: center; }
  .btn.fav { color: #f85149; border-color: #f85149; }
</style>
<div class="wrap">
  <div class="tabs" role="tablist">
    <span class="tbtn active" data-t="food" role="tab" aria-selected="true">🍜 美食</span>
    <span class="tbtn" data-t="stay" role="tab" aria-selected="false">🏨 住宿</span>
    <span class="tbtn" data-t="hot" role="tab" aria-selected="false">📸 网红点</span>
  </div>
  <div id="stats"></div>
  <div class="filters">
    <input id="kw" type="search" placeholder="搜索名称 / 地点…">
    <select id="sortSel" aria-label="排序方式">
      <option value="default">默认排序</option>
      <option value="rating">评分优先</option>
      <option value="prov">按省份</option>
    </select>
  </div>
  <div id="provChips" class="chips"></div>
  <div class="grid" id="list" aria-busy="true">
    <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
  </div>
  <div id="empty">未找到匹配的点位，换个关键词试试</div>
  <button class="btn" id="more" type="button">加载更多</button>
</div>
<script>
const TYPE = {
  food: { title: '🍜 全国美食专题', label: '美食', icon: '🍜' },
  stay: { title: '🏨 全国住宿专题', label: '住宿', icon: '🏨' },
  hot:  { title: '📸 全国网红点专题', label: '网红点', icon: '📸' }
};
const PAGE = 60;
let all = [], curT = 'food', curProv = '', kw = '', sort = 'default', shown = 0;
function q(name) { return new URLSearchParams(location.search).get(name) || ''; }
function gaode(lat, lng, name) { return 'https://uri.amap.com/marker?position=' + lng + ',' + lat + '&name=' + encodeURIComponent(name); }
function ratingNum(x) { const m = String(x.rating || '').match(/(4\.\d+|5\.0)/); return m ? parseFloat(m[1]) : 0; }
function shortProv(p) { return (p || '').replace(/(维吾尔|回族|壮族)?自治区$|省$|市$/, ''); }

function curList() {
  let rows = all.filter(x => x.type === curT);
  if (curProv) rows = rows.filter(x => x.prov === curProv);
  if (kw) { const k = kw.toLowerCase(); rows = rows.filter(x => ((x.name || '') + ' ' + (x.county || '') + ' ' + (x.addr || '')).toLowerCase().includes(k)); }
  if (sort === 'rating') rows = rows.slice().sort((a, b) => ratingNum(b) - ratingNum(a));
  else if (sort === 'prov') rows = rows.slice().sort((a, b) => (a.prov || '').localeCompare(b.prov || '', 'zh'));
  return rows;
}
function renderStats(rows) {
  const provs = new Set(all.filter(x => x.type === curT).map(x => x.prov).filter(Boolean));
  const avg = (() => { const rs = rows.map(ratingNum).filter(Boolean); return rs.length ? (rs.reduce((a, b) => a + b, 0) / rs.length).toFixed(2) : '—'; })();
  document.getElementById('stats').innerHTML =
    '<div class="stat"><b>' + all.filter(x => x.type === curT).length + '</b>' + TYPE[curT].label + '精选</div>'
    + '<div class="stat"><b>' + provs.size + '</b>覆盖省级地区</div>'
    + '<div class="stat"><b>' + avg + '</b>平均评分</div>'
    + '<div class="stat"><b>' + rows.length + '</b>当前筛选</div>';
}
function wishKey(x) { return (x.prov || '') + '|' + x.name; }
const WISH_KEY = 'ts_wishlist';
let wish = [];
try { wish = JSON.parse(localStorage.getItem(WISH_KEY) || '[]'); } catch (e) { wish = []; }
function saveWish() { try { localStorage.setItem(WISH_KEY, JSON.stringify(wish)); } catch (e) {} }
function isFav(x) { return wish.some(w => w.k === wishKey(x)); }
function updateWishCount() { document.getElementById('wishCount').textContent = wish.length; }
function toggleWish(x, btn) {
  if (isFav(x)) wish = wish.filter(w => w.k !== wishKey(x));
  else wish.unshift({ k: wishKey(x), name: x.name, type: x.type, prov: x.prov || '', county: x.county || '', price: x.price || '', rating: x.rating || '', lat: x.lat, lng: x.lng });
  saveWish(); updateWishCount(); renderWishList();
  if (btn) btn.classList.toggle('fav', isFav(x)), btn.textContent = isFav(x) ? '♥ 已收藏' : '♡ 收藏';
}
function renderWishList() {
  const box = document.getElementById('wishList');
  const foot = document.getElementById('wishFoot');
  if (!wish.length) { box.innerHTML = '<div class="wish-empty">还没有收藏，浏览专题时点「♡ 收藏」加入</div>'; foot.style.display = 'none'; return; }
  box.innerHTML = '';
  foot.style.display = 'block';
  const TYPE_ICON = { food: '🍜', stay: '🏨', hot: '📸' };
  wish.forEach(w => {
    const row = document.createElement('div'); row.className = 'wish-item';
    const name = document.createElement('span'); name.className = 'w-name';
    name.textContent = (TYPE_ICON[w.type] || '📍') + ' ' + w.name;
    const meta = document.createElement('span'); meta.className = 'w-meta';
    meta.textContent = (w.county || w.prov) + (w.rating ? ' ⭐' + w.rating : '');
    const nav = document.createElement('a'); nav.className = 'btn'; nav.target = '_blank'; nav.rel = 'noopener';
    nav.textContent = '🧭'; nav.href = gaode(w.lat, w.lng, w.name); nav.setAttribute('aria-label', '导航到' + w.name);
    const del = document.createElement('button'); del.className = 'w-del'; del.type = 'button';
    del.textContent = '✕'; del.setAttribute('aria-label', '删除' + w.name);
    del.onclick = () => { wish = wish.filter(x => x.k !== w.k); saveWish(); updateWishCount(); renderWishList(); };
    row.append(name, meta, nav, del);
    box.appendChild(row);
  });
}
document.getElementById('wishBtn').onclick = function(e) { e.preventDefault(); renderWishList(); const dlg = document.getElementById('wishDlg'); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); };
document.getElementById('wishClose').onclick = () => document.getElementById('wishDlg').close();
document.getElementById('wishClear').onclick = function() { if (confirm('确定清空全部 ' + wish.length + ' 条收藏？')) { wish = []; saveWish(); updateWishCount(); renderWishList(); } };

function card(x) {
  const el = document.createElement('div'); el.className = 'card';
  const fav = isFav(x);
  el.innerHTML = '<div class="card-top"><span class="badge">' + TYPE[curT].icon + '</span><h2></h2></div>'
    + '<p class="meta"><span>📍 ' + (x.county || shortProv(x.prov)) + (x.prov ? ' · ' + shortProv(x.prov) : '') + '</span>'
    + (x.price ? '<span>💰 <b class="price">' + x.price + '</b></span>' : '')
    + (x.rating ? '<span>⭐ <b class="rating">' + x.rating + '</b></span>' : '') + '</p>'
    + '<div class="acts"><a class="btn" target="_blank" rel="noopener" href="' + gaode(x.lat, x.lng, x.name) + '">🧭 高德导航</a>'
    + (x.review ? '<button class="btn rev" type="button">💬 评价详情</button>' : '')
    + '<button class="btn fav-btn' + (fav ? ' fav' : '') + '" type="button">' + (fav ? '♥ 已收藏' : '♡ 收藏') + '</button>'
    + '<a class="btn" href="province.html?p=' + encodeURIComponent(x.prov || '') + '&t=' + curT + '">📄 同省更多 →</a></div>'
    + (x.review ? '<div class="rev-box">' + x.review + '</div>' : '');
  el.querySelector('h2').textContent = x.name;
  const rb = el.querySelector('.rev-box');
  if (rb) el.querySelector('.rev').onclick = () => rb.classList.toggle('open');
  el.querySelector('.fav-btn').onclick = function() { toggleWish(x, this); };
  return el;
}
function renderPage() {
  const rows = curList();
  renderStats(rows);
  const list = document.getElementById('list');
  document.getElementById('empty').style.display = rows.length ? 'none' : 'block';
  document.getElementById('more').style.display = shown < rows.length ? 'inline-block' : 'none';
  const frag = document.createDocumentFragment();
  rows.slice(shown, shown + PAGE).forEach(x => frag.appendChild(card(x)));
  list.appendChild(frag);
  shown = Math.min(shown + PAGE, rows.length);
  document.getElementById('more').textContent = '加载更多（已显示 ' + shown + '/' + rows.length + '）';
}
function resetAndRender() {
  shown = 0;
  const list = document.getElementById('list');
  list.innerHTML = '';
  list.removeAttribute('aria-busy');
  renderPage();
}
function buildProvChips() {
  const box = document.getElementById('provChips');
  const provs = [...new Set(all.filter(x => x.type === curT).map(x => x.prov).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh'));
  box.innerHTML = '';
  const add = (label, val) => {
    const c = document.createElement('span');
    c.className = 'chip' + (curProv === val ? ' active' : '');
    c.textContent = label;
    c.onclick = () => { curProv = (curProv === val ? '' : val); buildProvChips(); resetAndRender(); };
    box.appendChild(c);
  };
  add('全国', '');
  provs.forEach(p => add(shortProv(p) + ' ' + all.filter(x => x.type === curT && x.prov === p).length, p));
  box.classList.add('show');
}
function applyType(t) {
  curT = TYPE[t] ? t : 'food';
  document.title = TYPE[curT].title + ' | 全国旅游攻略地图';
  document.querySelector('meta[name="description"]').content = '全国' + TYPE[curT].label + '精选，含游客真实评价、价格与高德导航。';
  document.getElementById('title').textContent = TYPE[curT].title;
  document.querySelectorAll('.tbtn').forEach(b => { const on = b.dataset.t === curT; b.classList.toggle('active', on); b.setAttribute('aria-selected', on); });
  curProv = '';
  buildProvChips();
  resetAndRender();
  try { history.replaceState(null, '', location.pathname + '?t=' + curT); } catch (e) {}
}
document.querySelectorAll('.tbtn').forEach(b => b.onclick = () => applyType(b.dataset.t));
document.getElementById('kw').addEventListener('input', function() { kw = this.value.trim(); resetAndRender(); });
document.getElementById('sortSel').onchange = function() { sort = this.value; resetAndRender(); };
document.getElementById('more').onclick = renderPage;

fetch('data/featured.json').then(r => r.json()).then(f => {
  all = f.filter(x => x.type !== 'scenic');
  updateWishCount();
  applyType(q('t') || 'food');
}).catch(() => {
  document.getElementById('list').innerHTML = '';
  const em = document.getElementById('empty');
  em.textContent = '数据加载失败，请检查网络后刷新重试';
  em.style.display = 'block';
});
</script>
</body>
</html>
